- id: world.sets.corner_shop
  statement: |
    Shop interior in shop-local coordinates (origin at the door threshold centre, +depth into
    the shop, +right as seen entering). Counter left of the door with a plain till box and the
    back-room doorway behind it; two low aisles; three upright fridges across the back wall;
    the USB wall socket low on the back wall at the right-hand corner, hidden behind a
    freestanding tiered display stand. Exterior: fascia with a pictogram sign, a striped
    awning, door glass and window mostly covered from inside.
  value:
    footprint_m:
    - 4.5
    - 9.0
    ceiling_m: 2.7
    counter:
      size_m:
      - 1.8
      - 0.6
      - 1.0
      position: front_left
    back_room_doorway:
      size_m:
      - 0.8
      - 2.0
      behind_counter: true
      strip_curtain: true
    aisles:
      count: 2
      gondola_height_m: 1.5
      gondola_length_m: 5.0
      aisle_width_m: 0.9
    fridges:
      count: 3
      size_m:
      - 0.7
      - 0.7
      - 2.0
      wall: back
    socket:
      wall: back
      corner: right
      height_m: 0.3
      depth_from_door_m: 8.9
    display_stand:
      size_m:
      - 0.6
      - 0.4
      - 1.3
      gap_to_wall_m: 0.25
      tiered: true
    ceiling_panels: 4
    awning:
      depth_m: 1.0
      height_m: 2.3
      striped: true
    fascia_sign:
      size_m:
      - 3.0
      - 0.5
      content: basket_pictogram
      lit_before_blackout: true
  rationale: |
    Putting the socket at the very back, low and behind a stand, makes him cross the whole shop
    and kneel for it (the public, effortful dash that makes this failure cost more than the
    car), and it puts him in the deepest part of the room when the lights go, with the door as
    a small far rectangle behind him. The fridges on the back wall are right in front of him,
    so their hum and glow dying is the event he sees. Rejected: a socket by the door (no
    effort, and daylight from the door would light him).
