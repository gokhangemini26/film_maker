- id: world.sets.ren_car
  statement: |
    Hero car model, exterior plus the front half of the interior (driver seat, passenger seat,
    dashboard, glovebox, rear-view mirror, steering wheel, ignition key). Rear seats and boot
    interior are dark and simplified.
  value:
    length_m: 3.4
    width_m: 1.48
    height_m: 1.45
    wheelbase_m: 2.3
    door_length_m: 1.05
    door_open_angle_deg: 60
    sill_height_m: 0.32
    seat_height_m: 0.45
    windscreen_rake_deg: 30
    glovebox:
      opening_m:
      - 0.32
      - 0.15
      depth_m: 0.2
      lid: hinged_at_bottom_drops_down
      reach_from_driver_seat_m: 0.75
      contents:
      - crank_charger
      - charging_cable
      - paper_napkins
    dash_socket: centre_console_12v_with_usb_adapter
    rear_view_mirror_m:
    - 0.22
    - 0.06
    interior_detail: front_half_only
  rationale: |
    The car carries three beats (plant, stall, final image), so it is the one set built as a
    hero. The narrow body (1.48 m) keeps the glovebox 0.75 m from the driver's hand, so the
    charger can clunk onto his lap in one move as SC01 needs. The open passenger door (60°)
    over a 1.8 m pavement makes a frame within the frame for the turn. The glovebox holds only
    what the story needs plus napkins for ordinariness: no torch or power bank that would ask
    "why not use that?". Rejected: a full interior (unseen cost).
  serves:
  - intent.earned_last_signal
  - intent.comic_then_tender
  - intent.soft_but_cinematic
  depends_on:
  - world.locations.ren_car
  - story.crank_plant
