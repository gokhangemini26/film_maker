domain: world
entries:
- id: world.era
  statement: |
    Present day. Ordinary contemporary technology: smartphones with USB charging, cars old
    enough to have a physical ignition key and a 12 V dash socket, wall sockets with built-in
    USB ports. Nothing futuristic, nothing retro-styled.
  value:
    era: contemporary
    year: unspecified_present
    tech_level: everyday_consumer
    phone: touchscreen_smartphone
    charging: usb_cable_single_port_shape
  rationale: |
    The whole plot is a battery percentage, so the audience must recognise every object on
    sight without explanation: a phone, a cable, a car socket, a shop socket, a crank charger.
    Present day is the only era where all of these are ordinary. Rejected: a slightly retro or
    "timeless" anime town (flip phones, CRT shop signs), which would make the dying smartphone
    feel like a period detail and put a style question between the viewer and the race.
  serves:
  - intent.race_against_battery
  - intent.anime_feel
  depends_on:
  - story.premise
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
- id: world.setting
  statement: |
    An unnamed, fictional small-town residential neighbourhood with no country markers: no
    script, flags, brands, road signs or landmarks. Its building vocabulary is drawn from the
    everyday townscapes common in Japanese animation (low two-storey houses, utility poles
    carrying overhead wires, pole-mounted street lamps, a small corner shop with an awning)
    combined into an original place. Traffic drives on the left; cars are right-hand drive.
  value:
    place: fictional_unnamed_neighbourhood
    country: none_shown
    vocabulary:
    - low_two_storey_houses
    - utility_poles_with_overhead_wires
    - pole_mounted_street_lamps
    - small_corner_shop_with_awning
    - low_garden_walls
    traffic_side: left
    car_drive: right_hand_drive
    national_markers: false
  rationale: |
    Overhead wires, lamp poles and low rooflines give strong, cheap silhouettes against a
    gradient sky, which is how the film gets its Japanese-animation feel from shapes rather
    than from words or national symbols (tone.wordless forbids the signage that would place it
    anyway). Left-hand traffic is fixed so the car's geometry is decided once: the passenger
    door and glovebox face the pavement, which is where the turn and the final image happen.
    Rejected: naming a real country or city (story.locations left it open, and a real place
    invites identifiable streets and readable signs); a dense downtown (signage everywhere,
    passers-by, many power sources in reach).
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  depends_on:
  - story.locations
  - tone.wordless
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
  notes: |
    Traffic side is a staging convenience, not a story point. The human may flip it at no
    cost before G5 (mirror the street set); after G5 it touches every exterior shot.
- id: world.rules.no_readable_text
  statement: |
    No surface in the world carries readable text: no shop names, signs, posters, labels,
    packaging text, price tags, dashboard legends, car badges, number-plate characters, house
    numbers, street names, road markings with words, book spines or sketchbook writing.
    Information is carried by pictograms, shapes and colour blocks. The typed invitation on
    Ren's phone (and the same text if Hana's screen is shown) is the only text in the film.
  value:
    readable_text_in_world: false
    allowed_instead:
    - pictograms
    - simple_shapes
    - colour_blocks
    - numbers_only_on_phone_ui
    number_plates: blank_plates
    house_numbers: none
    clocks: none
    exceptions:
    - the_typed_invitation_on_phone_screens
  rationale: |
    Implements the locked tone.wordless inside the world, where stray text usually sneaks in
    (packaging, signage, dashboards, plates). Keeping the world free of all characters, even
    numbers, protects the invitation as the only words the audience reads, so it lands at the
    send. Numbers are allowed by canon but kept to the phone UI: a clock would add a second
    meter (story.escalation rejects one) and house numbers or plates would read as places.
    Rejected: blurred or foreign-script "fake" text, which still reads as text and could be
    identified as a real language.
  serves:
  - intent.race_against_battery
  - intent.open_hopeful_ending
  depends_on:
  - tone.wordless
  - story.escalation
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
- id: world.rules.weather
  statement: |
    Clear, dry and calm for the whole film. A few thin, high clouds sit low in the western sky
    and catch the colour of the sunset and afterglow. No wind, no rain, no puddles, no haze
    beyond natural distance softening.
  value:
    weather: clear
    precipitation: none
    ground: dry
    wind: calm
    clouds: few_thin_high_clouds_low_in_west
    fog: none
  rationale: |
    Resolves the untagged "weather: clear" in SCENES.yaml (G2 review finding 12) as a world
    decision. Clear weather is what lets golden hour pour through the windscreen and lets the
    same dusk sky over his kerb and her window read as one sky; the few high clouds give the
    pastel sunset colour somewhere to live and give the sky depth without simulation. Calm air
    keeps hair and cloth still, which suits held anime poses and costs nothing to animate.
    Rejected: rain (wet streets are gritty and melancholy, pulling toward melodrama, and would
    give him a reason to stay in the car); a completely cloudless sky (a flat gradient reads
    as a backdrop, not cinema).
  serves:
  - intent.soft_but_cinematic
  - intent.comic_then_tender
  depends_on:
  - story.locations
  applies_to:
  - SC01
  - SC02
  - SC03
  - SC04
  - SC05
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
- id: world.rules.season
  statement: |
    Early summer, a mild, warm evening. Long daylight: the sun sets a little after seven, so
    an invitation to dinner "at 8" is sent in the dusk that follows. Windows in the
    neighbourhood are lit and some are open.
  value:
    season: early_summer
    temperature: mild_warm
    sunset_local_time: about_19_15
    dusk_window: about_19_15_to_19_45
  rationale: |
    A warm evening makes sitting on the kerb natural rather than miserable (never tragedy)
    and lets both characters wear light clothes that keep proxy silhouettes simple. Long
    daylight gives golden hour, then a dusk that still leaves time for dinner, which keeps
    the invitation plausible and the ending hopeful. Rejected: autumn or winter (early dark,
    cold kerb, heavier clothes; the dark would arrive too early for "tonight" to be hopeful).
  serves:
  - intent.open_hopeful_ending
  - intent.soft_but_cinematic
  depends_on:
  - story.message
  - story.locations
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
  notes: Wardrobe consequences belong to the character-designer (light clothing, no coats).
- id: world.rules.time_and_sun
  statement: |
    The street runs east-west. The low sun sits at the west end of the street, along its axis,
    so it shines straight through the windscreen of Ren's west-facing car. SC01-SC03 are one
    continuous golden-hour stretch of a few minutes. The sun sets off screen between SC03 and
    SC04 (about ten minutes pass while he sits in the dark shop and walks back). SC04, SC05 and
    SC06 are one continuous stretch of civil twilight: the sky is the same at his kerb and at
    her window, and SC05 happens in the same minute as the send.
  value:
    street_axis: east_west
    sun_azimuth: along_street_axis_west
    sc01_sc03:
      time_of_day: golden hour
      sun_elevation_deg: about_6
      continuous: true
    gap_sc03_sc04_min: about_10
    sunset_on_screen: false
    sc04_sc06:
      time_of_day: dusk
      phase: civil_twilight
      sun_elevation_deg: about_minus_3
      continuous: true
    sc05:
      time_of_day: dusk
      scenes_heading_says: evening
      same_sky_as:
      - SC04
      - SC06
  rationale: |
    Fixing the geography of the sun turns story.locations' "golden hour into dusk" into a
    buildable fact: one sun direction for the whole street, a real passage of time between the
    comic middle and the tender end, and one twilight shared by both characters. Hana's
    "evening" and Ren's "dusk" are the same minute, so her window must show his sky: that is
    the only visual link between two people who never share a frame, and it makes her smile
    feel like it happens under the sky he is looking at in the final image. Hiding the sunset
    in a cut keeps it from becoming a spectacle at the turn. Rejected: the sun setting on
    screen during the crank (a big, sentimental light event that would compete with the phone
    glow and push toward saccharine).
  serves:
  - intent.soft_but_cinematic
  - intent.open_hopeful_ending
  - intent.comic_then_tender
  depends_on:
  - story.locations
  - story.ending
  - story.escalation
  applies_to:
  - SC01
  - SC02
  - SC03
  - SC04
  - SC05
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
  notes: |
    SC05 is headed EVENING in SCENES.yaml; in world terms it is dusk. Shot environment for
    SC05 should carry both words (e.g. "evening (dusk)") so the continuity check against
    SCENES.yaml still matches. Colour and light style of the sky belong to the look-director.
- id: world.rules.power
  statement: |
    The street and the rest of the neighbourhood have power the whole time: street lamps come
    on (off screen, before SC04) and house windows are lit. Only the corner shop fails: its
    single old circuit trips when the fridge compressors cut in at the moment Ren's cable goes
    in. The shop has no emergency lighting and stays dark for the rest of the film. The car's
    own battery is old and weak: when the engine stalls it takes the dash, the socket and the
    adapter light with it, and the car does not start again. No other power source is in
    reach: no vending machines, public charging points, other open shops, power banks or
    passers-by.
  value:
    street_power: on_throughout
    street_lamps: on_from_sc04_switch_on_off_screen
    house_windows: lit_at_dusk
    shop:
      cause: old_single_circuit_trips_when_fridge_compressors_start
      his_fault: false
      emergency_lighting: false
      restored_on_screen: false
    car:
      cause: engine_stalls_weak_old_battery_goes_flat
      restarts: false
      smoke_or_particles: false
    other_sources_in_reach: none
  rationale: |
    Implements story.locations' "blackout_scope: shop_only" as a mechanism the sets can show:
    lit windows and street lamps around a dark shop say "bad timing, not disaster", and the
    shop's dark front stays in the background of SC04 and SC06 as a quiet record of the
    failure without a gag. The trip coincides with his plug-in but is caused by the shop's own
    fridges, so the comedy is the world's timing, not his clumsiness (tone.comedy_source
    excludes humiliation). Removing every other source (vending machines, charging points)
    closes the viewer's "why not just...?" so that only his own hands are left
    (intent.earned_last_signal). Lamps switch on off screen and the shop never comes back on,
    because either event on screen after the turn would be an ironic gag (tone.the_turn).
    Rejected: a street-wide blackout (reads as a disaster); the car overheating with steam
    (spectacle, particles, and the creative direction limits it to sound, a slump and a light
    change).
  serves:
  - intent.race_against_battery
  - intent.earned_last_signal
  - intent.comic_then_tender
  depends_on:
  - story.locations
  - story.escalation
  - tone.comedy_source
  - tone.the_turn
  applies_to:
  - SC01
  - SC03
  - SC04
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
- id: world.rules.nobody_else
  statement: |
    No one but Ren appears on the street or in the shop. The street is a quiet dead end that
    stops at a low railing above the slope to the west, so there is no through traffic. It is
    dinner time: households are indoors behind lit, curtained windows (light only, never
    figures). The shopkeeper is implied, never seen: a doorway behind the counter to a back
    room, with a hanging strip curtain.
  value:
    extras_on_screen: none
    traffic: none_dead_end_street
    people_in_windows: false
    shopkeeper: implied_back_room_never_seen
  rationale: |
    story.cast needs no extras and wants nobody to help him. A dead-end street at dinner time
    makes that emptiness natural rather than eerie, and the lit windows of other households
    sitting down to dinner are the evening he is trying to have, told without a figure. An
    implied shopkeeper explains an open, unattended shop while keeping the solution in his
    hands and saving a proxy character. Rejected: a background shopkeeper silhouette
    (allowed by story.cast, but one more model, and the audience would wonder why he doesn't
    ask for help).
  serves:
  - intent.earned_last_signal
  - intent.race_against_battery
  - intent.open_hopeful_ending
  depends_on:
  - story.cast
  applies_to:
  - SC01
  - SC02
  - SC03
  - SC04
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
- id: world.rules.one_port
  statement: |
    Every power source in the film offers the same USB port shape, and Ren uses one cable for
    all three: the adapter in the car's dash socket (SC01), a wall socket with built-in USB
    ports in the shop (SC03), and the crank charger (SC04). No mains plug or adapter brick is
    needed.
  value:
    cable_count: 1
    sources:
      SC01: car_dash_usb_adapter
      SC03: shop_wall_socket_with_usb_ports
      SC04: crank_charger_usb_port
    same_port_shape: true
  rationale: |
    One cable and one port shape make the three plug-ins a visual rhyme the audience learns:
    the same small gesture fails twice and works the third time, which is the shape of the
    film. It also removes a continuity problem (car adapter vs wall plug) and a prop.
    Rejected: a separate wall charger brick for the shop (a second prop to carry, and a new
    object at the moment the gag needs speed).
  serves:
  - intent.earned_last_signal
  - intent.race_against_battery
  depends_on:
  - story.crank_plant
  applies_to:
  - SC01
  - SC02
  - SC03
  - SC04
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
  notes: Continuity (cinematographer) tracks the cable car -> shop -> kerb (G2 review finding 12).
- id: world.locations.street
  statement: |
    A short, quiet, east-west residential street of low two-storey houses behind low garden
    walls, with raised pavements on both sides, utility poles on the south side carrying
    overhead wires, and pole-mounted street lamps. Ren's car is parked at the south kerb facing
    west; the corner shop is on the same side, two doors west of the car. The west end stops
    at a low railing above a slope, so the western sky is open to the horizon over distant low
    rooftops.
  value:
    length_m: 60
    carriageway_width_m: 5.5
    pavement_width_m: 1.8
    kerb_height_m: 0.12
    building_height_m: 6.0-7.5
    garden_wall_height_m: 1.0
    utility_pole_height_m: 9.0
    lamp_height_m: 5.0
    car_to_shop_door_m: 12
    west_end: low_railing_open_sky
    east_end: fades_into_more_houses
  rationale: |
    One short street holds both of Ren's spaces, as story.locations requires, and a twelve-metre
    sprint fits the 2 s of SC02. The open western end is the film's one big sky: it sends the
    golden light straight down the street and gives the final image a horizon to look up at.
    Poles and wires draw silhouette lines across that sky, which is the anime townscape
    vocabulary done with a handful of cylinders and curves. Rejected: a wide suburban road
    (too much empty asphalt and no sense of neighbourhood) and a hillside of stairs and alleys
    (beautiful but too much geometry for the MVP and it breaks the car-to-shop sightline).
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  - intent.race_against_battery
  depends_on:
  - story.locations
  - world.setting
  - world.rules.time_and_sun
  applies_to:
  - SC01
  - SC02
  - SC04
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
- id: world.locations.ren_car
  statement: |
    Ren's small old two-door hatchback, right-hand drive, parked at the south kerb facing
    west. Around fifteen to twenty years old, well used and looked after: sun-faded paint, a
    slightly worn driver's seat, a physical ignition key, a simple dashboard with unlabelled
    dials and buttons, a 12 V socket holding a USB adapter, and a drop-down glovebox on the
    passenger side, which faces the pavement. It never moves in the film.
  value:
    body: two_door_hatchback_small_old
    drive: right_hand
    parked: south_kerb_facing_west
    age_years: 15-20
    moves_in_film: false
    kerb_side_door: passenger
    glovebox_side: passenger_kerb_side
    badges_or_logos: none
  rationale: |
    The brief says a small old car. Old enough to have a key and a weak battery makes the
    stall believable without smoke; small makes it his (a first car, bought cheap) and puts
    the glovebox within arm's reach from the driver's seat for the plant. Looked-after rather
    than a wreck keeps us laughing with him, not at him. With the passenger side on the kerb,
    the glovebox faces the pavement where he sits for the turn, so the payoff happens in the
    same frame as the kerb. Rejected: a battered junker (mockery, and the failure would feel
    deserved) and a four-door saloon (more geometry, glovebox out of reach).
  serves:
  - intent.comic_then_tender
  - intent.earned_last_signal
  - intent.race_against_battery
  depends_on:
  - story.crank_plant
  - story.cast
  - tone.register
  - world.setting
  applies_to:
  - SC01
  - SC02
  - SC04
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
  notes: |
    Door continuity (G2 review finding 3, screenwriter's): he leaves by the driver's door in
    SC02 (road side); the passenger door is open in SC04. The set supports either fix
    (he opens the passenger door himself in SC04, or it was left open earlier); the world does
    not decide it.
- id: world.locations.corner_shop
  statement: |
    A small, deep, narrow corner shop on the south side of the street, open late. The front
    faces north, so the low western sun never shines in; its light comes from ceiling panels,
    three upright drinks fridges on the back wall and a lit pictogram sign on the fascia. Two
    low aisles run from the door to the back. The window and door glass are mostly covered by
    shelf backs and pastel pictogram posters. A striped awning over the front. A small bell
    rings when the door opens.
  value:
    width_m: 4.5
    depth_m: 9.0
    ceiling_m: 2.7
    frontage_faces: north
    direct_sun_inside: false
    light_sources:
    - ceiling_panels
    - fridge_interiors
    - fascia_pictogram_sign
    door_bell: mechanical_bell
    sign: pictogram_basket_icon_no_text
    after_blackout: dark_for_rest_of_film
  rationale: |
    A deep, north-facing shop is what makes the blackout total in golden hour: with no sun
    coming in and the front glass covered, the back of the shop falls to near-dark when the
    power goes, so "his lit face is the only light" (SC03) is true to the world rather than a
    cheat. Fridges hum and glow, so their stopping is the sound and the light of the failure.
    A pictogram sign and posters make the shop read as a shop without a single word. Rejected:
    a bright glass-fronted convenience store (sunlight would flood in and the blackout would
    not read) and a shop with a lit counter screen or menu board (readable text).
  serves:
  - intent.comic_then_tender
  - intent.race_against_battery
  - intent.soft_but_cinematic
  depends_on:
  - story.locations
  - world.rules.power
  - world.rules.no_readable_text
  - world.rules.time_and_sun
  applies_to:
  - SC02
  - SC03
  - SC04
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
- id: world.locations.hana_room
  statement: |
    Hana's small upstairs bedroom in a similar low-rise neighbourhood elsewhere in town (never
    shown in relation to his street). Her desk sits under a west-facing window that shows the
    same dusk sky, with a band of rooftops, a utility pole and wires in silhouette. A small
    desk lamp is on. On the desk: an open sketchbook, pencils in a cup, her phone face-up
    beside the sketchbook. Pinned sketches on the wall above the desk. Tidy, lived-in, warm.
  value:
    floor: upstairs
    width_m: 3.0
    depth_m: 3.6
    ceiling_m: 2.4
    window_faces: west
    window_view: same_dusk_sky_rooftops_wires_silhouette
    desk_under_window: true
    practical: desk_lamp_on
    phone: face_up_beside_sketchbook
    time_of_day: dusk
  rationale: |
    The window is the thread between the two characters: the same afterglow, the same kind of
    rooftops and wires, so her room is plainly under his sky without a map or an establishing
    shot. Upstairs puts the window above the neighbours' roofs, so the sky fills the upper
    frame. A room that is lit, tidy and settled is the "first frame that feels complete"
    (STORY_STRUCTURE beat 8) after his emptied street. Sketching explains the headphones and
    her absorption without text. Rejected: a café or a campus library (public, busy, people
    and signs) and a ground-floor room (the sky disappears behind walls).
  serves:
  - intent.open_hopeful_ending
  - intent.soft_but_cinematic
  - intent.anime_feel
  depends_on:
  - story.arc.hana
  - story.ending
  - world.rules.time_and_sun
  applies_to:
  - SC05
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
- id: world.locations.hana_room.sketches
  statement: |
    Everything Hana has drawn, in the sketchbook and pinned on the wall, is of ordinary things:
    the view from her window, rooftops and wires, a plant, a cat, hands, cups. Never Ren, never
    a heart, never writing.
  value:
    subjects:
    - window_view
    - rooftops_and_wires
    - plant
    - cat
    - hands
    - cups
    excluded:
    - ren
    - hearts
    - writing
  rationale: |
    A drawing of Ren would tell the audience she already loves him and close the ending the
    user asked to keep open (tone.ending_restraint: she does not know how he feels). Drawing
    her own window view rhymes quietly with the sky he looks at in the final image, which is
    as far as the world should lean. Rejected: a sketch of him or a doodled heart (a
    declaration by set dressing).
  serves:
  - intent.open_hopeful_ending
  depends_on:
  - tone.ending_restraint
  - story.arc.hana
  - world.rules.no_readable_text
  applies_to:
  - SC05
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
- id: world.sets.street
  statement: |
    Street set in scene coordinates (metres, Z up): +Y points west down the street toward the
    sun and the shop, +X points north across the road, origin on the south kerb edge level with
    the centre of the car's passenger door. Only the stretch from y = -20 to y = +30 is built
    in detail; beyond it, silhouette cards and the open sky.
  value:
    axes:
      plus_y: west_sun_and_shop
      plus_x: north_across_road
      z: up
    origin: south_kerb_edge_at_car_passenger_door_centre
    road_surface_z: 0.0
    pavement_z: 0.12
    south_pavement_x:
    - -1.8
    - 0.0
    carriageway_x:
    - 0.0
    - 5.5
    north_pavement_x:
    - 5.5
    - 7.3
    building_line_south_x: -1.8
    building_line_north_x: 7.3
    car_body_x:
    - 0.2
    - 1.68
    car_body_y:
    - -1.85
    - 1.55
    shop_frontage_y:
    - 10.5
    - 15.0
    shop_door_centre:
    - -1.8
    - 12.0
    lamp_poles:
    - - -1.5
      - 15.5
    - - -1.5
      - -18.0
    utility_poles_extra:
    - - -1.5
      - 45.0
    detail_zone_y:
    - -20
    - 30
    west_railing_y: 30
    beyond_railing: open_sky_and_distant_rooftop_silhouettes
  rationale: |
    One shared coordinate frame lets the cinematographer, the look-director (sun along +Y) and
    the M3 builder place the car, shop, lamps and sun without re-deciding geography per shot.
    The car sits in the unlit gap between two lamps (15.5 m and 18 m away), so at dusk the
    phone stays the strongest light on his face at the kerb, while the lamp by the shop lights
    the shop's dark front in the background. Building only fifty metres in detail and ending
    the street in open sky keeps the set cheap and every frame deep. Rejected: a lamp right
    over the car (it would out-shine the phone, the film's light motif).
  serves:
  - intent.soft_but_cinematic
  - intent.earned_last_signal
  - intent.race_against_battery
  depends_on:
  - world.locations.street
  - world.rules.time_and_sun
  - world.rules.power
  applies_to:
  - SC01
  - SC02
  - SC04
