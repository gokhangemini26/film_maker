- id: world.props.crank_charger
  statement: |
    Ren's hand-crank charger: a chunky, rounded plastic brick with a crank arm that folds
    flat into a groove on top and swings out on one pivot, ending in a small round knob. One
    USB port on the end face and one small round indicator pip that glows while the handle
    turns. Rubberised grip on the sides, corners slightly scuffed from rattling in the
    glovebox, the hinge unworn because it has never been used. No torch, no radio, no solar
    panel, no markings.
  value:
    body_m:
    - 0.13
    - 0.065
    - 0.042
    corner_radius_m: 0.012
    crank_arm_length_m: 0.085
    crank_knob_m:
      diameter: 0.02
      length: 0.022
    pivot: one_axis_at_body_end
    folded: flush_in_top_groove
    port: usb_same_shape_as_other_sources
    indicator_pip:
      diameter_m: 0.006
      glows_while_cranking: true
    extras: none
    markings: none
    wear: scuffed_corners_unworn_hinge
    sound: ratchet_click_per_turn
  rationale: |
    No label may say "turn this for power", so the shape must: a fold-out arm with a knob is
    read as "crank" by anyone. Chunky enough to clunk comically onto his lap in SC01 and to
    hold carefully in two hands in SC04. The pip glowing only while he turns makes his effort
    visible as light, a small light he makes himself beside the phone's glow. No torch, radio
    or solar panel: each would raise a question the story does not answer (a solar panel at
    golden hour most of all). The unworn hinge says he has had it and never used it.
    Rejected: a realistic multi-function emergency radio (busy silhouette, extra questions)
    and a sleek modern power bank shape (would not read as a crank at a glance).
  serves:
  - intent.earned_last_signal
  - intent.comic_then_tender
  depends_on:
  - story.crank_plant
  - tone.the_turn
  - world.rules.one_port
  applies_to:
  - SC01
  - SC04
  - ren
  tag: DECISION
  status: LOCKED
  source: agent:world-designer
  version: 1
