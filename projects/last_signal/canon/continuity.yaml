domain: continuity
entries:
- id: continuity.sc01.environment
  statement: |
    SC01: inside Ren's car, parked at the south kerb facing west; golden hour, sun about 6
    degrees up straight down the street through the windscreen; clear. West (windscreen)
    is screen left.
  value:
    time_of_day: golden hour
    weather: clear
    location: ren's car
    screen_direction: west_screen_left_ren_faces_screen_left
  rationale: Restates locked world canon for the shot checker; the screen direction is camera.geography.screen_direction.
  serves:
  - intent.race_against_battery
  - intent.soft_but_cinematic
  depends_on:
  - world.rules.time_and_sun
  - world.rules.weather
  - world.locations.ren_car
  applies_to:
  - SC01
  tag: FACT
  status: LOCKED
  source: agent:cinematographer
  version: 1
