- id: story.locations
  statement: |
    Three spaces in total: (1) a quiet street at golden hour into dusk, with Ren's small old car parked at the kerb (car interior, the kerb beside it); (2) a small corner shop on the same street, a few steps away; (3) Hana's room, at her desk by a window, in the evening. The shop's power fails, not the street's.
  value:
    ren:
    - street_and_car
    - corner_shop_interior
    hana:
    - her_room_desk
    shared_exterior: car_and_shop_on_same_street
    blackout_scope: shop_only
    time_of_day: golden_hour_into_dusk
    country: UNKNOWN_world_designer
  rationale: |
    Putting the car and the shop on one street gives him two spaces plus hers, one fewer than the direction's ceiling, and lets him walk back to the glovebox after the blackout. Golden hour sliding into dusk gives the brighter comic middle and the dimmer, warmer tender end the direction asks for as a real passage of time rather than a grade. Keeping the blackout to the shop avoids reading as a disaster and keeps it bad timing. Rejected: a separate location for the crank (a park bench, his room), which costs a set and breaks the plant/payoff chain.
  serves:
  - intent.soft_but_cinematic
  - intent.race_against_battery
  depends_on:
  - tone.comedy_source
  tag: DECISION
  status: LOCKED
  source: agent:story-architect
  version: 1
  notes: Street design, architecture, country and signage (shapes only, no words) belong to the world-designer.
- id: story.ending
  statement: |
    The invitation sends: the progress completes and a tick appears, and Ren lets go of the crank. Hana's phone lights on her desk; she slides her headphones down, reads, and gives a small smile. Back on the kerb, his screen fades to black. He does not panic: he leans back against the car, dark phone resting on his chest, and looks up at the dusk sky. The film ends on that image. No reply, no dinner, no confession on screen.
  value:
    order:
    - send_tick
    - she_reads_smiles
    - his_screen_fades
    - final_image
    final_image: ren leaning back against the car on the kerb, dark phone on his chest, looking up at
      the dusk sky
    reply_shown: false
    dinner_shown: false
    confession_shown: false
    phone_death_tone: gentle
  rationale: |
    Ending on him rather than her keeps the final beat where the effort was, and his relaxed posture with a dead phone says "it's out of my hands now, and that's fine", which is hope rather than loss. The order follows the user's words (sends, she smiles, his phone dies). Because the audience saw him delete the heart, her smile answers the invitation while the confession is still ahead, so the ending is open and hopeful at the same time. Rejected: ending on her smile, which is sweeter but leaves his phone's death as an afterthought or a punchline; and ending on the black screen, which reads as a sad cut-off.
  serves:
  - intent.open_hopeful_ending
  - intent.earned_last_signal
  depends_on:
  - tone.ending_restraint
  - story.setup_cues
  - story.arc.ren
  tag: DECISION
  status: LOCKED
  source: agent:story-architect
  version: 1
