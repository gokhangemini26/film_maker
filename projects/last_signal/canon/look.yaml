- id: look.color.scene.sc03
  statement: |
    SC03 shop. Before the blackout: cool mint-white, bright and flat, pastel merchandise in
    rows, fridges glowing, amber bolt as the accent. After the blackout: near-black
    blue-violet, the warm-white phone glow on his face, a dim warm door rectangle far
    behind, and the red 2 %.
  value:
    dominant: "#E7F0EA"
    secondary: "#C6D8EE"
    shadow_tint: "#C9C6DA"
    key_light: "#EEF5EF"
    accent: "#F5B940"
    blackout:
      dominant: "#1E2030"
      key_light: "#FFF1DE"
      door_rectangle: "#C9A77E"
      accent: "#E5483B"
    sky: golden_hour_via_door_only
    saturation: low
    value_key: high_key_then_lowest_key_in_film
  rationale: |
    The comic peak is the film's largest value swing: the brightest interior falls in one
    frame to the darkest frame in the film. That turns "every light goes out at once" into
    an event the eye feels (CREATIVE_DIRECTION: light failing is a story event), and it
    makes the phone glow appear for the first time as the only light.
  serves: [intent.comic_then_tender, intent.race_against_battery, intent.soft_but_cinematic]
  depends_on: [look.color.shop, look.color.phone_glow, world.rules.power]
  applies_to: [SC03]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
