- id: look.color.props
  statement: |
    Hero-prop colours: Ren's car in faded butter cream, the crank charger in a faded
    cream-mustard that echoes the car, an off-white cable, the phone cases (Ren slate,
    Hana warm cream, as the character-designer recommended), a dark adapter body, a
    pale socket, and Hana's desk things.
  value:
  - {item: car_paint, hex: "#E8D8A8"}
  - {item: car_paint_sun_faded_roof_bonnet, hex: "#EFE5C8"}
  - {item: car_rubber_trim_tyres, hex: "#3E3F47"}
  - {item: car_dashboard, hex: "#7A7478"}
  - {item: car_seats, hex: "#8C8698"}
  - {item: car_headliner, hex: "#CFC8BE"}
  - {item: car_glass_tint, hex: "#9FB0C4"}
  - {item: crank_body, hex: "#D6C592"}
  - {item: crank_grip, hex: "#5E5B58"}
  - {item: crank_knob, hex: "#EDE6D6"}
  - {item: charging_cable, hex: "#E4E1DA"}
  - {item: phone_case_ren, hex: "#5E6B7A"}
  - {item: phone_case_hana, hex: "#E9DFCF"}
  - {item: car_adapter_body, hex: "#4A4B52"}
  - {item: shop_socket, hex: "#EEEAE2"}
  - {item: desk_lamp_body, hex: "#BFCFE3"}
  - {item: desk_wood, hex: "#C9A77C"}
  - {item: sketchbook_paper, hex: "#F3EEE2"}
  - {item: pencil_lines, hex: "#7D7A86"}
  - {item: pencil_cup, hex: "#9EB4C8"}
  rationale: |
    Butter cream is the warm complement of Ren's cornflower jacket, so he separates from
    the car he leans on in the final image, and it reads friendly and old, not flashy
    (world.locations.ren_car: looked after, never a wreck). The crank shares the car's
