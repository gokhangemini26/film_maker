  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
  notes: Human question at G4 (keep the red exception, or an ink heart with no exception).
- id: look.color.accent_power_amber
  statement: |
    Power amber: the one colour for power flowing. Used on the car adapter's ring light,
    the charging bolt, the crank's indicator pip, the send progress line and the sent tick,
    and nowhere else at this saturation.
  value: '#F5B940'
  rationale: |
    One colour for every sign of power makes world.rules.one_port's rhyme readable (it
    fails twice, then works) and lets the tick inherit the pip's colour, so delivery reads
    as his effort (intent.earned_last_signal). Hue about 40 degrees keeps it clear of the
    battery red. It is warm, and warm light in a cool dusk means contact. Street lamps,
    windows and the desk lamp are also warm but kept at saturation 0.40 or below, so they
    never read as this accent. Rejected: a red pip and ring (G3 finding 8), and green for
    the bolt and tick (the usual convention, but it splits the power story across two
    colours).
  serves:
  - intent.earned_last_signal
  - intent.race_against_battery
  depends_on:
