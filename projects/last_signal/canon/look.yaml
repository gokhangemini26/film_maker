- id: look.color.scene.sc04
  statement: |
    SC04 kerb, dusk. Cool lavender-blue ambient on everything in shade, an apricot
    afterglow rim from the west, warm-white phone glow on his face, and the amber pip in
    his hand. Battery red at 1 %, then 2 %. The sent tick in amber. Small warm windows and
    the lamp-lit dark shop front far behind.
  value:
    dominant: "#6F7099"
    secondary: "#ABA5CE"
    shadow_tint: "#8E88B4"
    key_light: "#FFF1DE"
    rim_light: "#F6C69C"
    accent: "#F5B940"
    accent_2: "#E5483B"
    practicals: "#F6DCA6"
    silhouette: "#5F6088"
    sky: dusk
    saturation: low
    value_key: mid_low_key_soft
  rationale: |
    The turn changes the colour key from warm-world to cool-world, with warmth now coming
    only from what is close to him: his phone and his crank. That is the tender section's
    colour idea: the world has cooled, and the warmth is in his hands
    (intent.earned_last_signal). The ambient stays a lifted lavender, never black, so it is
    "still soft, never dark or gritty" (CREATIVE_DIRECTION).
  serves: [intent.comic_then_tender, intent.earned_last_signal, intent.soft_but_cinematic]
  depends_on: [look.color.sky.dusk, look.color.phone_glow, look.color.accent_power_amber]
  applies_to: [SC04]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.color.scene.sc05
  statement: |
    SC05 Hana's room, dusk (same minute). Warm lamp-lit cream on the wall and desk, the
    same dusk sky in the window, her sage top between the two. The phone's warm-white glow
    arrives as a second light on her face. No accent colour: the screen shows his photo,
    then only the invitation.
  value:
    dominant: "#E9CFA8"
    secondary: "#ABA5CE"
    shadow_tint: "#A59CC0"
    key_light: "#FFD29A"
    second_key: "#FFF1DE"
    silhouette: "#5F6088"
    sky: dusk
    saturation: low_medium
    value_key: mid_key_balanced
  rationale: |
    Her frame is the first complete one: warm and cool in balance, no alarm colour, no red.
    No battery is on screen here, which makes it feel like a held breath. The same sky in the window and the same phone-glow colour on her face as
    on his are the two colour links between them (intent.open_hopeful_ending).
  serves: [intent.open_hopeful_ending, intent.soft_but_cinematic]
  depends_on: [look.color.sky.dusk, look.color.hana_room, look.color.phone_glow]
  applies_to: [SC05]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.color.scene.sc06
  statement: |
    SC06 kerb, moments later. The same dusk sky as SC04. His screen fades to off
    (#1F2029). After that his face is lit only by the sky ambient and the apricot
    afterglow rim. The final image: a cool, lifted frame with the one warm edge on his
    upturned face.
  value:
    dominant: "#6F7099"
    secondary: "#ABA5CE"
    shadow_tint: "#8E88B4"
    key_light_before_fade: "#FFF1DE"
    key_light_after_fade: "#F6C69C"
    screen_off: "#1F2029"
    silhouette: "#5F6088"
    sky: dusk
    saturation: low
    value_key: mid_low_key_soft
  rationale: |
    When the phone's warmth goes out, the sky's warmth takes over on his face. The last
    light he gets comes from the sky Hana is under, not from a device, which makes the dark
    phone read as "out of my hands, and that's fine": hope rather than loss
    (intent.open_hopeful_ending, tone.ending_restraint). Rejected: letting the frame go
    cold and dark after the fade, which tips the ending toward sadness.
  serves: [intent.open_hopeful_ending, intent.soft_but_cinematic]
  depends_on: [look.color.sky.dusk, tone.ending_restraint]
  applies_to: [SC06]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.color.rule.pastel_range
  statement: |
    Pastel range for world surfaces, props, sky and lights (the phone UI is governed by
    look.color.ui): HSV saturation at or below 0.45, and lit-side value at or above 0.35.
    Exempt: the three UI accents (red, amber, green), the key darks (character hair, brows and eyes from character canon, outlines,
    wires, tyres, the adapter body, the dark phone screen, UI ink) and the SC03 blackout.
  value:
    max_saturation: 0.45
    min_lit_value: 0.35
    exempt: [accent_battery_red, accent_power_amber, accent_call_green, ui_heart, character_hair_brows_eyes,
      outlines, overhead_wire, car_rubber_trim_tyres, car_adapter_body, screen_off, ui_ink, sc03_blackout]
  rationale: |
    Turns the user's "pastel colours" into a number QA can test on any sampled colour. The
    exemptions are the few things that must be dark or saturated to do their job (the
    stakes and the line work), so the rule protects contrast without making the film
    washed out (tone.anti_goals: saccharine is guarded by keeping real darks). Rejected: no
    numeric rule (pastel drift is the direction's named risk).
  serves: [intent.soft_but_cinematic]
  depends_on: [look.color.primary, look.color.secondary]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

# ---------------------------------------------------------------- exposure
- id: look.exposure.value_structure
  statement: |
    Where blacks and whites sit. Film floor: #1B1C29, used only in the SC03 blackout.
    Elsewhere no area larger than the key darks falls below value 0.30 (#34354F on the
    lavender axis). Only the phone UI background, the emissive cores (lamp bulbs, fridge
    panels, the sun if ever in frame) and the amber/red indicators may clip. Skin, cloth,
    car paint and the dusk sky never clip. Under its scene key, a character's lit tone
    renders within 8 % value of its lit colour (look.style.character_shading). While a
    phone screen is on in SC04-SC06, it is brighter than any part of the sky.
  value:
    film_floor_hex: "#1B1C29"
    film_floor_scenes: [SC03]
    floor_elsewhere_value: 0.30
    floor_elsewhere_hex: "#34354F"
    may_clip: [phone_ui_background, emissive_cores, amber_indicators, red_indicators]
    never_clip: [skin, cloth, car_paint, dusk_sky, golden_sky_above_horizon_band]
    lit_tone_tolerance_value: 0.08
    phone_brighter_than_sky_while_on: [SC04, SC05, SC06]
  rationale: |
    "How dark is night" is answered as: not very. The tender section stays lifted so the
    ending is soft (CREATIVE_DIRECTION: never dark or gritty). The one true black is
    reserved for the shop blackout, so it lands as the film's biggest light event. Keeping
    the phone brighter than the sky keeps the phone the brightest thing near him (AD
    principle 2) even with the sky in frame. Rejected: crushed blacks at dusk
    (melodrama) and a uniformly bright dusk (no dusk).
  serves: [intent.soft_but_cinematic, intent.comic_then_tender, intent.race_against_battery]
  depends_on: [look.style.render_constraints, look.color.scene.sc03]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.exposure.scene_keys
  statement: |
    Target mean frame luminance per scene (0-1, display-referred): SC01 0.62, SC02 0.70,
    SC03 lit 0.74 then blackout 0.08, SC04 0.46, SC05 0.52, SC06 0.42. A tolerance of
    plus or minus 0.06 per shot.
  value:
    SC01: 0.62
    SC02: 0.70
    SC03_lit: 0.74
    SC03_blackout: 0.08
    SC04: 0.46
    SC05: 0.52
    SC06: 0.42
    tolerance: 0.06
  rationale: |
    Plots the direction's energy curve as light: brisk and bright through the comedy,
    peaking at the shop, a drop at the blackout, then a lower, steady tender key that
    settles slightly for the final image without going dark. Numbers make the arc testable
    at G6 on rendered frames. Rejected: one exposure for the whole film (loses the arc).
  serves: [intent.comic_then_tender, intent.soft_but_cinematic]
  depends_on: [look.exposure.value_structure]
  applies_to: [SC01, SC02, SC03, SC04, SC05, SC06]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

# ---------------------------------------------------------------- lighting
- id: look.lighting.principles
  statement: |
    Every light names a source in the world (look.color.light_sources, the LIGHTING_BIBLE
    motivation maps). There are no unnamed fills or rims: a fill is "bounce from X", a rim
    is "sky afterglow" or "fridges". Key strategy across the film: in the comedy the key
    is the world's light (the sun, the shop panels); from the blackout on, the key is his
    own light (the phone, then the crank pip), with the sky as ambient. At the end, warmth
    passes from the phone to the sky.
  value:
    motivation_required: true
    unnamed_fill_or_rim: false
    comic_key: world_light
    tender_key: personal_light
    final_warmth_source: sky_afterglow
  rationale: |
    Motivated light is the "lit like cinema" half of intent.soft_but_cinematic. Moving the
    key from the world's light to his own light is the arc of story.theme (borrowed power
    fails, his own power works) told in light, so it serves intent.earned_last_signal.
    Rejected: a beauty-lit anime look with free rims on every shot (flat, and it would erase
    the light arc).
  serves: [intent.soft_but_cinematic, intent.earned_last_signal, intent.comic_then_tender]
  depends_on: [story.theme, look.color.light_sources]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.lighting.sc01
  statement: |
    SC01 car, golden hour. Key: the low sun (6 degrees up) straight down the street
    through the windscreen, warm and hard, frontal to Ren when the camera looks back at
    him and backlight when it looks forward past him. A-pillar and roof edge cast hard
    shadow bars. Fill: bounce from the sunlit dashboard and bonnet, warm and soft. Sky
    fill from the side windows, cool. Practicals: the dash lights and the adapter's amber
    ring, both off in the frame the engine stops. The phone's glow is not visible on his
    face in the sun.
  value:
    key: {source: sun, kelvin: 3200, direction: from_plus_y_along_street, elevation_deg: 6, quality: hard}
    fill: {source: dash_and_bonnet_bounce, quality: soft}
    ambient: {source: sky_through_side_windows, kelvin: 9000}
    contrast: "4:1"
    rim: sun_when_camera_faces_west
    practicals: [car_dash_lights, car_adapter_ring]
    practical_off_event: engine_stall_same_frame
    phone_glow_visible_on_face: false
    volumetrics: none
  rationale: |
    The sun is where world.rules.time_and_sun puts it. Hard sun with warm bounce makes the
    nervous opening bright and comic, never moody. The hard pillar shadows give graphic cel
    shapes in a small space. Losing the dash light and the ring in the same frame as the
    stall is the car's failure told in light (world.props.car_usb_adapter,
    CREATIVE_DIRECTION: sound, a slump and a light change). Rejected: a soft fill light
    inside the car to "see his face" (unmotivated, and the backlit silhouette is the
    design, characters.ren.silhouette).
  serves: [intent.comic_then_tender, intent.race_against_battery, intent.soft_but_cinematic]
  depends_on: [world.rules.time_and_sun, world.sets.ren_car, world.props.car_usb_adapter, world.rules.power]
  applies_to: [SC01]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.lighting.sc02
  statement: |
    SC02 street, golden hour. Key: the same sun, raking down the street from the west.
    Ren runs into it: rim and backlit silhouette from behind, warm frontal from ahead.
    Long shadows fall east toward the car. Fill: the pale sky from above and bounce from
    the sunlit north-side house walls. No practicals lit (the lamps are off, the shop sign
    is lit but weak in daylight).
  value:
    key: {source: sun, kelvin: 3200, direction: from_plus_y, elevation_deg: 6, quality: hard}
    fill: {source: sky_and_north_wall_bounce, kelvin: 9000, quality: soft}
    contrast: "4:1"
    rim: sun
    shadows: long_toward_minus_y
    practicals: [shop_fascia_sign_weak]
    volumetrics: none
  rationale: |
    The long raking light makes a two-second dash read as a chase toward the light and
    the shop (ART_DIRECTION_BIBLE hierarchy), and the long shadows are the most graphic
    golden-hour cue a cel look can use. Rejected: shooting the run in shade (loses the
    hope in the first failure's aftermath).
  serves: [intent.comic_then_tender, intent.race_against_battery]
  depends_on: [world.rules.time_and_sun, world.sets.street]
  applies_to: [SC02]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.lighting.sc03
  statement: |
    SC03 shop. Lit state: key is the four ceiling panels, soft and cool, near-shadowless,
    low contrast; the three fridges glow cool on the back wall in front of him and edge
    his silhouette against them when the camera looks toward the back wall; the door glass is a warm gold rectangle at the far end. Blackout state:
    every shop source (panels, fridges, fascia sign) goes off in one frame, on the clunk.
    Nothing else changes. The only lights left are the phone screen under his face (key,
    from below-front, warm white, soft falloff over about 0.5 m) and the faint warm door
    rectangle behind him. No fill. The unlit side of his face drops to the blackout
    ambient.
  value:
    lit:
      key: {source: ceiling_panels, kelvin: 5000, quality: soft_top}
      rim: {source: fridges, kelvin: 6500}
      background: door_glass_warm_rectangle
      contrast: "2:1"
    blackout_event:
      sources_off: [ceiling_panels, fridges, fascia_sign]
      transition_frames: 1
      sync: clunk_sound
      restored: false
    blackout:
      key: {source: phone_screen, direction: below_front, falloff_m: 0.5, quality: soft}
      background: {source: door_glass_bounce, level: faint}
      fill: none
      contrast: "16:1"
    volumetrics: none
  rationale: |
    A shadowless, bright, uniform shop is comic order, and a one-frame blackout is the
    world's timing landing all at once (tone.comedy_source, world.rules.power). With no
    fill, the phone becomes the only key for the first time, the moment the glow motif is
    born. The faint door keeps a sense of the room and the golden world outside he has lost
    (ART_DIRECTION_BIBLE hierarchy). Rejected: a slow fade-down (reads as a dimmer, not a
    trip) and emergency lighting (world.rules.power forbids it).
  serves: [intent.comic_then_tender, intent.race_against_battery, intent.soft_but_cinematic]
  depends_on: [world.rules.power, world.sets.corner_shop, world.locations.corner_shop, look.color.scene.sc03]
  applies_to: [SC03]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.lighting.sc04
  statement: |
    SC04 kerb, dusk. Ambient: the dusk sky, a large soft cool source from above. Rim: the
    afterglow from the west (his right as he sits facing the pavement), low, warm and soft.
    Key on his face: the phone, from below-front, warm white. Before the crank it flickers
    (irregular dips to 70 %); from the first crank turn it holds steady. The crank pip
    lights only his crank hand, within about 0.1 m. The shop's lamp (15.5 m west) lights
    only the shop front in the background. Lit windows across the street are small, dim
    warm shapes. No fill beyond the sky.
  value:
    ambient: {source: dusk_sky, kelvin: 10000, quality: very_soft_top}
    rim: {source: afterglow_west, kelvin: 3000, quality: soft_low}
    key: {source: phone_screen, direction: below_front, quality: soft}
    key_states: {before_crank: flicker_dips_to_70pct, from_first_crank_turn: steady, after_send: steady}
    hand_light: {source: crank_pip, reach_m: 0.1, lit_while: turning}
    background_practicals: [street_lamp_by_shop, house_windows]
    street_lamp_reaches_ren: false
    contrast: "4:1"
    fill: sky_only
    volumetrics: none
  rationale: |
    world.sets.street put the car in the unlit gap between lamps so that his own light
    wins. The steadying glow is the screenplay's "the glow on his face stops flickering
    and holds" and the visual form of intent.earned_last_signal: his effort stabilises
    his light. The warm afterglow rim keeps his outline readable against the cool street
    and gives the tender section a warm edge. Rejected: a lamp or window as his key (it
    would out-shine the phone), and a hard phone key (too dramatic for "quiet and slow",
    tone.the_turn).
  serves: [intent.earned_last_signal, intent.comic_then_tender, intent.soft_but_cinematic]
  depends_on: [world.sets.street, world.rules.power, world.props.crank_charger, tone.the_turn, look.color.scene.sc04]
  applies_to: [SC04]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.lighting.sc05
  statement: |
    SC05 Hana's room, dusk. Lighting is described relative to her, so it holds whichever
    camera angle G5 chooses. Key: the desk lamp on her left, warm, soft, pooled on the
    desk and the left of her face. Fill and back-edge: the dusk sky through the west
    window in front of her, cool and soft. When the phone wakes (on her right, face up),
    its warm-white glow arrives as a second key from below-right. When she holds it low to
    read, it lights her face from below. Contrast is the softest in the film.
  value:
    key: {source: desk_lamp, kelvin: 2700, side: her_left, quality: soft}
    fill: {source: dusk_sky_through_window, kelvin: 10000, side: in_front_of_her, quality: soft}
    second_key: {source: phone_screen, side: her_right_then_below, on_event: phone_wakes}
    contrast: "2.5:1"
    volumetrics: none
  rationale: |
    world.sets.hana_room and world.props.desk_lamp place the lamp and the phone on opposite
    sides so the phone's light is new on her face. A soft, balanced, low-contrast frame is
    the "first frame that feels complete". The phone glow is the same colour as on Ren, so
    the light that left his hands arrives on her face (look.style.motifs). Rejected: a hard
    or dramatic key (makes the smile an event rather than a private pleasure,
    tone.ending_restraint).
  serves: [intent.open_hopeful_ending, intent.soft_but_cinematic]
  depends_on: [world.sets.hana_room, world.props.desk_lamp, world.props.phone_hana, look.color.scene.sc05]
  applies_to: [SC05]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1
  notes: |
    DEPENDENCY: G3 finding 1 (desk under the window vs "sky behind her head") is still open.
    The lighting works for either fix. If she faces the window, the sky is front fill. If
    the desk moves side-on to the window, the sky becomes a back or side edge. Rule L13 (her
    window shows his sky) needs the window in her frame either way.

- id: look.lighting.sc06
  statement: |
    SC06 kerb, moments later. The same sky and afterglow as SC04. His screen fades from
    full to off over 24 frames (ease-out); no lamp or window changes. After the fade there
    is no key on his face except the warm afterglow rim, which catches his upturned face
    and the tuft as he looks up. Ambient sky on the rest. The contrast softens.
  value:
    ambient: {source: dusk_sky, kelvin: 10000}
    phone: {fade_frames: 24, curve: ease_out, end_state: screen_off}
    key_after_fade: {source: afterglow_west, kelvin: 3000, catches: [upturned_face, crown_tuft]}
    contrast: "2:1"
    other_light_changes: none
    volumetrics: none
  rationale: |
    The phone going dark is gentle, not a punchline (tone.ending_restraint), so it fades,
    not cuts. The afterglow finding his face as he looks up gives the final image a warm
    light that does not depend on the phone: "it's out of my hands, and that's fine"
    (story.ending). Rejected: a street lamp flicking on (ironic gag, world.rules.power) and
    a cold, unlit final face (sad).
  serves: [intent.open_hopeful_ending, intent.soft_but_cinematic]
  depends_on: [story.ending, tone.ending_restraint, world.rules.power, look.color.scene.sc06]
  applies_to: [SC06]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.lighting.power_indicators
  statement: |
    Behaviour of the amber power lights. Adapter ring: on while the car runs, off in the
    stall frame. Charging bolt: appears when a cable goes into a live source; vanishes in
    the same frame power is lost. Crank pip: glows only while the handle turns, brightness
    following crank speed, fully off within 6 frames of the handle stopping. Progress line
    and tick: amber, shown once, after the send.
  value:
    car_adapter_ring: {lit_while: engine_running, off_frames: 0}
    charging_bolt: {lit_while: cable_in_live_source, off_frames: 0}
    crank_pip: {lit_while: handle_turning, brightness: follows_crank_speed, off_within_frames: 6}
    progress_line: {fill_s: 1.0}
    sent_tick: {appears_after: progress_complete}
  rationale: |
    Instant off for the car and shop makes each failure a cut in the power story. The
    pip's gentle 6-frame decay makes it feel like his effort's afterglow, not a switch,
    which fits the tender section. Rejected: a pip that stays on after he lets go (it
    would read as the crank powering itself, which undermines the earned send).
  serves: [intent.earned_last_signal, intent.race_against_battery]
  depends_on: [look.color.accent_power_amber, world.props.crank_charger, world.props.car_usb_adapter]
  applies_to: [SC01, SC03, SC04]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.lighting.eevee_feasibility
  statement: |
    Lighting budget for EEVEE on a laptop. At most 8 lights per shot. Sun and sky are a
    sun lamp plus a world colour (no HDRI). The phone screen is an emissive plane plus one
    small area light for its cast light. The afterglow rim is a large, low area light in the
    west. No volumetrics, no light probes beyond defaults, no ray tracing. Shadows are soft
    only through light radius.
  value:
    max_lights_per_shot: 8
    sun: sun_lamp
    sky: world_colour_no_hdri
    phone_cast_light: emissive_plane_plus_small_area_light
    afterglow_rim: large_low_area_light_west
    volumetrics: false
    raytracing: false
    light_probes: defaults_only
  rationale: |
    Keeps preview renders fast enough for the G6 iteration loop. Every light listed maps
    to one world source, so the budget and the motivation rule agree. Rejected: HDRI skies
    (licence UNKNOWN, photographic) and volumetric light (cost, forbidden by
    look.style.atmosphere).
  serves: [intent.soft_but_cinematic]
  depends_on: [look.style.render_constraints, look.style.atmosphere]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1
  notes: ASSUMPTION that EEVEE in Blender 5.2 behaves like 4.x for these features; verify at M3.
