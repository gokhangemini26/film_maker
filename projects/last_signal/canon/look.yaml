- id: look.color.scene.sc02
  statement: |
    SC02 street, golden hour. Long raking gold down the street, long lilac shadows toward
    camera-east, Ren's blue running into the light. No accent except the battery in his
    outstretched hand.
  value:
    dominant: "#F3D9AE"
    secondary: "#A69CBF"
    shadow_tint: "#BDB2D2"
    key_light: "#FFD9A0"
    accent: "#E5483B"
    sky: golden_hour
