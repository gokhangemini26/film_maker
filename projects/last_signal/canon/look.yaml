    he holds in the cool dusk, catching the phone glow. The off-white cable stays readable
    against his slate trousers and the asphalt for continuity. The phone cases adopt the
    character-designer's recommendation (slate vs cream) so the inserts never confuse the
    two phones (world.props.phone_hana). Rejected: a red or orange crank (the usual
    emergency-gadget colour; forbidden by look.color.rule.only_red) and a mint car (at
    dusk it merges with his blue).
