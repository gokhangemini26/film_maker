    Phone UI palette, shared by both phones. Light-mode UI: warm off-white screen, dark
    ink for text and glyphs, pale blue sent bubble, blank keyboard, pastel unlabelled map,
    blue map pin. Accents (red, amber, green) come from their own entries.
  value:
  - {role: screen_background, hex: "#F6F2EC"}
  - {role: ink_text_and_glyphs, hex: "#2B303B"}
  - {role: icon_neutral, hex: "#6B7280"}
