  serves: [intent.comic_then_tender, intent.soft_but_cinematic, intent.race_against_battery]
  depends_on: [world.locations.corner_shop, world.sets.corner_shop, look.color.rule.only_red]
  applies_to: [SC02, SC03, SC04, SC06]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.color.hana_room
  statement: Hana's room colours (walls, bedding, shelf, curtains, chair), in lamp light.
  value:
  - {item: wall, hex: "#EDE2CF"}
  - {item: bedding, hex: "#C9C2D6"}
  - {item: shelf, hex: "#B9A58A"}
  - {item: curtains, hex: "#D9D1E3"}
  - {item: chair, hex: "#A9B7C9"}
  - {item: pinned_sketch_paper, hex: "#F1EBDD"}
  - {item: window_frame, hex: "#E6E1D8"}
  - {item: neighbour_silhouettes_dusk, hex: "#5F6088"}
  rationale: |
    Warm cream walls in lamp light with lavender and powder-blue soft furnishings make the
    first frame that feels complete: a balanced warm/cool split, where his frames were
    tipped one way. Her sage top sits between the warm walls and the cool sky. Her
    window's silhouettes use the same colour as his distant rooftops at dusk, so the
    two views read as one sky. Rejected: a warm-only cosy room (saccharine) and pink
    furnishings (look.color.rule.only_red, romantic signalling).
  serves: [intent.open_hopeful_ending, intent.soft_but_cinematic]
  depends_on: [world.locations.hana_room, world.sets.hana_room, look.color.sky.dusk]
  applies_to: [SC05]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.color.scene.sc01
  statement: |
    SC01 car, golden hour. Dominant pale gold in the sunlit cabin and windscreen, lavender
    shadows inside the car, Ren's blue as the main cool block. Accents in order: call
    green, battery red at 4 %, power amber (ring, bolt).
  value:
    dominant: "#F6D7A7"
    secondary: "#8F809A"
    shadow_tint: "#B7A9C9"
    key_light: "#FFD9A0"
    accent: "#E5483B"
    accent_2: "#F5B940"
    accent_3: "#5DB37E"
    sky: golden_hour
    saturation: medium_low
    value_key: high_key_backlit
  rationale: |
    The film opens bright and warm with nerves in it: the sun fills the windscreen, the
    cabin shadows stay lavender, not black, so the backlit comedy is soft
    (intent.comic_then_tender). All three UI accents are introduced here, so the audience
    learns red = stake and amber = power before the shop.
  serves: [intent.comic_then_tender, intent.race_against_battery, intent.soft_but_cinematic]
  depends_on: [look.color.sky.golden_hour, look.color.accent_battery_red, look.color.accent_power_amber]
