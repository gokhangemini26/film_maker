- id: look.color.sky.golden_hour
  statement: |
    Golden-hour sky (SC01-SC03; seen through the windscreen, down the street, and as the
    warm rectangle of the shop door). A pale gold horizon under the sun rising through
    apricot and cream to soft powder blue at the zenith. Positions run 0 at the western
    horizon to 1 at the zenith.
  value:
  - {pos: 0.00, hex: "#FFF0CC"}
  - {pos: 0.15, hex: "#F9D9A6"}
  - {pos: 0.40, hex: "#EFDCC4"}
  - {pos: 0.70, hex: "#C9D6E3"}
  - {pos: 1.00, hex: "#AFC3DC"}
  rationale: |
    Golden hour is the brighter, airier comic middle CREATIVE_DIRECTION asks for. Keeping
    the gold pale and the blue powdery keeps saturation for the accents and stays well
    away from the saturated magic-hour skies of look.style.originality_guards.
    Rejected: an orange-to-deep-blue sky (dramatic, saturated, and signature-adjacent).
  serves: [intent.soft_but_cinematic, intent.comic_then_tender]
  depends_on: [world.rules.time_and_sun, look.style.sky]
  applies_to: [SC01, SC02, SC03]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

- id: look.color.sky.dusk
  statement: |
    The one dusk sky (SC04, SC05, SC06), used unchanged at his kerb and in her window. An
    apricot afterglow band at the western horizon, then peach, dusty mauve, lavender, and
    periwinkle at the zenith. Positions run 0 at the western horizon to 1 at the zenith.
    Distant rooftop, pole and wire silhouettes against it use look.color.scene.* silhouette.
  value:
  - {pos: 0.00, hex: "#F4C49A"}
  - {pos: 0.12, hex: "#EFC3AE"}
  - {pos: 0.35, hex: "#D7BFC8"}
  - {pos: 0.65, hex: "#ABA5CE"}
  - {pos: 1.00, hex: "#8C93C2"}
  rationale: |
    This is the dimmer, warmer-at-the-horizon tender end the direction asks for, "still
    soft, never dark". The warm band sits low, so the afterglow gives Ren a warm rim from
    the west while the ambient above him turns cool. One asset for both locations makes
    world.rules.time_and_sun's "same sky" exact and cheap. The mauve stop is barely pink
    (S about 0.11) so the sky never reads as romantic signalling or competes with the
    red. Rejected: a sky that darkens between SC04 and SC06 (breaks the same-minute rule
    for SC05 and makes the ending feel like nightfall) and a rose-pink band (breaks
    look.color.rule.only_red, reads saccharine).
  serves: [intent.open_hopeful_ending, intent.soft_but_cinematic, intent.comic_then_tender]
  depends_on: [world.rules.time_and_sun, world.locations.hana_room, look.style.sky]
  applies_to: [SC04, SC05, SC06]
  tag: DECISION
  status: PROPOSED
  source: agent:look-director
  version: 1

