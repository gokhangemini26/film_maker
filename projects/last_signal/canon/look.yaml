domain: look
entries:
- id: look.style.realism
  statement: |
    Cel-shaded Japanese-animation stylisation, about 3 on a scale where 1 is flat graphic
    and 10 is photoreal. Characters and hero props are flat cel shapes with coloured
    outlines. Backgrounds are softly painted and have no outlines. Bodies stay simple and
    sculptural. Detail goes into faces, hands, the phone screen and the crank. Nothing
    tries to look photographic.
  value:
    realism_scale_1_graphic_10_photoreal: 3
    characters: flat_cel_with_coloured_outlines
    hero_props: flat_cel_with_coloured_outlines
    backgrounds: soft_painted_no_outlines
    detail_budget:
    - faces
    - hands
    - phone_screen
    - crank_charger
    photographic_elements: none
    engine: blender_eevee_toon
  rationale: |
    Flat cel characters over softly painted backgrounds is the core visual grammar of
    Japanese TV and feature animation. Viewers recognise it before they read anything
    else, which is what intent.anime_feel asks for. It also makes the proxy characters look
    designed. When primitive bodies are flat-filled and outlined they read as graphic
    shapes. The same primitives under PBR shading look unfinished. Painted backgrounds with
    a real light direction supply the "framed and lit like cinema" half of
    intent.soft_but_cinematic. Rejected: a semi-real 3D look with subsurface skin and PBR
    cloth, which exposes the proxy bodies and cannot hold a pastel palette. Also rejected: a
    fully flat, unlit graphic look, which is soft but not cinematic.
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  depends_on:
  - characters.ren.representation
  - characters.hana.representation
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
- id: look.style.character_shading
  statement: |
    Characters and hero props use hard two-tone cel shading: a lit tone and a shadow tone
    with a crisp terminator. One extra tone is allowed only as a rim, where a motivated
    source sits behind the subject. The lit tone is the base colour mixed 30 % toward
    (base x key-light colour), so a warm key warms a colour without turning it muddy. The
    shadow tone is the base colour multiplied by the scene's shadow tint
    (look.color.scene.*), so shadows are never neutral grey or black. No smooth gradients
    on skin, hair or cloth. The only specular is a painted catchlight in the eyes. The one
    exception to the tones is Ren's face in the shop blackout (SC03), where the unlit side
    falls to the blackout ambient.
  value:
    tones: 2
    extra_rim_tone: only_when_source_behind
    terminator: hard
    lit_colour: mix(base, base_x_key_colour, 0.30)
    shadow_colour: base_x_scene_shadow_tint
    gradients_on_skin_hair_cloth: false
    specular: eye_catchlight_only
    implementation: shader_to_rgb_plus_constant_colour_ramp
  rationale: |
    Two hard tones with coloured shadows is the look viewers read as anime cel. It keeps
    shadows pastel instead of dirty, so the palette never turns gritty (tone.anti_goals).
    The 30 % key mix is the cel equivalent of per-scene colour models. A full multiply
    would turn Ren's blue jacket grey-green under the golden sun (measured: #7C857B). The
    mix keeps it blue (#7C95AE) and still reads as warm light.
    A hard terminator also makes light direction obvious in every frame, which is the test
    CREATIVE_DIRECTION sets for intent.soft_but_cinematic ("a clear light direction").
    Limiting specular to the eyes keeps faces readable in the phone glow, where glossy skin
    would compete with the screen. Rejected: three or more tones (a painterly-3D look that
    shows up simple proxy geometry) and soft-ramp toon (reads as unfinished CG).
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  depends_on:
  - look.style.realism
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
- id: look.style.background_shading
  statement: |
    Sets (street, houses, shop, car exterior beyond the hero panels, Hana's room) are
    shaded as painted backgrounds: a soft three-step ramp with a feathered terminator, a
    faint paper/brush texture, and no outlines. Detail falls off with distance: beyond
    about 20 m, surfaces are flat colour with only silhouette and one light/shadow split.
  value:
    ramp_steps: 3
    terminator: feathered
    outlines: false
    texture: paper_brush_low_amplitude
    texture_value_variation_max: 0.05
    detail_falloff_m: 20
  rationale: |
    Separating characters (hard, outlined) from backgrounds (soft, unlined) is how the
    anime frame makes figures pop without a colour clash, and it gives depth in pastel
    frames that have little saturation to spend. The low-amplitude paper texture makes the
    sets look painted rather than rendered, and it is cheap in EEVEE. Rejected:
    hyper-detailed, photo-based backgrounds (expensive, pull toward one well-known
    director's signature, see look.style.originality_guards) and outlined backgrounds
    (busy, and they flatten the depth staging).
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  depends_on:
  - look.style.realism
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
- id: look.style.outlines
  statement: |
    Coloured outlines on characters and hero props only: Ren, Hana, both phones, the crank
    charger, the cable, the headphones, the sketchbook and the car. Never pure black. Line
    width is set as a fraction of frame height: characters 0.14 % (about 1.5 px at 1080p)
    in medium shots, from 0.10 % in wides to 0.28 % in close-ups; hero props and the car
    0.10 %. Background sets have no lines. Line colours come from look.color.outline.
  value:
    outlined:
    - ren
    - hana
    - phone_ren
    - phone_hana
    - crank_charger
    - charging_cable
    - hana_headphones
    - sketchbook
    - ren_car
    not_outlined:
    - street_set
    - houses
    - shop_set
    - hana_room_set
    - sky
    - clouds
    width_pct_frame_height:
      character_medium: 0.14
      character_min: 0.1
      character_max: 0.28
      hero_prop: 0.1
      car: 0.1
    pure_black_allowed: false
    method_primary: inverted_hull_solidify
    method_alternative: grease_pencil_line_art
  rationale: |
    Lines on the people and the objects they touch are what make a cable, a knob or a
    thumb readable in a 2 s insert. They also mark "these are the story", separate from
    "this is the world". Coloured rather than black lines keep the frame pastel and soft.
    The car is outlined because it carries three beats and Ren leans on it in the final
    image. Inverted hull is engine-independent and works in EEVEE with no extra render
    pass. Rejected: black ink lines (hard, comic-book), and lines on everything (clutter,
    and the painted-background depth is lost).
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  - intent.race_against_battery
  depends_on:
  - look.style.realism
  - look.color.outline
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
  notes: |
    ASSUMPTION: Blender 5.2 EEVEE supports inverted-hull outlines (solidify, flipped
    normals, backface culling) and Grease Pencil Line Art as today. Verify at M3.
- id: look.style.texture_and_grain
  statement: |
    Surfaces are matte and simple. Wear, as the art direction describes it (fade, scuffs),
    is painted as one or two flat tone patches, never as noise or bump. One uniform
    monochrome film grain at 1.5 % luminance amplitude sits over every frame. An optional
    vignette may darken the corners by at most 10 %, the same on every shot. No other
    post filter: no chromatic aberration, no sharpening halos, no colour-grade LUT beyond
    the canon palette.
  value:
    surface_detail: flat_tone_patches
    bump_or_noise_wear: false
    grain:
      type: monochrome
      amplitude_luma: 0.015
      uniform_across_film: true
    vignette_max: 0.1
    chromatic_aberration: false
    extra_lut: false
  rationale: |
    Kind wear told in flat patches keeps the art direction's "looked-after, never grit"
    (tone.anti_goals) and suits cel shading. A fine uniform grain binds the flat cel layers
    and the painted backgrounds into one image and gives the soft palette a cinematic
    finish. At 1.5 % it cannot affect the legibility of the invitation. Rejected: heavy
    grain or paper overlays (gritty, and they fight the phone text), and no grain at all
    (a clean digital surface reads as flat animation, the thing
    intent.soft_but_cinematic says it should not be).
  serves:
  - intent.soft_but_cinematic
  - intent.anime_feel
  depends_on:
  - look.style.realism
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
- id: look.style.atmosphere
  statement: |
    No fog, haze volumes, rain, dust motes, floating light particles, god rays or lens
    flares anywhere in the film. Depth comes from aerial perspective only: distant
    elements are tinted toward the scene's horizon colour, from 0 % at 10 m to 35 % at
    60 m, and silhouette cards beyond the west railing are tinted 60 %.
  value:
    volumetrics: false
    fog: false
    particles: false
    god_rays: false
    lens_flares: false
    aerial_perspective:
      start_m: 10
      end_m: 60
      tint_at_end: 0.35
      silhouette_cards_tint: 0.6
      tint_target: scene_horizon_colour
      implementation: mist_pass_mix_in_compositor
  rationale: |
    world.rules.weather fixes clear, dry, calm air with no haze beyond natural distance
    softening, and CREATIVE_DIRECTION asks for atmosphere from colour and gradient skies
    rather than simulation. A mist-pass tint gives real depth separation at almost no
    render cost. Removing particles and flares also removes the signature most associated
    with the well-known director G3 named (see look.style.originality_guards). Rejected:
    light volumetric haze at golden hour (beautiful but expensive in EEVEE, not motivated
    by clear air, and it softens the phone glow's contrast later).
  serves:
  - intent.soft_but_cinematic
  - intent.anime_feel
  depends_on:
  - world.rules.weather
  - look.style.originality_guards
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
- id: look.style.glow
  statement: |
    Only emissive sources glow: the phone screens, the amber power lights, the shop
    fascia sign, the fridges, lit windows, street lamps and the desk lamp. Glow is a
    tight, soft halo no wider than 1.5 % of frame width, with no streaks, stars or
    ghosts. Out-of-focus practicals must not form visible bokeh discs.
  value:
    glow_sources: emissives_only
    max_radius_pct_frame_width: 1.5
    streaks: false
    star_glare: false
    ghosts: false
    bokeh_discs: false
    implementation: compositor_glare_bloom_on_emission_pass
  rationale: |
    A small halo makes the phone read as light rather than as a white rectangle, which
    the glow motif depends on (look.style.motifs). Capping it keeps the pastel frame from
    washing out and keeps light sources small and personal. Rejected: wide bloom over
    the sky and highlights (dreamy, saccharine, tone.anti_goals) and bokeh discs from the
    lamps and windows (a sparkle look the film avoids, look.style.originality_guards).
  serves:
  - intent.soft_but_cinematic
  - intent.race_against_battery
  depends_on:
  - look.style.atmosphere
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
- id: look.style.sky
  statement: |
    The sky is a painted gradient with a few flat cloud cards, each cloud in two tones
    only (lit and shadow, look.color.clouds). There are two sky states: golden hour for
    SC01-SC03 and dusk for SC04-SC06, both defined in look.color.sky.*. The dusk sky is one
    asset used unchanged at his kerb and in her window. The sun disc is never in frame
    with a flare. Sky may fill at most two thirds of any frame, and every frame that shows
    sky also shows a character or a hero prop. Overhead wires are background lines and are
    never the subject of a shot. No moon and no stars.
  value:
    method: painted_gradient_plus_flat_cloud_cards
    cloud_tones: 2
    states:
      golden_hour:
      - SC01
      - SC02
      - SC03
      dusk:
      - SC04
      - SC05
      - SC06
    dusk_sky_shared_asset: true
    max_sky_frame_fraction: 0.67
    sky_only_shots: false
    wire_featured_shots: false
    sun_disc_flare: false
    moon: false
    stars: 0
  rationale: |
    The sky is the film's time-of-day clock and its only link between the two characters
    (world.rules.time_and_sun), so it must be consistent and exact. One shared dusk asset
    makes "same sky" true by construction. Flat two-tone clouds match the cel language.
    Keeping sky to at most two thirds of the frame, always behind a person, and keeping
    wires as background lines keeps the sky a setting rather than the spectacle (G3 finding
    9). No star, because anything twinkling in the final image tips hope into saccharine
    (tone.anti_goals). Rejected: sky-dominant cutaways and wire-silhouette transitions (the
    signature G3 warned against), and an HDRI or photographic sky (licence UNKNOWN,
    photographic detail breaks the cel look).
  serves:
  - intent.soft_but_cinematic
  - intent.open_hopeful_ending
  - intent.anime_feel
  depends_on:
  - world.rules.time_and_sun
  - world.rules.weather
  - look.style.originality_guards
  applies_to:
  - SC01
  - SC02
  - SC03
  - SC04
  - SC05
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
- id: look.style.originality_guards
  statement: |
    Originality choices against the Shinkai-adjacency risk (G3 finding 9). This film
    takes the everyday-townscape vocabulary and the two-people-under-one-sky link, but
    not the signature treatment. Its light identity is small and handheld: a phone glow
    and an amber pip, not a spectacular sky. Specifically: pastel, low-saturation,
    low-detail painted backgrounds instead of hyper-detailed luminous ones; no lens
    flares, light particles, sparkles, bokeh or god rays; no sky or wire cutaways or
    transitions; the shared sky shown only by colour match, never by a dedicated
    cross-cut of two skies; comedy staged in geometric, ground-heavy frames.
  value:
    borrowed_as_principle:
    - everyday_townscape_vocabulary
    - one_sky_link_between_two_people
    not_borrowed:
    - hyper_detailed_luminous_backgrounds
    - lens_flares
    - light_particles_and_sparkles
    - sky_or_wire_cutaways
    - sky_cross_cut_transitions
    - saturated_magic_hour_skies
    film_light_identity: handheld_phone_glow_and_amber_power_pip
    sky_link_rule: colour_match_only_one_matched_pair_sc05_window_and_sc04_sc06_kerb
    max_sky_saturation: 0.4
  rationale: |
    CREATIVE_DIRECTION's originality statement makes the phone the second character and
    the crank the heart. The look puts the film's light where those are: in the hand, not
    in the sky. That is the part no reference owns, and it serves
    intent.earned_last_signal (the pip is his own light). Keeping skies pastel, limited
    and unflared takes away the combination viewers would recognise, while keeping the
    world canon's townscape and shared sky intact. Rejected: dropping the wires or the
    shared sky (both are locked world canon and carry intent.anime_feel and the ending)
    and a deliberately "anti-anime" look (would break intent.anime_feel).
  serves:
  - intent.anime_feel
  - intent.earned_last_signal
  - intent.soft_but_cinematic
  depends_on:
  - world.setting
  - world.locations.street
  - world.rules.time_and_sun
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
  notes: |
    Named works appear here only as the risk to avoid, as the G3 review names them. Nothing
    is taken from them as a spec (film-conventions/ORIGINALITY.md).
- id: look.style.composition
  statement: |
    Composition rules for the cinematographer. (1) Comic section (SC01-SC03): geometric,
    ground-heavy frames with the horizon or rooftop line in the middle or upper third.
    Symmetric one-point frames (the street, the shop aisle) are allowed only here, when the
    world beats him. (2) Tender section (SC04-SC06): off-centre, closer frames with space
    in his look direction and the horizon in the lower third. (3) Every exterior and shop
    frame has at least three depth layers separated by value and aerial tint, not by depth
    of field alone. (4) From the SC03 blackout on, the phone screen is the brightest
    element inside the head-and-hands area of any frame it appears in.
  value:
    comic:
      scenes:
      - SC01
      - SC02
      - SC03
      horizon: middle_or_upper_third
      symmetry: allowed_for_world_beats_him_frames
      framing: geometric_ground_heavy
    tender:
      scenes:
      - SC04
      - SC05
      - SC06
      horizon: lower_third
      symmetry: false
      framing: off_centre_closer_lead_space
    min_depth_layers: 3
    depth_separation: value_and_aerial_tint
    phone_brightest_near_face_from: SC03_blackout
  rationale: |
    CREATIVE_DIRECTION asks for a deliberate change of framing at the turn, with a wider,
    geometric comic middle and a closer, held crank. Tying horizon height and symmetry to
    the two halves gives the cinematographer a checkable version of that change: the
    comic frames let the ordered world (street lines, shelves) press on him; the tender
    frames give him air. The phone-brightest rule extends ART_DIRECTION_BIBLE principle 2
    into composition. Rejected: a single consistent framing grammar (loses the turn) and
    DoF-only depth (flattens painted backgrounds and invites bokeh).
  serves:
  - intent.comic_then_tender
  - intent.soft_but_cinematic
  - intent.race_against_battery
  depends_on:
  - tone.the_turn
  - look.style.sky
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
- id: look.style.motifs
  statement: |
    Three visual motifs. (1) The phone's glow on a face: invisible in the sun (it only
    dips when charging is lost), it appears when the shop goes dark, flickers at 1 %, holds steady once he cranks, lights Hana's
    face as a new light, and fades out on him. (2) The small amber power light: the car
    adapter's ring, the charging bolt, the crank pip, the progress line and the sent tick
    share one amber, which fails twice and works the third time. (3) The one sky: golden
    over the comedy, dusk over the tenderness, the same dusk at his kerb and in her window.
  value:
    phone_glow:
      scenes:
      - SC03
      - SC04
      - SC05
      - SC06
      states:
      - invisible_in_sun
      - emerges_at_blackout
      - flickers_at_1pct
      - steady_while_cranking
      - lights_hana
      - fades_out
    power_amber:
      hex_ref: look.color.accent_power_amber
      carriers:
      - car_adapter_ring
      - charging_bolt
      - crank_pip
      - send_progress_line
      - sent_tick
      pattern: fails_twice_works_third_time
      scenes:
      - SC01
      - SC03
      - SC04
    one_sky:
      scenes:
      - SC01
      - SC02
      - SC04
      - SC05
      - SC06
      matched_pair:
      - SC05_window
      - SC04_SC06_kerb
  rationale: |
    The glow is the thread CREATIVE_DIRECTION recommends for the look, and giving it states
    turns the phone's light into the emotional track of the film. Giving every
    power-flowing indicator one colour makes world.rules.one_port's rhyme visible: the
    audience learns "amber = power" at the car and the shop, so when the pip glows under
    his own hand and the tick comes up in the same amber, the send reads as his effort
    turned into delivery (intent.earned_last_signal). The one sky carries the ending's
    link. Rejected: more motifs (with a 60 s film, a fourth motif would not be learned),
    and a green charging bolt and tick (the usual phone convention), which would split the
    power story across two colours.
  serves:
  - intent.earned_last_signal
  - intent.race_against_battery
  - intent.open_hopeful_ending
  - intent.comic_then_tender
  depends_on:
  - world.rules.one_port
  - world.props.crank_charger
  - world.props.car_usb_adapter
  - world.rules.time_and_sun
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
- id: look.style.phone_ui
  statement: |
    The phone screen talks in icons, numbers and colour only. Status bar: the battery icon
    and its percentage, right-aligned, and nothing else (no clock, carrier, signal bars,
    wifi or any other icon). Call screen: her circular photo, no name; a green round call
    button with a handset glyph that pulses with each ring and turns grey when the call goes
    unanswered. Map: unlabelled blocks and roads, one blue pin with a white fork-and-knife
    glyph. Keyboard: blank keys with no letters, numbers or symbols. The only glyphs allowed
    are the emoji-face key and the backspace arrow, and a key darkens when pressed. Messages:
    the typed invitation in a pale blue sent bubble with dark ink text. It is the only text,
    with cap height at least 3.5 % of frame height in inserts. Send: an arrow pictogram;
    after sending, a thin amber progress line fills in about 1 s, then a single amber tick
    appears. Hana's phone uses the same UI system: his circular photo when it lights, and if
    her screen is shown, only the same invitation text. Screen light: one short dip when
    charging is lost (SC01, SC03), an irregular flicker at 1 % until the first crank turn,
    then steady, and a 24-frame fade to off in SC06.
  value:
    status_bar:
    - battery_icon
    - battery_percent
    status_bar_forbidden:
    - clock
    - carrier
    - signal_bars
    - wifi
    - any_text
    battery:
      normal_from: 5
      red_from: 4
      blink_at: 1
      blink_hz: 1.0
      blink_duty: 0.5
      blinking_part: icon_only
      charging_indicator: amber_bolt_left_of_icon
    call_screen:
    - circular_photo_no_name
    - green_call_button_handset_glyph
    - ring_pulse
    - grey_when_unanswered
    map:
    - unlabelled_blocks_and_roads
    - blue_pin_white_fork_and_knife
    keyboard:
      key_legends: none
      allowed_glyphs:
      - emoji_face_key
      - backspace_arrow
      press_feedback: key_darkens
    message:
      bubble: sent_bubble_pale_blue
      text: ink_on_bubble
      min_cap_height_pct_frame: 3.5
      min_contrast_ratio: 7.0
      only_readable_text: true
    send:
      button: arrow_pictogram
      progress: amber_line_about_1s
      delivered: single_amber_tick
      labels: none
    hana_phone:
      wake: circular_photo_of_ren_no_name
      screen_text: same_invitation_only_if_shown
    screen_behaviour:
      dip_when_charge_lost: one_3_frame_dip_to_70pct_in_the_frame_the_bolt_vanishes_sc01_sc03
      flicker_at_1pct: brightness_dips_to_70pct_for_2_to_3_frames_irregular
      steady_from: first_crank_turn
      power_off_sc06: fade_to_screen_off_over_24_frames_ease_out
    font: open_licence_humanist_sans
    icon_set: drawn_in_house
  rationale: |
    Implements tone.wordless (strict) and closes the G2/G3 residuals (status bar words,
    keyboard letters). Blank keys are the safest fix because they hold even when a shot
    has to show the keyboard. With only the battery in the status bar, the battery is the
    film's only meter (story.escalation, network_signal_meter false), and no clock can
    become a second one. The 3.5 % cap height and 7:1 contrast make the nine-word
    invitation readable in a 2-3 s insert (story.message). Blinking only the icon keeps
    the number readable at 1 %. Rejected: a realistic OS UI (status-bar text, carrier,
    clock), a dark-mode UI (too little light on his face for the glow motif), and blurred
    keyboard letters (they still read as text, world.rules.no_readable_text).
  serves:
  - intent.race_against_battery
  - intent.earned_last_signal
  - intent.open_hopeful_ending
  depends_on:
  - tone.wordless
  - story.escalation
  - story.message
  - story.inciting_incident
  - story.setup_cues
  - world.rules.no_readable_text
  - world.props.phone_ren
  - world.props.phone_hana
  applies_to:
  - SC01
  - SC02
  - SC03
  - SC04
  - SC05
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
  notes: |
    Font licence UNKNOWN until verified. RECOMMENDATION: an SIL Open Font Licence family such
    as Noto Sans or Inter (their OFL status is an ASSUMPTION to verify at M3). The icon set
    is drawn in-house, so no licence question. The call-button green is from the approved
    SCREENPLAY ("A green call icon").
- id: look.style.render_constraints
  statement: |
    Render-look constraints for M3: Blender 5.2 EEVEE; toon materials built as Shader to
    RGB into a constant colour ramp; view transform Standard (not AgX or Filmic), look
    None, exposure 0, gamma 1, sRGB display; motion blur off; no screen-space refraction;
    glass (windscreen, fridge doors, dark phone screen) shows painted flat highlight
    shapes instead of ray-traced reflections; no volumetrics; soft shadows from light
    radius only.
  value:
    engine: eevee
    toon_material: shader_to_rgb_constant_ramp
    view_transform: Standard
    look: None
    exposure: 0.0
    gamma: 1.0
    display: sRGB
    motion_blur: false
    screen_space_refraction: false
    glass: painted_highlight_shapes
    raytracing: false
    volumetrics: false
    shadow_softness: light_radius
  rationale: |
    The palette is authored as display hex. With the Standard transform and constant
    ramps, a material given a canon hex renders that hex under a neutral key, so the
    COLOR_BIBLE is what appears on screen and the M3 resolver can convert once. AgX and
    Filmic would desaturate and shift the pastels, and the battery red most of all. Crisp
    frames without motion blur match held-pose anime timing (characters.ren.expressions:
    held poses) and keep the phone number sharp in motion. Everything listed is cheap on a
    laptop. Rejected: AgX with a grade (more cinematic range, but the hexes would stop
    meaning what canon says) and ray-traced glass (cost, and realistic reflections break
    the cel look).
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  - intent.race_against_battery
  depends_on:
  - look.style.realism
  - look.style.character_shading
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
  notes: |
    ASSUMPTION: Blender 5.2 keeps the Standard view transform, Shader to RGB in EEVEE, and
    the compositor Glare node. All three exist in Blender 4.x. Verify with `fm doctor` / the
    M3 builder.
- id: look.style.style_break_protocol
  statement: |
    A shot may break a style-lock rule (VISUAL_BIBLE L1-L23) only by declaring
    `style_break: {rule, reason, serves}` in its shot spec. The break is reviewed at G5 and
    allowed at most once per sequence. No breaks are pre-approved. Rules L6 (only red),
    L8 (phone UI text) and L12 (sky/originality) may not be broken at all.
  value:
    declaration: shot_spec_style_break_block
    required_fields:
    - rule
    - reason
    - serves
    review_gate: G5
    max_per_sequence: 1
    pre_approved: []
    unbreakable:
    - L6
    - L8
    - L12
  rationale: |
    A style lock with no exit gets broken quietly. A declared, reviewed break keeps
    exceptions visible and traceable. The three unbreakable rules protect user
    requirements and G3's originality finding: breaking them would undo tone.wordless or
    the one meter. Rejected: pre-approving a break (none is needed by the approved
    screenplay).
  serves:
  - intent.soft_but_cinematic
  - intent.race_against_battery
  depends_on:
  - look.style.phone_ui
  - look.color.rule.only_red
  - look.style.sky
  tag: DECISION
  status: LOCKED
  source: agent:look-director
  version: 1
