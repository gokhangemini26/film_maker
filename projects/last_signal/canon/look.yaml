  rationale: |
    A light UI puts the most light on the faces, which the glow motif needs, and dark ink
    on a pale blue bubble gives the invitation high contrast (9.9:1, see COLOR_BIBLE).
    The blue pin and bubble belong to Ren's blue family, so the plan and the message read
