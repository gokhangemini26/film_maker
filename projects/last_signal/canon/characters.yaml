domain: characters
entries:
- id: characters.ren.identity
  statement: |
    Ren, 20, university student, the protagonist. He has finally found the nerve to invite
    his friend Hana to dinner, where he means to tell her he loves her. Want: get the
    invitation to her before his phone dies. Need: to stop reaching for shortcuts and put
    his own effort in. Defining behaviour: the earnest reset. After every setback he
    freezes, sags, then straightens up and tries again. His name is for production only and
    never appears on screen.
  value:
    name_production_only: Ren
    on_screen_name: false
    pronoun: he
    age: 20
    role: protagonist
    occupation: university_student
    want: send_the_dinner_invitation_before_the_battery_dies
    need: value_his_own_effort_over_shortcuts
    defining_behaviour: earnest_reset_after_each_setback
    personal_items:
    - phone_ren
    - charging_cable
    - crank_charger
    - car_key
    wristwatch: false
    bag: false
  rationale: |
    The earnest reset is the one behaviour that makes tone.comedy_source work ("he tries
    again anyway"). It is a body action a proxy can play in silhouette: freeze, sag,
    straighten. It is also the shape the turn breaks. At the kerb he does not reset
    upward, he settles, and that change is story.arc.ren. No wristwatch and no bag: a watch
    would be a second meter (story.escalation allows one) and a bag would raise "is there a
    power bank in there?" (world.rules.power removes every other source). Rejected: a
    clumsy or scatterbrained Ren. The comedy would then be his fault, which
    tone.comedy_source excludes and which would make us laugh at him.
  serves:
  - intent.race_against_battery
  - intent.comic_then_tender
  - intent.earned_last_signal
  depends_on:
  - story.cast
  - story.arc.ren
  - tone.comedy_source
  - tone.wordless
  applies_to:
  - ren
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
  notes: |
    Age 20 implements the user's "about 20" (USER_REQUIREMENT via story.cast). The name is an
    ASSUMPTION from story.cast that the human may replace at no cost.
- id: characters.ren.silhouette
  statement: |
    Tall, lanky and slightly long in the limbs, with one stubborn tuft of hair standing up
    at the crown. He wears a hip-length light jacket, always open, over a plain T-shirt, so
    the jacket fronts make two vertical panels either side of a pale centre strip. Before
    the turn his neck juts forward and his shoulders curl over the phone: a forward-leaning
    "?" shape. After the turn his spine straightens and settles, and in the final image it
    leans back: a relaxed diagonal.
  value:
    read_at_a_glance:
    - crown_tuft
    - tall_narrow_lanky
    - open_hip_length_jacket_with_pale_centre_strip
    posture_before_turn: forward_lean_neck_jut_shoulders_curled_over_phone
    posture_after_turn: upright_settled_then_leaning_back
    distinct_from_hana: angular_vertical_vs_her_rounded_compact
    min_readable_height_in_frame: 0.15
  rationale: |
    In wide anime frames and backlit shots (the sun-filled windscreen in SC01, the long
    raking street light in SC02, the dark shop in SC03) his face is small or in shadow, so
    three shapes have to carry him. The tuft reads on the head outline even against the
    sun. The open jacket's centre strip reads as "him" in a dark room lit only by the
    phone. The forward "?" posture makes the rush visible without a face. The tuft is also
    already in the script (SC01 "presses down one stubborn tuft"), so the crush cue and the
    silhouette are the same object. min_readable_height_in_frame (0.15 of frame height) is
    a guide for the cinematographer: below that, only posture reads. Rejected: a hood or a
    cap as his signature shape, which hides the tuft and the mirror beat and adds a
    silhouette that reads as "hiding" rather than "hopeful".
  serves:
  - intent.anime_feel
  - intent.race_against_battery
  - intent.comic_then_tender
  depends_on:
  - story.setup_cues
  - story.arc.ren
  applies_to:
  - ren
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
- id: characters.ren.proportions
  statement: |
    Height 1.72 m (crown, excluding the tuft; the tuft adds about 0.04 m). Slim, lanky
    build, about 6.5 heads tall: slightly stylised toward anime proportions, never
    super-deformed. Head, eyes and hands are about 10 % larger than realistic so faces and
    hand acting read in wide frames and in phone inserts.
  value:
    height_m: 1.72
    tuft_extra_m: 0.04
    build: slim_lanky
    head_count: 6.5
    head_height_m: 0.265
    shoulder_width_m: 0.42
    hip_width_m: 0.32
    leg_length_m: 0.84
    arm_span_m: 1.74
    hand_length_m: 0.205
    hand_scale_vs_realistic: 1.1
    eye_height_standing_m: 1.59
    seated_on_car_seat:
      seat_height_m: 0.45
      seat_back_recline_deg: 20
      crown_z_m: 1.32
      crown_with_tuft_z_m: 1.36
      eye_z_m: 1.2
    seated_on_kerb:
      seat_surface_z_m: 0.12
      back_rest_to_heels_m: 0.6
      knee_top_z_m: 0.62
      crown_z_m: 1.06
    kneeling_eye_z_m: 1.05
  rationale: |
    The world is built for an adult of about 1.7 m (seat 0.45, counter 1.0, gondolas 1.5,
    garden walls 1.0), and 1.72 m fits it without re-scaling any set. At that height the
    small car (roof 1.45) sits below his shoulders when he stands beside it, so the car
    reads as small and his, and his eye (1.59 m; 1.71 m standing on the pavement) clears
    the 1.5 m shop gondolas, so he can scan the walls for a socket (SC03). He is taller and
    narrower than Hana so the two read as two different people at thumbnail size, even
    though they never share a frame. 6.5 heads with 10 % larger heads, eyes and hands is the
    anime register the direction asks for (expressive faces and hands, simple bodies) while
    staying a believable 20-year-old: super-deformed proportions would push the comedy
    toward manic slapstick (tone.anti_goals). Rejected: realistic 7.5-head proportions
    (faces too small to act in the wides at MVP fidelity) and a short, round Ren (reads
    younger than 20 and as a comic type rather than someone we root for).
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  - intent.race_against_battery
  depends_on:
  - story.cast
  - world.sets.ren_car
  - world.sets.street
  - world.sets.corner_shop
  - tone.anti_goals
  applies_to:
  - ren
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
  notes: |
    DEPENDENCY for the M3 build and the cinematographer: seated in the car with the seat
    back upright, his crown plus tuft reaches about 1.41 m against a roof of 1.45 m
    (interior headliner not specified in world canon). A driver's seat reclined about 20
    degrees brings it to about 1.36 m. seated_on_kerb assumes the world's RECOMMENDATION:
    he sits on the pavement edge facing the pavement, back leaning on the car's rear side
    panel. All seated figures are estimates to be checked in the first proxy test (G6).
- id: characters.ren.face
  statement: |
    Face and hair shape language: a slightly long oval face with a soft jaw, straight
    level brows that can knit and lift (his worry lives in the brows), medium almond eyes,
    a small, simple nose, and a mouth drawn as a line that can flatten, press or open a
    little. Short dark-brown hair, soft and a little messy, fringe down to the brows, with
    the stubborn crown tuft. Only what the film shows is designed: brows, eyes, mouth line,
    hair outline. No freckles, scars, glasses or piercings.
  value:
    face_shape: long_soft_oval
    brows: straight_level_expressive
    eyes: medium_almond
    nose: small_simple
    mouth: line_that_flattens_presses_opens_slightly
    hair_style: short_soft_messy_fringe_to_brows_crown_tuft
    colors:
      skin: '#EAC7AB'
      hair: '#4A3A31'
      eyes: '#5B4637'
      brows: '#3E3029'
    extras: none
  rationale: |
    His face is seen three ways: backlit in the car, lit from below by the phone in the
    dark shop, and softly lit by the phone at the crank. Straight brows are the strongest
    readable feature under a single low light, so his worry and his calm both go there,
    not into small mouth shapes the proxy cannot hold. A fringe down to the brows frames
    the eyes without hiding them. The longer face separates him from Hana's round one. No
    accessories keeps the face clean for the phone's glow, the film's light motif. Rejected:
    glasses (screen reflections would fight the phone glow and complicate every close-up)
    and a fringe over the eyes (hides the one feature that carries the arc).
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  - intent.comic_then_tender
  depends_on:
  - characters.ren.silhouette
  - story.setup_cues
  applies_to:
  - ren
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
  notes: |
    Hex values are proposals for coordination; the look-director may request changes to
    fit the palette (via change request once approved). Not tied to any nationality, in
    keeping with world.setting (no country markers).
- id: characters.ren.expressions
  statement: |
    Two expression sets split at the turn. Comic set (SC01-SC03): the rehearsed breath
    (cheeks fill, eyes shut, then open), the letdown (inner brows up, mouth flat), the
    freeze (eyes wide, pupils small, whole body held), relief (eyes close, long exhale, head
    back), the stunned stillness in the dark shop (face lit from below, brows lifted, no
    movement), wary (brows level and very slightly lowered, eyes a touch narrowed, mouth
    pressed, no smile: he expects the catch) and determined (brows level and knit, eyes fully
    open and forward, mouth pressed small: the reset after a setback). Tender set (SC04, SC06):
    focused calm (brows level, eyes on the phone), the hesitation at the heart (lips pressed, a
    slow blink), the release after the send (eyes close, breath out), the final look up
    (eyelids low, mouth soft, the faintest ease at the corners). Focused calm keeps its brows
    level so it never reads as determined. Every comic reaction is a held pose, not a rubbery
    take. No sweat drops, anger marks, super-deformed faces or other graphic comic symbols.
  value:
    comic_set:
    - rehearsed_breath
    - letdown
    - freeze
    - relief
    - stunned_stillness
    - wary
    - determined
    comic_set_defs:
      wary: brows level and very slightly lowered, eyes a touch narrowed, mouth pressed closed, no smile;
        a held pose
      determined: brows level and knit (inner ends slightly down), eyes fully open and forward, mouth
        pressed small; the reset of freeze-sag-reset; a held pose
    comic_set_used_in:
      wary:
      - SC03_SH020
      - SC03_SH030
      determined:
      - SC01_SH060
      - SC02_SH010
    tender_set:
    - focused_calm
    - hesitation_at_heart
    - release_after_send
    - final_look_up
    tender_distinct_from_comic: focused_calm keeps brows level (no knit, no inner-end drop) so it never
      reads as determined
    comic_illegal_from_shot: SC04_SH030
    comic_style: held_pose_reactions
    graphic_symbols: false
    super_deformed: false
    mouth_open_max: slight
    lip_sync: false
    face_hidden_beats:
    - forehead_on_wheel_SC01
  rationale: |
    The comic reactions are timed on held frames (CREATIVE_DIRECTION: frozen stare,
    slumped shoulder, pause before he tries again), so each is a pose with a clear read
    rather than a flurry of shapes, which also suits the proxy face. Splitting the sets at
    the turn makes the change of key visible on his face as well as in the pace
    (tone.the_turn): after the crank begins he never uses a comic expression again. The
    final look up stays short of a smile: his effort is done and the answer is not his to
    see (tone.ending_restraint). Graphic symbols and super-deformed takes are excluded:
    they are the loud end of anime comedy, they read as manic, and they would break the
    "framed and lit like cinema" half of intent.soft_but_cinematic. Rejected: a big
    triumphant grin at the tick (turns a small earned triumph into a victory lap).

    v2 additions (wary, determined). The comedy is bad timing plus persistence
    (tone.comedy_source), and characters.ren.movement gives every setback the pattern
    freeze, sag, reset. The v1 set has a face for the freeze and the sag (freeze, letdown)
    but none for the reset, so the beat that makes the next setback funny had no face of its
    own; determined is that face (SC01_SH060 f18, the storyboard's "resolve"; SC02_SH010 f0,
    the same resolve, bigger, as he bursts out to run). The SC03 "wary relief" (G3 finding 7)
    is a two-part gag: he expects the catch, nothing happens, then the exhale; the v1 set
    has the relief half but not the expectation half; wary is that half (SC03_SH020 f0,
    SC03_SH030 f0). Both are held poses with no graphic symbols, mouth closed, so they keep
    comic_style held_pose_reactions and intent.soft_but_cinematic. Both join the comic set,
    so the turn rule bans them from SC04_SH030 on and the change of key stays intact
    (intent.comic_then_tender); the tender focused_calm must keep level brows so it does not
    collapse into determined (G7 review #4). The persistence these faces show is what makes
    the last signal earned (intent.earned_last_signal). Rejected: revert the four keys to
    neutral or to an existing v1 face. neutral drops the expectation half of the wary gag and
    the reset of freeze-sag-reset, so the setbacks lose their rhythm; freeze in SC03 would
    pre-empt the freeze already keyed at SC03_SH030 f2 and flatten the gag; relief would
    spend the exhale saved for SC03_SH040; letdown on the reset reads as giving up, the
    opposite of persistence. Low on-screen risk: the face is legible only in SC03_SH030 f0
    (SC01_SH060 rear 3/4, SC02_SH010 back of head), per G7 review #3.
  serves:
  - intent.comic_then_tender
  - intent.earned_last_signal
  - intent.soft_but_cinematic
  depends_on:
  - tone.the_turn
  - tone.comedy_source
  - tone.anti_goals
  - tone.ending_restraint
  - story.setup_cues
  applies_to:
  - ren
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 2
  history:
  - version: 1
    hash: sha256:e59d1a65dbde02bb2660940e2e4c2a1a973d1088acce3d766cec064b3cd676d3
    status: SUPERSEDED
    change: CHANGE-005
