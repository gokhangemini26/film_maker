- id: characters.hana.identity
  statement: |
    Hana, 20, Ren's university friend. She is the person he is trying to reach and has no
    arc of her own: her one moment is noticing. She missed his call innocently, absorbed in
    sketching with big headphones on. She does not know how he feels. Defining behaviour:
    absorbed making, head down over paper, pencil moving, lost in it. Her name is for
    production only and never appears on screen.
  value:
    name_production_only: Hana
    on_screen_name: false
    pronoun: she
    age: 20
    role: the_person_he_is_trying_to_reach
    occupation: university_student
    knows_his_feelings: false
    defining_behaviour: absorbed_in_drawing
    personal_items:
    - phone_hana
    - hana_headphones
    - sketchbook
    - pencils
    wristwatch: false
  rationale: |
    story.arc.hana gives her one moment, so her identity has to be legible in the first
    frame of SC05: absorbed, making something by hand, headphones on. That one image
    answers "is she ignoring him?" with "no, she was lost in a drawing", which keeps the
    ending hopeful. Making things by hand also rhymes quietly with his cranking: two people
    busy with their hands under the same sky. Rejected: showing her waiting by the phone or
    looking at a photo of him, which would tell the audience she already loves him and close
    the ending (tone.ending_restraint).
  serves:
  - intent.open_hopeful_ending
  depends_on:
  - story.cast
  - story.arc.hana
  - world.locations.hana_room.sketches
  applies_to:
  - hana
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
  notes: |
    Age 20 implements the user's "about 20" (via story.cast). The name is an ASSUMPTION from
    story.cast. That she studies something involving drawing is an ASSUMPTION, never shown.
- id: characters.hana.silhouette
  statement: |
    Compact and rounded. A jaw-length rounded bob with a short, straight fringe makes a
    smooth, helmet-like head shape. The big pale over-ear headphones sit on top of it,
    turning the head into an unmistakable "headphones" outline. A loose, soft top with
    dropped shoulders gives a rounded, pear-like upper body, head tilted down over the desk.
    When the headphones slide down, the outline changes to "head free, ring at the neck".
  value:
    read_at_a_glance:
    - rounded_bob_with_headphones_on_top
    - loose_soft_dropped_shoulders
    - head_tilted_down_over_desk
    silhouette_states:
    - headphones_on_head
    - headphones_around_neck
    distinct_from_ren: rounded_compact_vs_his_angular_vertical
    backlit_by: window_sky
  rationale: |
    She is framed against the west window (world.sets.hana_room), so she is partly
    backlit by the dusk sky. Her outline must say "headphones on, can't hear" before we see
    her face. The smooth bob gives the headphones a clean shape to sit on, and the change
    of outline when she slides them down is the whole story beat, readable even in
    silhouette. Rounded where Ren is angular, compact where he is tall: two people read as
    two people across a cut. Rejected: long hair (it would tangle with the headphones round
    her neck, a hair-collision problem the proxy cannot solve, and blur the headphone
    outline) and a hood or high collar (no room for the headphones round her neck).
  serves:
  - intent.open_hopeful_ending
  - intent.anime_feel
  - intent.soft_but_cinematic
  depends_on:
  - story.arc.hana
  - world.props.hana_headphones
  - world.sets.hana_room
  applies_to:
  - hana
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
- id: characters.hana.proportions
  statement: |
    Height 1.60 m. Slight, soft build, about 6.3 heads tall, with the same stylisation as
    Ren (head, eyes and hands about 10 % larger than realistic). Seen only seated at her
    desk.
  value:
    height_m: 1.6
    build: slight_soft
    head_count: 6.3
    head_height_m: 0.254
    shoulder_width_m: 0.36
    hip_width_m: 0.33
    hand_length_m: 0.185
    hand_scale_vs_realistic: 1.1
    seated_at_desk:
      chair_seat_height_m: 0.44
      desk_height_m: 0.72
      eye_z_m: 1.14
      crown_z_m: 1.27
      crown_with_headphones_z_m: 1.3
      window_sill_z_m: 0.9
      head_inside_window_band: true
  rationale: |
    1.60 m makes her clearly smaller than Ren (1.72 m) and fits the room built for an adult
    of about 1.7 m (desk 0.72, sill 0.9). Seated on a 0.44 m chair, her eyes are at about
    1.14 m and her head sits fully inside the window band (0.9 to 2.0 m), so the dusk sky,
    the same sky as his, is right behind her head in the main angle. That is the visual
    link world.rules.time_and_sun asks for. The same stylisation as Ren keeps them from one
    world. Rejected: making her much shorter or childlike (both characters are adults of
    about 20, tone.anti_goals).
  serves:
