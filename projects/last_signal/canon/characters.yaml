- id: characters.ren.wardrobe.jacket
  statement: |
    A light, unlined cotton overshirt jacket in soft cornflower blue, cut to the hip, with
    a small point collar, plain buttons and two flat patch chest pockets. Always worn open.
    Sleeves pushed up to just below the elbow. Gently faded at the cuffs and elbows. No
    print, text, logo, badge or label anywhere. Worn in every Ren scene, unchanged.
  value:
    color: '#7C9CC4'
    garment: overshirt_jacket
    material: light_unlined_cotton_twill
    length: hip
    collar: small_point
    closure: plain_buttons_worn_open
    pockets: two_flat_patch_chest_pockets
    sleeves: pushed_up_below_elbow
    wear: soft_fade_at_cuffs_and_elbows
    markings: none
    worn_open: true
    changes_between_scenes: none
  rationale: |
    The jacket is the biggest colour block on him and the main carrier of his silhouette,
    so its colour works hardest. A cool, medium-value blue separates him from the warm
    golden hour (the sun-filled windscreen, the raking street light) and from the peach and
    lavender of dusk, and it holds its hue under the phone's glow. It is pastel enough for
    the palette and never competes with the battery's red, which the direction keeps as one
    of the few saturated accents. An overshirt is plausible on a mild early-summer evening
    (world.rules.season: light clothes, no coats). Worn open, it gives him the centre strip
    that reads in the dark shop, and it swings when he runs (SC02) without any cloth
    simulation. Sleeves pushed up keep his hands and wrists clear for typing, the cable and
    the crank. The soft fade says it is his favourite and much worn, like the looked-after
    car: kind wear, never grit. Rejected: a zipped hoodie (a hood breaks the tuft
    silhouette and reads as hiding), a red or pink jacket (fights the battery red), and a
    printed T-shirt as his only layer (readable graphics, and no silhouette shape).
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  - intent.race_against_battery
  depends_on:
  - characters.ren.silhouette
  - world.rules.season
  - world.rules.no_readable_text
  - tone.wordless
  applies_to:
  - ren
  - SC01
  - SC02
  - SC03
  - SC04
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
  notes: |
    Kept as its own canon entry so that a colour change is a single edit whose downstream
    effect shows in `fm impact canon:characters.ren.wardrobe.jacket`. The hex is proposed
    for coordination with the look-director (LOOK phase), who may request a change.
- id: characters.ren.wardrobe.outfit
  statement: |
    Under and with the jacket: a plain crew-neck T-shirt in warm oat, relaxed slim
    trousers in slate blue-grey, and plain low-top canvas shoes, off-white with a pale gum
    sole. No belt showing, no watch, no jewellery, no bag, no print, text, logo or stripes.
    The same in every Ren scene. The phone lives in his hand; the car key stays in the
    ignition.
  value:
    tshirt:
      color: '#EAE2D3'
      neck: crew
      fit: relaxed
      print: none
    trousers:
      color: '#4F5A6E'
      fit: relaxed_slim
      length: full_to_ankle
    shoes:
      color: '#ECE7DE'
      sole_color: '#CDBFA8'
      type: low_top_canvas
      laces: plain
    accessories: none
    markings: none
    changes_between_scenes: none
    knees_after_shop_kneel: unmarked
  rationale: |
    The oat T-shirt is the pale centre strip that makes the open jacket read. It is warm
    off-white, not white, so it catches the phone's light without becoming a brighter shape
    than the phone near his face (ART_DIRECTION_BIBLE principle 2). Darker slate trousers
    put his value mass on the upper body, where the acting is, and make his legs read as
    one clean shape when he runs and when he sits knees-up on the kerb. Pale shoes mark his
    feet in the SC02 sprint and at the kerb. No accessories: a watch is a second meter, a
    bag suggests a power bank, and jewellery is detail the proxy cannot hold. His knees stay
    clean after kneeling in the shop: a dirt mark would be a small humiliation gag and a
    continuity item for no story gain (tone.comedy_source excludes humiliation). Rejected:
    shorts (read younger than 20, and too much bare leg to model) and a graphic tee
    (readable text risk, tone.wordless).
  serves:
  - intent.soft_but_cinematic
  - intent.comic_then_tender
  - intent.race_against_battery
  depends_on:
  - characters.ren.wardrobe.jacket
  - world.rules.no_readable_text
  - world.rules.season
  - story.escalation
  applies_to:
  - ren
  - SC01
  - SC02
  - SC03
  - SC04
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
- id: characters.ren.movement
  statement: |
    Before the turn (SC01-SC03): quick, jerky bursts between held poses. The phone is held
    close to his face with both hands, elbows tucked, neck forward. Each setback runs
    freeze, sag, reset (straighten and try again). He runs with the phone held out in
    front of him like a compass, arms not swinging. He drops to his knees in one quick move.
    The turn (SC04): he stops resetting. He sits on the kerb, knees up, arms loose over
    them. The reach for the crank is slow and deliberate. He holds it in both hands, then
    cranks with a steady, even rhythm, breathing in time with the handle, shoulders
    rising and falling slightly. His typing thumb is unhurried. After the send (SC04 end,
    SC06): shoulders drop, spine loosens, he leans back against the car and tips his head
    up. The dark phone rests on his chest under one flat hand.
  value:
    before_turn:
      tempo: quick_bursts_between_holds
      phone_grip: two_hands_close_to_face
      spine: forward_neck_jut
      setback_pattern:
      - freeze
      - sag
      - reset
      run: phone_held_out_in_front_arms_not_swinging
      kneel: one_quick_drop
    turn:
      tempo: slow_deliberate
      sit: kerb_knees_up_arms_loose
      crank_grip: two_hands_then_crank_hand_plus_phone_hand
      crank_rhythm: steady_even_about_1_turn_per_s
      breath: in_time_with_crank
      reset: false
    after_send:
      spine: loose_leaning_back_against_car
      head: tipped_up_to_sky
      phone: dark_on_chest_under_flat_hand
    handedness: right
    crank_hand: right
    phone_hand_at_crank: left
  rationale: |
    story.arc.ren plays his change entirely through posture, staging and silhouette, so the
    movement is the arc. The comedy runs on held poses and the freeze-sag-reset rhythm
    (tone.comedy_source: bad timing plus persistence). At the turn the reset disappears:
    instead of bouncing back up he settles, which says he has stopped looking for a
    shortcut. The steady crank tempo with breath in time makes the effort audible and
    visible (tone.the_turn: only the ratchet and his breath), which is what makes the send
    feel earned. Holding the phone out while running shows at a glance what he is running
    for. Right-handed, cranking with the right hand and holding the phone in the left,
    because the crank arm needs the stronger hand and his left thumb can still type slowly.
    The screenwriter's fallback (crank, pause, type, crank) stays available to the
    animation-director. Rejected: frantic running with swinging arms and flailing (manic
    slapstick, tone.anti_goals) and a fast, strained crank (reads as desperation, not
    tenderness).
  serves:
  - intent.comic_then_tender
  - intent.earned_last_signal
  - intent.race_against_battery
  depends_on:
  - story.arc.ren
  - story.ending
  - tone.the_turn
  - tone.comedy_source
  - world.props.crank_charger
  applies_to:
  - ren
  - SC01
  - SC02
  - SC03
  - SC04
  - SC06
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
  notes: |
    Crank tempo (about 1 turn per second) is a RECOMMENDATION for the animation-director
    and sound; it is not a story fact.
- id: characters.ren.representation
  statement: |
    MVP: a stylised proxy. A simple humanoid built from smooth primitives, with a separate
    open jacket shell, a head with a drawn toon face (brows, eyes, mouth line as swappable
    shapes or textures) and a crown-tuft mesh. Standard humanoid skeleton. The description
    is provider-agnostic: any later provider (MPFB, VRM, a generated mesh, mocap-driven)
    must reproduce the same height, head count, silhouette features, wardrobe and colours
    from the characters.ren.* canon.
  value:
    provider: proxy
    height_m: 1.72
    head_count: 6.5
    build: slim_lanky
    silhouette_features:
    - crown_tuft_0.04m
    - open_hip_length_jacket_separate_shell
    - pale_centre_strip_tshirt
    - dark_trousers_pale_shoes
    face:
      method: drawn_toon_face
      controls:
      - brows_knit
      - brows_lift
      - eyes_open
      - eyes_closed
      - eyes_wide_small_pupils
      - mouth_line
      - mouth_flat
      - mouth_pressed
      - mouth_slightly_open
      - cheeks_fill
      lip_sync: false
    hands: five_finger_simplified_1.1x
    rig: humanoid_standard_bone_names
    attach_points:
      hand_r:
      - crank_charger_handle
      - car_key
      hand_l:
      - phone_ren
      chest: phone_ren_resting
    shading: toon_cel_per_look_canon
    wardrobe_source: characters.ren.wardrobe.*
    colors_source: characters.ren.face.colors
    future_providers_allowed:
    - mpfb
    - vrm
    - generated
    - mocap
    likeness: original_no_real_person_no_existing_character
  rationale: |
    The direction makes stylised proxies a style choice: detail goes into faces and hero
    props, not bodies. So the proxy spends its complexity on the face controls the
    expression sets need and on the jacket shell that carries the silhouette, and nothing
    on anatomy. Naming the silhouette features, face controls and attach points (rather
    than a mesh file) means a later provider can be swapped in by one change request
    without touching shots: the shots depend on these canon ids, not on a model.
    Rejected: an off-the-shelf base character now (licence UNKNOWN, and a detailed body
    would fight the cel look and the budget).
  serves:
  - intent.anime_feel
  - intent.soft_but_cinematic
  depends_on:
