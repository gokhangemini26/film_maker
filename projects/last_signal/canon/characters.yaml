  notes: Chair seat height 0.44 m is an ASSUMPTION; world canon gives only "simple desk chair".
- id: characters.hana.face
  statement: |
    Face and hair shape language: a round, soft face with a small chin, gently arched
    brows, large rounded eyes with visible lower lids (her smile lives in the eyes as much
    as the mouth), a tiny nose and a small mouth. Near-black warm-brown hair in a
    jaw-length rounded bob, the short straight fringe cut above the brows so the eyes are
    never covered. No make-up detail, no blush, no accessories.
  value:
    face_shape: round_soft_small_chin
    brows: gently_arched
    eyes: large_rounded_visible_lower_lids
    nose: tiny
    mouth: small
    hair_style: jaw_length_rounded_bob_short_straight_fringe_above_brows
    colors:
      skin: '#F1D3BE'
      hair: '#2F2629'
      eyes: '#4A3A33'
      brows: '#2A2224'
    blush: false
    extras: none
  rationale: |
    The film's only answer is her small smile (tone.ending_restraint), so her face is
    designed around it: big eyes with visible lower lids let the smile read as the lids
    lifting, which a toon face carries more reliably than subtle mouth shapes, and a fringe
    above the brows keeps the eyes clear with the headphones on. No blush: blushing would
    tell the audience she has feelings for him and close the open ending (she does not know
    how he feels). It also keeps pink off her face, away from the battery's red. The round
    face contrasts with Ren's longer one. Rejected: a side-swept fringe over one eye (hides
    half the smile) and a blush at the read (a declaration).
  serves:
  - intent.open_hopeful_ending
  - intent.anime_feel
  depends_on:
  - tone.ending_restraint
  - story.arc.hana
  - characters.hana.silhouette
  applies_to:
  - hana
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
  notes: Hex values are proposals for coordination with the look-director.
- id: characters.hana.expressions
  statement: |
    Four states in four seconds. Absorbed (eyes down on the page, brows relaxed, mouth
    softly closed). Noticing (eyes flick to the lit phone, brows lift a touch). Reading
    (eyes down to the screen, face lit by the phone from below and the side). The small
    smile (lower lids lift, mouth corners rise with lips closed, head dips slightly). No
    open-mouthed grin, no gasp, no blush, no hand to the mouth.
  value:
    sequence:
    - absorbed
    - noticing
    - reading
    - small_smile
    small_smile:
      mouth: corners_up_lips_closed
      eyes: lower_lids_lift
      head: slight_dip
      blush: false
      teeth: false
    excluded:
    - grin
    - gasp
    - blush
    - hand_to_mouth
    - squeal
    lip_sync: false
    graphic_symbols: false
  rationale: |
    tone.ending_restraint makes her smile "private pleasure rather than a declaration".
    Closed lips, lifted lids and a small head dip are that: pleased and a little shy, which
    reads as "yes to dinner" without "I love you too". Every excluded reaction would answer
    more than the invitation asked. Four clear states, one per second, match the 4 s of
    SC05 and give the cinematographer a readable progression for a single close-up.
    Rejected: a beaming smile (closes the ending) and a neutral read with no smile (the
    user's words require that she smiles).
  serves:
  - intent.open_hopeful_ending
  depends_on:
  - tone.ending_restraint
  - story.arc.hana
  applies_to:
  - hana
  - SC05
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
- id: characters.hana.wardrobe.outfit
  statement: |
    At home in the evening: a loose, soft crew-neck knit top in pale sage, long sleeves
    pushed up to the forearm, dropped shoulders. Soft lounge trousers in dusty lilac-grey,
    mostly hidden under the desk. Barefoot or plain socks, never in frame. No print, text,
    logo, jewellery or watch.
  value:
    top:
      color: '#AFC8B6'
      garment: loose_crew_neck_knit
      sleeves: long_pushed_to_forearm
      shoulders: dropped
      print: none
    trousers:
      color: '#9A93A6'
      garment: soft_lounge_trousers
      visible: mostly_hidden
    feet: out_of_frame
    accessories: none
    markings: none
  rationale: |
    The crew neck leaves a clean collar line for the headphones to rest on when she slides
    them down; a hood or high collar would collide with them. The loose knit and dropped
    shoulders make her rounded silhouette and say she is comfortable at home, not dressed
    to go out: she has no idea an invitation is coming. Pale sage is cool enough to
    separate her from the warm lamp light and from the peach-lavender sky in the window
    behind her, and it is a different hue from Ren's blue, so the cut to her reads as a new
    person and a new place. Sleeves pushed up clear her hands for the pencil and the phone.
    Rejected: going-out clothes (would suggest she expects him), pink or red (the battery's
    colour, and pink would read as romantic signalling).
  serves:
  - intent.open_hopeful_ending
  - intent.soft_but_cinematic
  depends_on:
  - characters.hana.silhouette
  - world.rules.season
  - world.rules.no_readable_text
  - world.sets.hana_room
  applies_to:
  - hana
  - SC05
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
  notes: Hex values are proposals for coordination with the look-director.
- id: characters.hana.wardrobe.headphones
  statement: |
    How she wears the world's headphones (world.props.hana_headphones): band over the crown
    of the bob, cups fully over the ears, the bob tucked neatly inside the cups. Colour:
    warm cream shell with pale grey cushions. She slides them down with both hands in one
    smooth move, and they rest around her neck on the collar of her top, cups turned
    slightly outward.
  value:
    shell_color: '#EFE8DC'
    cushion_color: '#CFC7BE'
    position_on: band_over_crown_cups_over_ears_hair_tucked_in_cups
    position_down: resting_on_collar_around_neck_cups_turned_out
    transition: two_hands_one_smooth_slide
    logo: none
    markings: none
  rationale: |
    The headphones are the whole explanation of the missed call (story.arc.hana), so they
    must be the most readable shape on her. Warm cream is light-valued, so it stands out
    against her near-black hair in every lighting state, including when she is backlit by
    the window. Cups fully over the ears make "she could not hear" literal. Using two hands
    in one slide suits the rigid two-position prop the world specified, and the move is
    gentle, not a startled yank: she is not worried, just curious. Rejected: dark
    headphones (they vanish against her hair, the one place they have to read) and a
    one-handed flick (reads as annoyance).
  serves:
  - intent.open_hopeful_ending
  depends_on:
  - world.props.hana_headphones
  - story.arc.hana
  - characters.hana.silhouette
  - characters.hana.wardrobe.outfit
  applies_to:
  - hana
  - SC05
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
  notes: |
    Size, rigidity and wirelessness are the world-designer's (world.props.hana_headphones);
    fit and colour are proposed here, as that entry's notes asked. Colour may be adjusted by
    the look-director.
- id: characters.hana.movement
  statement: |
    Still and economical. Before the phone lights: head tilted down, only the pencil hand
    moves in small strokes, with a slow breath cycle. When it lights, her eyes move first,
    then her head. Then the two-handed slide of the headphones. She picks up the phone with
    one hand and holds it low near her chest to read. The smile comes with a small settle
    of the shoulders. No big gestures; she does not stand up.
  value:
    idle: head_down_pencil_small_strokes_slow_breath
    notice_order:
    - eyes
    - head
    - hands
    headphones: two_hand_slide_down
    phone: one_hand_pick_up_held_low_near_chest
    on_smile: shoulders_settle_slightly
    stands: false
    handedness: right
    pencil_hand: right
  rationale: |
    After his street, her room is the "first frame that feels complete", and stillness is
    what makes it feel settled. Moving eyes before head before hands is a clear anime
    staging order that makes four actions readable in 4 s (the screenwriter flagged SC05 as
    tight). Holding the phone low keeps her face clear for the smile close-up and lets the
    phone light her from below as a new light. Rejected: jumping up or clutching the phone to
    her chest (a declaration, and too big for 4 s).
  serves:
  - intent.open_hopeful_ending
  - intent.soft_but_cinematic
  depends_on:
  - story.arc.hana
  - tone.ending_restraint
  - world.sets.hana_room
  applies_to:
  - hana
  - SC05
  tag: DECISION
  status: LOCKED
  source: agent:character-designer
  version: 1
- id: characters.hana.representation
  statement: |
    MVP: a stylised proxy on the same humanoid skeleton and toon-face system as Ren, with a
    rounded bob mesh, a loose-top shell and attach points for the rigid headphones (head and
    neck positions), pencil and phone. Only the upper body and hands need detail; below the
    desk is simple. Provider-agnostic: any later provider must reproduce the same height,
    head count, silhouette states, wardrobe and colours from the characters.hana.* canon.
  value:
    provider: proxy
    height_m: 1.6
    head_count: 6.3
    build: slight_soft
    silhouette_features:
    - rounded_jaw_length_bob_short_fringe
    - pale_headphones_two_states
    - loose_dropped_shoulder_top
    face:
      method: drawn_toon_face
      controls:
      - eyes_open
      - eyes_down
      - eyes_lower_lids_lift
      - brows_lift
      - blink
      - mouth_closed_soft
      - mouth_corners_up
      lip_sync: false
    hands: five_finger_simplified_1.1x
    rig: humanoid_standard_bone_names
    attach_points:
      head_top: hana_headphones_on
      neck: hana_headphones_down
      hand_r:
      - pencil
      - phone_hana
    detail_zone: upper_body_hands_face
    shading: toon_cel_per_look_canon
    wardrobe_source: characters.hana.wardrobe.*
    colors_source: characters.hana.face.colors
    future_providers_allowed:
    - mpfb
    - vrm
    - generated
    - mocap
    likeness: original_no_real_person_no_existing_character
  rationale: |
    She appears in one 4 s scene, seated, so the proxy spends its detail where the camera
    will be: face controls for the smile, hands and the headphone attach points. The shared
    skeleton and face system with Ren keeps both characters in one style and halves the rig
    work. Describing features and controls rather than a mesh keeps the entry valid for any
    later provider. Rejected: a full-body hero build (unseen legs) and a separate face
    system from Ren's (two styles in one film).
  serves:
  - intent.anime_feel
  - intent.open_hopeful_ending
