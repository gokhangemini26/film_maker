- id: camera.rhythm.transitions
  statement: |
    Hard cuts everywhere. The only fades are the screenplay's FADE IN at the head and FADE
    OUT at the tail (18 frames, after the final image has held). SC03 to SC04 (about ten
    minutes later) is a hard cut from the near-black shop to the dusk kerb. SC04 to SC05 is a
    cut on light: from the sent tick and his release to her phone waking. SC05 to SC06 is a
    cut on direction: her profile or look toward screen left to his westward bookend. No
    dissolves, wipes, sky or wire cutaways between scenes.
  value:
    default: cut
    fade_in: head
    fade_out: {at: tail, frames: 18, after: final_image_hold}
    sc03_to_sc04: hard_cut_black_to_dusk
    sc04_to_sc05: cut_on_light
    sc05_to_sc06: cut_on_direction
    forbidden: [dissolve, wipe, sky_cutaway, wire_cutaway]
  rationale: |
    The near-black end of SC03 already works as a fade, so a hard cut to the dusk sky reads
    as time passing without a device. Cutting on light and on direction joins Ren and Hana
    through the motifs the look already built (the same phone glow, the same western sky)
    instead of through a shared sky shot, which G3 finding 9 excludes. Rejected: a dissolve
    across the time jump (softens the blackout gag's end) and a sky transition into her room
    (the signature transition the originality guard names).
  serves:
  - intent.open_hopeful_ending
  - intent.comic_then_tender
  - intent.soft_but_cinematic
  depends_on:
  - look.style.motifs
  - look.style.originality_guards
  - world.rules.time_and_sun
