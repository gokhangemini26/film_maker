- id: animation.vocab.v2.lids
  statement: A per-character lids track (open, low, closed, with ease and duration) for blinks and heavy
    lids that keep the gaze. It is separate from the look target.
  value:
    vocab_version: 2
    track: lids
    key_fields:
    - f
    - ref
    - ease
    - dur_f
    - note
    - rationale
    refs:
      open: upper lids at the face's own openness (factor 1.0)
      low: heavy lids (factor 0.55), tired or tender
      closed: lids shut (factor 0.0)
    semantics:
      multiplies_face_eye_openness: true
      gaze_kept_through_lids: true
      look_closed_still_legal: for long closures where the gaze does not matter (v1 behaviour); a lids
        key may not fall inside a look `closed` span
      hold_scope_all_blocks_lids: true
      hold_scope_face_blocks_lids: false
    blink_timing_f:
      close: 2-4
      shut: 1-2
      open: 3-6
      total_min: 6
    migration:
      SC03_SH070: 'look: drop f28 closed and f34 phone; lids: f0 open hold, f28 closed ease_in dur_f 4,
        f34 open ease_out dur_f 6 (close 4, shut 2, open 6 = the 12-frame blink)'
      SC04_SH010: 'look: drop f30 closed and f36 phone; lids: f0 open hold, f30 closed ease_in dur_f 2,
        f33 open ease_out dur_f 3'
      SC04_SH030: 'look: drop f22 closed and f28 glovebox (the glovebox look from f4 carries); lids: f0
        open hold, f22 closed ease_in dur_f 2, f25 open ease_out dur_f 3'
      SC05_SH030: 'look: drop f36 closed and f42 phone; lids: f0 open hold, f36 closed ease_in dur_f 2,
        f39 open ease_out dur_f 3 (returns to small_smile''s lifted lids)'
  rationale: 'Blinks are the acting in the held shots: the slow blink in SC03_SH070 is the hinge from
    funny to sad, then there is the tired blink in SC04_SH010, the hesitation blink in SC04_SH030 (characters.ren.expressions
    hesitation_at_heart "a slow blink"), and Hana''s soft blink. In v1 a blink is a look change to `closed`
    and back. The builder renders that as a binary eye switch with no ease, so the 12-frame slow blink
    becomes a 6-frame cut. It also drops the gaze, so the eyes can re-aim when they open. A lids track
    multiplies the face''s openness, so a blink on small_smile keeps her lifted lower lids. Rejected:
    a blink face ref (it would replace the expression for the blink''s length) and a blink event with
    a fixed curve (the four blinks have three different tempos).'
  serves:
  - intent.comic_then_tender
  - intent.open_hopeful_ending
  - intent.anime_feel
  depends_on:
  - animation.vocab.look_target
  - characters.ren.expressions
  - characters.hana.expressions
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.v2.prop.charging_cable
  statement: The one charging cable as a persistent prop. The phone end is always on Ren's phone. The
    source end has a location enum with legal transitions, and a posed/hidden visibility state.
  value:
    vocab_version: 2
    prop: charging_cable
    desc: Ren's cable (continuity.props.cable); a posed curve per shot, never simulated
    fields:
      loc:
      - glovebox
      - hand_r
      - car_usb_adapter
      - hand_l_loop
      - shop_socket
      - loose
      - crank_port
      state:
      - posed
      - hidden
    transitions:
      loc:
        glovebox:
        - hand_r
        hand_r:
        - car_usb_adapter
        - shop_socket
        - crank_port
        - hand_l_loop
        - glovebox
        - loose
        car_usb_adapter:
        - hand_l_loop
        - hand_r
        hand_l_loop:
        - hand_r
        - loose
        shop_socket:
        - loose
        - hand_l_loop
        - hand_r
        loose:
        - hand_r
        - hand_l_loop
        crank_port:
        - loose
        - hand_r
      state:
        posed:
        - hidden
        hidden:
        - posed
    phone_end: phone_ren
    persistent: true
    chained_fields:
    - loc
    before_first_key:
      loc: glovebox
      state: hidden
    chain_by_shot:
      SC01_SH100: f0 glovebox hidden; f23 posed (lid down, it shows with the napkins)
      SC01_SH110: f0 glovebox posed; f18 hand_r (event cable_in_hand)
      SC01_SH120: f0 hand_r; f2 car_usb_adapter (event bolt_on)
      SC01_SH130-SH150: car_usb_adapter (no keys)
      SC02_SH010: 'f0 hand_l_loop, rationale: the cut hides the pull from the adapter (continuity SC02
        pulls it out as he goes)'
      SC02_SH020-SH030: hand_l_loop (no keys)
      SC03_SH010: f0 hand_l_loop; f44 hand_r (he takes the plug as he drops to the kneel)
      SC03_SH020: f0 hand_r; f12 shop_socket (event plug_in)
      SC03_SH030-SH070: shop_socket (no keys; stays plugged after the blackout)
      SC04_SH010: 'f0 loose hidden, rationale: unplugged off screen in the ten-minute gap (continuity.props.cable
        notes)'
      SC04_SH020-SH040: loose hidden (no keys)
      SC04_SH050: 'f0 hand_r posed, rationale: the cut hides the pick-up; f10 crank_port (event plug_in)'
      SC04_SH060-SH090: crank_port (no keys)
      SC06_SH010: crank_port posed
  rationale: 'continuity.props.cable (LOCKED) fixes one cable in every Ren scene, with a different source
    each scene. In v1 it lives only in notes on 9 anim files, so nothing checks that SC03 stays plugged
    after the blackout or that SC04 plugs into the crank port. Typing the source end makes the one-port
    rhyme (world.rules.one_port) checkable across cuts, the same way the glovebox lid is. Only loc chains:
    the posed/hidden state is framing, so it may change at any cut. ASSUMPTION: during SC04_SH010-SH040
    the loose end lies out of view by his left foot and is picked up across the cut into SC04_SH050. The
    prose never says where it is. Rejected: a cable simulation (M3+ risk, and the canon says posed per
    shot).'
  serves:
  - intent.earned_last_signal
  - intent.race_against_battery
  depends_on:
