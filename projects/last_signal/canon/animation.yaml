- id: animation.vocab.v2.prop_state.hidden
  statement: '`hidden` is a visibility state: the prop is in the world at its chained location but is
    not drawn in this shot. In v2 only charging_cable.state carries it.'
  value:
    vocab_version: 2
    value_name: hidden
    granted_to:
    - charging_cable.state
    semantics:
      location_fields_keep_chaining: true
      visibility_chains_across_cuts: false
      builder: hide_render on the prop for the frames it is hidden
      qa: a hidden prop is not an occlusion or missing-prop finding
    extension: other props get `hidden` only by a new vocabulary proposal
  rationale: 'Leaving a prop out of a shot''s tracks is ambiguous: forgotten or deliberately unseen? It
    also drops the location chain. An explicit hidden key says "deliberately unseen" and keeps the chain.
    This is the same idea as ceiling_panels `steady`, a no-op QA can assert. The canon asks for exactly
    this for the cable ("in wides most of its length stays out of frame"). Rejected: a generic visibility
    field on every prop (a schema change for one user), and deleting the object per shot (loses the chain).'
  serves:
  - intent.race_against_battery
  depends_on:
  - continuity.props.cable
  - animation.vocab.prop_states
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.v2.prop.shop_door
  statement: The shop door gets a swing_back state (the closer pulls it back and the motion carries on
    past the cut) and an optional swing_deg for a pinned partial angle.
  value:
    vocab_version: 2
    prop: shop_door
    fields:
      state:
      - closed
      - open_70
      - swing_back
      swing_deg: deg
    transitions:
      state:
        closed:
        - open_70
        open_70:
        - swing_back
        - closed
        swing_back:
        - closed
        - open_70
    swing_back: 'from the current angle toward closed on the door closer (builder constant: about 70 ->
      0 deg over about 36 frames, ease_in_out). The value at the shot''s last frame is whatever the decay
      has reached, never a slam.'
    persistent: false
    migration:
      SC02_SH030: 'props.shop_door: add f14 state swing_back ease ease_in (no dur_f: the closer constant
        runs past the cut)'
  rationale: 'SC02_SH030 ends on the empty, swinging door, and the chime on the cut is the scene''s full
    stop. The prose starts the swing back at f14 and has it "continue after the cut". v1 has only closed
    and open_70, so a closed key at f14 would have to finish by f15: a slam, the loud gag the tone rules
    out (tone.comedy_source). The door was held open instead, which kills the swing. A state that names
    the motion, not its end, fixes that. Rejected: a two-frame swing_deg key (still reads as stopping
    on the cut).'
  serves:
  - intent.race_against_battery
  - intent.comic_then_tender
  depends_on:
  - animation.vocab.prop_states
  - tone.comedy_source
  applies_to:
  - SC02_SH030
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
