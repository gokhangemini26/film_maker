- id: animation.vocab.v2.pose.hana
  statement: 'desk_notice redefined: the head turns, the eyes lead, and the pencil state comes from the
    pencil track, not from the preset.'
  value:
    vocab_version: 2
    redefine:
      desk_notice:
        desc: Seated as desk_sketch, with the head turned 25 deg toward the phone on the desk (yaw only).
          The spine lifts from 26 to 14 deg and the torso twists no more than 6 deg. The right (pencil)
          hand stays on the page where the stroke ended. Whether the pencil is held or laid comes from
          the pencil track. The left hand stays at the sketchbook edge. The eyes come from the look track
          and lead the head (characters.hana.movement notice_order).
        why: v1 bakes "pencil laid down" into the pose, which fights the pencil track (SC05_SH020 lays
          it f6-8, after the blend starts at f5). The v1 builder also parks the right hand off the page.
        checks:
          head_yaw_to_phone_deg: 25
          torso_twist_deg_max: 6
          right_hand_to_sketchbook_page_m_max: 0.03
        needs_context: []
    migration:
      SC05_SH020: no anim key change; re-render
  rationale: Hana's four seconds only read if the order is eyes, head, hands. A pose that lays the pencil
    moves the hands too early. Keeping hand state on the prop track keeps the order exact. Uses only desk
    points the set already has.
  serves:
  - intent.open_hopeful_ending
  depends_on:
  - animation.vocab.pose.hana
  - characters.hana.movement
  applies_to:
  - hana
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.v2.face.ren
  statement: Two new comic-set faces for Ren, wary and determined, both illegal from SC04_SH030 like the
    rest of the comic set.
  value:
    vocab_version: 2
    add_to_comic_set:
      wary:
        desc: brows level and very slightly lowered, eyes a touch narrowed, mouth pressed closed, no smile;
          a held pose
        shape_hint:
          brow_dy: -0.01
          brow_tilt: 0.0
          eye: 0.85
          mouth_w: 0.85
          mouth_h: 0.7
          smile: -0.05
        used_in:
        - SC03_SH020
        - SC03_SH030
      determined:
        desc: brows level and knit (inner ends slightly down), eyes fully open and forward, mouth pressed
          small; the face of the reset in freeze-sag-reset
        shape_hint:
          brow_dy: 0.0
          brow_tilt: -0.15
          eye: 1.0
          mouth_w: 0.8
          mouth_h: 0.7
          smile: 0.0
        used_in:
        - SC01_SH060
        - SC02_SH010
    comic_illegal_from_shot: SC04_SH030
    migration:
      SC01_SH060: face f18 neutral -> determined
      SC02_SH010: face f0 neutral -> determined
      SC03_SH020: face f0 neutral -> wary
      SC03_SH030: face f0 neutral -> wary (f2 freeze unchanged)
  rationale: 'The storyboard asks for these faces by name: "wary" in SC03_SH020 and SC03_SH030 (G3 finding
    7, "wary relief"), and "resolve" in SC01_SH060, which is the same face as the SC02 run. neutral is
    the wrong read for both. Wary with a neutral face loses the half of the gag where he expects the catch.
