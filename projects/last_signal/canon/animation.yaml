    setback_pattern freeze, sag, reset). Both are held poses without graphic symbols, so they fit comic_style
    held_pose_reactions. They join the comic set, so the turn rule still bans them from SC04_SH030. DEPENDENCY:
    characters.ren.expressions is LOCKED and lists the comic set. Adding members needs a change request
