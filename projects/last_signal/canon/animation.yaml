domain: animation
entries:
- id: animation.vocab.pose.ren
  statement: 'Ren''s pose presets: the only body configurations an anim file may name for Ren.'
  value:
    vocab_version: 1
    presets:
      car_upright: Seated upright behind the wheel, hands on the top of the wheel, eyes ahead.
      car_reach_up: Seated, right arm raised to the mirror or the crown tuft, left hand low with the phone.
      car_phone_up: Seated, phone raised to chest or face height in both hands, elbows tucked, neck forward.
      car_sag: Seated, shoulders dropped and head forward, phone fallen to the lap (the letdown).
      car_lean_glovebox: Torso tipped across the cabin, right arm out to the glovebox latch (reach about
        0.75 m).
      car_recline: Sunk back into the seat, head on the headrest, arms slack (relief, eyes closed).
      car_forehead_wheel: Head lowered until the forehead rests on the top of the wheel rim, shoulders
        sagged.
      run_phone_out: Upright running stance, phone arm straight out ahead, right forearm tucked, arms
        not swinging.
      scramble_out: Ducked and unfolding out of the passenger doorway below the 1.45 m roof line.
      kneel_upright: Kneeling on both knees, torso upright, phone tucked at the chest (shop aisle).
      kerb_hunch: Seated on the kerb, back to the car, knees up, forearms loose over the knees, neck forward.
      kerb_crank_hold: Seated on the kerb as kerb_hunch with the crank held in both hands in the lap (cranking
        base).
      kerb_lean_back: Seated on the kerb, spine reclined against the car's rear quarter, knees open, head
        tipping up.
      lunge_low: Right knee down, left foot forward, low lunge toward the passenger doorway.
      lunge_reach: Lunge leaning in through the doorway, left forearm on the seat edge, right arm to the
        glovebox.
  rationale: 'Derived from the 224 free-text keys in the shot animation blocks. Each preset is one body
    configuration a builder can pose from joints; hands on props, breath, blink and the tuft are carried
    by other tracks so the list stays short. Rejected: a preset per prose key (about 90 near-duplicates)
    and keeping prose that a regex reads (it cannot tell ''lowered'' from ''opened'').'
  serves:
  - intent.comic_then_tender
  - intent.anime_feel
  depends_on:
  - characters.ren.movement
  - characters.ren.representation
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.pose.hana
  statement: Hana's pose presets.
  value:
    vocab_version: 1
    presets:
      desk_sketch: Seated at the desk, head tilted down over the sketchbook, right hand drawing, headphones
        on.
      desk_notice: Seated, head turned about 25 deg toward the lit phone, pencil laid down.
      desk_headphones_off: Both hands at the ear cups, sliding the headphones down to the neck.
      desk_phone_low: Seated, phone low near the chest in both hands, headphones on the neck, eyes on
        the screen.
  rationale: 'Hana has one desk and four beats (absorbed, noticing, headphones off, reading); four presets
    cover them and the blends between. Rejected: a rig for a character who never stands.'
  serves:
  - intent.open_hopeful_ending
  depends_on:
  - characters.hana.movement
  - characters.hana.representation
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.face
  statement: 'Face refs: Ren''s comic and tender sets, plus neutral; Hana''s four states.'
  value:
    vocab_version: 1
    ren:
      comic:
      - rehearsed_breath
      - letdown
      - freeze
      - relief
      - stunned_stillness
      tender:
      - focused_calm
      - hesitation_at_heart
      - release_after_send
      - final_look_up
      neutral:
      - neutral
    hana:
      sequence:
      - absorbed
      - noticing
      - reading
      - small_smile
    comic_illegal_from_shot: SC04_SH030
  rationale: Taken from characters.*.expressions, not invented. The comic set is illegal from SC04_SH030
    on so the change of key (tone.the_turn) is checkable on his face.
  serves:
  - intent.comic_then_tender
  - intent.open_hopeful_ending
  depends_on:
  - characters.ren.expressions
  - characters.hana.expressions
  - tone.the_turn
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.look_target
  statement: Eyeline targets the builder resolves to objects in the set.
  value:
    vocab_version: 1
    targets:
      mirror: the rear-view mirror
      phone: the character's own phone
      dash: the dashboard
      glovebox: the glovebox
      lap: the lap
      crank: the crank charger
      road_ahead: ahead through the windscreen or along the street
      shop_door: the shop door
      wall_left: the left wall of the aisle
      wall_right: the right wall of the aisle
      socket: the wall socket / stand corner
      ceiling: the ceiling panels
      sky: up and west toward the afterglow
      sketchbook: the sketchbook page
      off_frame: off frame (implied, nothing to aim at)
      camera: the lens (Ren never looks here in Last Signal)
      closed: eyes closed
  rationale: Eyelines carry most of the acting in this film. A closed list lets the builder aim the head
    and eyes and lets QA check that a target exists in the shot's location.
  serves:
  - intent.comic_then_tender
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.breath
  statement: Breath refs for the breath track.
  value:
    vocab_version: 1
    breaths:
      in_slow: slow breath in, shoulders rise about 1 cm
      out_slow: slow breath out, shoulders fall about 1 cm
      out_long: one long out-breath, shoulders drop 2-3 cm
      hold: 'breath held: nothing moves'
      crank_locked: in on the up half-turn of the crank, out on the down half-turn
  rationale: Breath is the main motion of the held shots, and the ratchet is locked to it after the turn.
  serves:
  - intent.comic_then_tender
  depends_on:
  - tone.the_turn
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.gait
  statement: Gaits and their cycle constants.
  value:
    vocab_version: 1
    gaits:
      none:
        locomotion: false
        desc: no travel; the pose track carries the body
      run_phone_out:
        locomotion: true
        desc: run with the phone arm rigid (arms not swinging), a step every 6 frames
      scramble:
        locomotion: true
        desc: crouched exit from the car into the first strides
      crank_turn:
        locomotion: false
        desc: 24-frame handle cycle; handle_top events every 24 frames
    crank_cycle_f: 24
  rationale: Only five shots travel. crank_turn is one 24-frame handle cycle so the ratchet phase (handle_top
    events) has a single source.
  serves:
  - intent.race_against_battery
  depends_on:
  - characters.ren.movement
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.ease
  statement: Ease names for pose blends and prop tracks.
  value:
    vocab_version: 1
    eases:
      hold: 'no interpolation: the value stays until the next key'
      step: switch in one frame at the key (cel switch)
      linear: constant rate between keys
      ease_in: starts slow, ends fast (falls with weight)
      ease_out: starts fast, ends slow (quick burst that settles)
      ease_in_out: slow at both ends (the default for deliberate moves)
      overshoot_small: ease-out with one small overshoot before it settles (crown-tuft spring)
      gravity: accelerating fall with a short bounce at the stop (crank drop, lid drop)
  rationale: The shot prose uses eight timing words; naming them stops each builder guessing its own curve.
  serves:
  - intent.anime_feel
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.prop_states
  statement: Prop state enums and their legal transitions.
  value:
    vocab_version: 1
    props:
      passenger_door:
        desc: Ren's passenger door (continuity.props.passenger_door).
        fields:
          state:
          - closed
          - open_60
          swing_deg: deg
        transitions:
          state:
            closed:
            - open_60
            open_60:
            - closed
        persistent: true
      glovebox_lid:
        desc: 'Glovebox lid: drops by gravity or is lowered by hand.'
        fields:
          state:
          - closed
          - open_down
          bounce_f: frames
        transitions:
          state:
            closed:
            - open_down
            open_down:
            - closed
        persistent: true
      crank_charger:
        desc: 'The crank charger: where it is, whether the arm is out, pip brightness.'
        fields:
          loc:
          - glovebox
          - falling
          - thighs
          - lap
          - hand_r
          - hands_both
          - knees
          arm:
          - folded
          - unfolded
          pip: unit
        transitions:
          loc:
            glovebox:
            - falling
            - hand_r
            falling:
            - thighs
            thighs:
            - glovebox
            - hand_r
            - hands_both
            - lap
            hand_r:
            - hands_both
            - glovebox
            - lap
            hands_both:
            - lap
            - knees
            - hand_r
            lap:
            - knees
            - hands_both
            - hand_r
            knees:
            - lap
            - hands_both
            - hand_r
          arm:
            folded:
            - unfolded
            unfolded:
            - folded
        persistent: true
      phone_ren:
        desc: 'Ren''s phone: which hand or surface holds it (the screen comes from ui_timeline).'
        fields:
          attach:
          - hand_l
          - hand_r
          - hands_both
          - lap
          - knee
          - chest
          - car_strip
        transitions: {}
        persistent: true
      phone_hana:
        desc: 'Hana''s phone: on the desk or in her hands.'
        fields:
          attach:
          - desk
          - hand_r
          - hands_both
        transitions: {}
        persistent: true
      rear_view_mirror:
        desc: Rear-view mirror tilt, keyed to the hand contact.
        fields:
          tilt_deg: deg
        transitions: {}
        persistent: true
      hana_headphones:
        desc: 'Hana''s headphones (world.props.hana_headphones: two positions and an arc between them).'
        fields:
          state:
          - head
          - neck
        transitions:
          state:
            head:
            - neck
            neck:
            - head
        persistent: true
      pencil:
        desc: Hana's pencil.
        fields:
          state:
          - held
          - laid
        transitions:
          state:
            held:
            - laid
            laid:
            - held
        persistent: true
      car_body:
        desc: Car body motion presets (amplitude and decay are constants in poses.py).
        fields:
          state:
          - still
          - idle_tremble
          - cough
          - sigh_sink
          - stall_shudder
          - sway_1cm
        transitions: {}
        persistent: false
      dash_lights_and_adapter_ring:
        desc: Dash lights and the adapter ring LED.
        fields:
          state:
          - 'on'
          - 'off'
        transitions:
          state:
            'on':
            - 'off'
            'off':
            - 'on'
        persistent: true
      shop_door:
        desc: Shop door (swing continues after the cut).
        fields:
          state:
          - closed
          - open_70
        transitions:
          state:
            closed:
            - open_70
            open_70:
            - closed
        persistent: false
      shop_lights:
        desc: Shop ceiling panels, fridges and fascia sign (the blackout is one frame).
        fields:
          state:
          - 'on'
          - 'off'
        transitions:
          state:
            'on':
            - 'off'
            'off':
            - 'on'
        persistent: true
      ceiling_panels:
        desc: 'Ceiling panels: `steady` is a deliberate no-op QA can assert (the gag is the absence).'
        fields:
          state:
          - steady
        transitions: {}
        persistent: false
  rationale: 'Props are where prose was ambiguous: SC04_SH040 ''lowered by hand ... left down'' was read
    as open, and the crank is ''in the closed glovebox'' in SC04_SH010. An enum (closed | open_down) settles
    it and makes cross-shot continuity checkable.'
  serves:
  - intent.race_against_battery
  depends_on:
  - continuity.props.passenger_door
  - continuity.props.glovebox_and_crank
  - continuity.props.phone_ren
  - continuity.hana.headphones
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.ui_event
  statement: Phone-screen events an anim file may add on top of the states_by_shot table.
  value:
    vocab_version: 1
    events:
      dip: brightness dip to `value` (default 0.7) for `dur_f` frames (flicker, charge lost)
      key_press: a key darkens for `dur_f` frames; `key` is any, emoji, backspace or send
      text: reveal `chars` characters of `line` over `dur_f` frames (typing)
      pulse: the call button pulses over `dur_f` frames
      slide: the screen changes to `to` over `dur_f` frames (1 = in one frame)
      heart: the heart glyph is visible for `dur_f` frames
      progress: the amber send line fills over `dur_f` frames (linear)
      tick: the amber delivered tick appears whole at `f` and stays
      photo_scale: the caller photo scales `from_pct` -> `to_pct` over `dur_f` frames (ease-out)
    screens:
    - map
    - call
    - compose
    - sent
    - 'off'
    - wake
    - received
    keys:
    - any
    - emoji
    - backspace
    - send
  rationale: The canon table fixes the base state per shot; flicker dips, key presses, typing and the
    send line need frame-exact events the table does not carry.
  serves:
  - intent.race_against_battery
  depends_on:
  - look.style.phone_screen.states_by_shot
  - look.style.phone_ui
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.event_kind
  statement: Kinds of named sync events, plus the camera moves and hold scopes an anim file may use.
  value:
    vocab_version: 1
    kinds:
      sound: an audible sync point (the sound-designer cues it by id)
      light: a lighting change (blackout, indicator on/off)
      state: a prop or screen state change worth naming
      visual: a visual beat with no sound (a blink, a contact)
    camera_moves:
      none: locked off
      dolly_in: straight push toward the subject (camera.movement.push_in)
    hold_scopes:
      body: no pose change inside the span
      face: no face change inside the span
      phone: phone and thumb stay put (insert legibility holds)
      all: nothing moves
  rationale: Named events are the sync points audio, QA and editors read by id; the kind says which are
    audible.
  serves:
  - intent.race_against_battery
  depends_on:
  - camera.movement.push_in
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.v2
  statement: 'Vocabulary v2: the v1 names plus the additions and redefinitions in animation.vocab.v2.*,
    adopted together as one version bump (vocab_version 2).'
  value:
    vocab_version: 2
    parts:
    - animation.vocab.v2.pose.ren
    - animation.vocab.v2.pose.hana
    - animation.vocab.v2.face.ren
    - animation.vocab.v2.lids
    - animation.vocab.v2.prop.charging_cable
    - animation.vocab.v2.prop_state.hidden
    - animation.vocab.v2.prop.shop_door
    replaces_on_ratification:
    - animation.vocab.pose.ren
    - animation.vocab.pose.hana
    - animation.vocab.face
    - animation.vocab.prop_states
    unchanged_from_v1:
    - animation.vocab.look_target
    - animation.vocab.breath
    - animation.vocab.gait
    - animation.vocab.ease
    - animation.vocab.ui_event
    - animation.vocab.event_kind
    no_renames: true
    implementation:
      fm_core:
      - animvocab.py VOCAB_VERSION 2 with the POSES, FACES and PROPS of the parts, and a LIDS enum
      - schemas/animation.py CharacterTracks.lids (list of {f, ref, ease, dur_f, note, rationale})
      - animcheck.py lints lids (enum, order, range, a dur_f that does not run past the next lids key);
        hold scope `all` blocks lids keys, `face` does not
      - qa_motion.py honours a per-prop chained_fields list (charging_cable chains loc only)
      blender:
      - poses.py kneel_reach_stand, kneel_head_back and the five redefinitions, each with its acceptance
        checks in tests/test_poses.py
      - FACE_SHAPES wary and determined; the lids value multiplies the face's eye openness
      - charging_cable as a posed curve (phone end fixed to phone_ren, source end at loc), hide_render
        when hidden
      - shop_door swing_back as a closer decay that carries on after the cut
      - shop pose context points stand_back_edge and socket (the only new geometry in v2)
    migration: After ratification and the implementation above, the animation-director moves all 38 anim
      files to vocab_version 2 in one pass, using the per-shot lists in each part. Files that use no v2
      name only change their vocab_version.
  rationale: 'The v1 gaps were patched with the nearest legal name plus a prose note, which is exactly
    the free text builders must not read. v2 closes the gaps that change what the audience sees: the plug-in
    reach, the relief head tilt, the wary and determined faces, blinks that keep the gaze, the one cable,
    and the shop door''s swing back. It also tightens five presets whose v1 text left the builder guessing.
    One version bump for all of it means every anim file migrates once. v1 names are kept, so no v1 key
    becomes illegal. Rejected: separate bumps per gap (seven migrations of 38 files), and editing the
    v1 entries in place (the v1 files would then be checked against text they were not written for).'
  serves:
  - intent.comic_then_tender
  - intent.anime_feel
  - intent.race_against_battery
  depends_on:
  - animation.vocab.pose.ren
  - animation.vocab.pose.hana
  - animation.vocab.face
  - animation.vocab.prop_states
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
- id: animation.vocab.v2.pose.ren
  statement: 'Ren v2 poses: two new kneel presets for the shop, and tighter definitions of kerb_crank_hold,
    lunge_reach, car_forehead_wheel and scramble_out, each with checks a builder test can assert.'
  value:
    vocab_version: 2
    add:
      kneel_reach_stand:
        desc: kneel_upright's knees, pelvis and left hand (phone at the chest), with the torso turned
          about 25 deg to his right and leaning about 12 deg toward the display stand. The right arm reaches
          behind the stand's back edge to the elbow, with the hand at the socket (about 0.30 m high, hidden
          from the lens). The right shoulder dips 4 cm, and the head tilts about 10 deg toward the stand
          to look past its edge.
        checks:
          right_hand_to_socket_m_max: 0.02
          right_elbow: behind the stand_back_edge plane
          left_hand_and_phone_vs_kneel_upright_m_max: 0.03
          crown_not_above_kneel_upright: true
          head_yaw_to_socket_deg_max: 30
        needs_context:
        - shop.stand_back_edge
        - shop.socket
        used_in:
        - SC03_SH020
      kneel_head_back:
        desc: kneel_upright with the head tipped back about 8 deg (neck extends, chest opens about 2 deg).
          Hands and phone stay put. The shoulder drop comes from the breath track, not from the preset.
        checks:
          head_pitch_vs_kneel_upright_deg: -8
          left_hand_and_phone_vs_kneel_upright_m_max: 0.01
          shoulders_vs_kneel_upright_m_max: 0.005
        needs_context: []
        used_in:
        - SC03_SH040
        - SC03_SH050
    redefine:
      kerb_crank_hold:
        desc: Clamped cranking base, with pelvis and feet as kerb_hunch. The crank body lies across between
          the knee tops at the kerb crank point, with knees up and pressed in. The spine leans 22 deg
          forward with the forearms clear of the knees. The right hand is on the knob at 12 o'clock, the
          same pose as gait crank_turn at handle angle 0. The head is pitched toward the crank. The left
          hand follows crank_charger.loc. With hands_both it is under the crank body with the phone flat
          in the palm. With lap (clamped) it holds the phone about 0.76 m high over the near knee beside
          the port (canon crank_grip two_hands_then_crank_hand_plus_phone_hand).
        why: v1 says "crank held in both hands in the lap". That fits SC04_SH040 f44-59 but not the clamped
          cranking in SC04_SH050-SH090 and SC06 f0, where the left hand holds the phone. The notes called
          this a vocabulary gap five times. Driving the left hand from the crank's loc closes the gap
          with no new name.
        checks:
          right_hand_to_knob_m_max: 0.005
          equals_crank_turn_at_angle_0: true
          crank_center_to_kerb_crank_point_m_max: 0.01
          phone_above_crank_top_when_loc_lap: true
        needs_context: []
      lunge_reach:
        desc: lunge_low's legs (right knee down, left foot forward). The torso leans about 52 deg in through
          the passenger doorway, with the crown at least 5 cm under the 1.45 m roof line. The left forearm
          rests on the seat edge with the phone screen up. The right hand is on the glovebox latch, reaching
          no more than 93 % of arm length, with no locked elbow. The head turns at most 40 deg to the
          latch with the eyes on it. Weight is over the front (left) foot.
        why: v1 does not bound the crown against the roof or the reach against the arm, and SC04_SH040
          keeps the jacket under the roof line (camera.framing.jacket_off_sky).
        checks:
          right_hand_to_latch_m_max: 0.01
          crown_z_max_m: 1.4
          left_forearm_mid_to_seat_edge_m_max: 0.03
          reach_fraction_max: 0.93
          head_yaw_deg_max: 40
        needs_context: []
      car_forehead_wheel:
        desc: 'The forehead (not the nose, not the horn pad) rests on the top of the wheel rim. The spine
          curls forward from the seat and the head is pitched at least 45 deg. The shoulders drop 4 cm.
          The hands slide from the top grip down the rim to about +/-78 deg, and the left hand keeps the
          phone against the rim. The face is turned down into the wheel and hidden from the lens (characters.ren.expressions
          face_hidden_beats). The contact is soft: no bounce in the preset.'
        why: v1 names the contact but gives no tolerance, and does not say the face is hidden or where
          the phone hand goes. The shot needs all three.
        checks:
          forehead_to_rim_top_m_max: 0.01
          head_pitch_deg_min: 45
          crown_z_max_m: 1.4
          hands_on_rim_m_max: 0.01
        needs_context: []
      scramble_out:
        desc: Ducked in the passenger doorway with the crown at 1.40 m or lower (the roof line is 1.45
          m). The spine pitches about 52 deg forward and the head leads out with the eyes ahead, not down.
          The left (phone) hand is thrust out ahead at chest height holding the phone (continuity.props.phone_ren
          hand left). The right hand pushes off the sill. The right foot plants on the pavement and the
          left foot is still on the car floor. This is frame 0 of gait scramble.
        why: The v1 builder puts the left hand on the sill, which drops the phone the prose has thrust
          out ahead (SC02_SH010) and breaks the left-hand phone rule. The fix only swaps the existing
          hand targets.
        checks:
          crown_z_max_m: 1.4
          left_hand_ahead_of_chest_m_min: 0.35
          phone_hand: L
          right_hand_to_sill_m_max: 0.02
        needs_context: []
    migration:
      SC03_SH020: 'pose: f0 kneel_upright hold; f1 kneel_reach_stand ease_out blend_f 5 (arm behind the
        stand by f6); f16 kneel_upright ease_in_out blend_f 10; f26 kneel_upright hold'
      SC03_SH040: 'pose: f0 kneel_upright hold; f4 kneel_head_back ease_out blend_f 10; f14 kneel_head_back
        hold'
      SC03_SH050: 'pose: f0 kneel_head_back hold'
      redefinitions: no anim key changes; SC04_SH040-SH090, SC06_SH010, SC04_SH040 (lunge_reach), SC01_SH150
        and SC02_SH010 re-render with the new geometry
  rationale: 'The two kneel presets are the only body shapes in the shop that the audience reads as action.
    One is the fumble behind the stand that turns hope into a plug-in. The other is the relief head tilt
    that the blackout then punishes. Holding them on kneel_upright flattens both beats into one pose.
    The redefinitions only tighten contacts and hand targets the set already has, so they need no new
    geometry, and each gets a numeric check so the builder test catches drift. Rejected: new names for
    the clamped crank grip and the phone-out scramble. Those are the same bodies with the hands placed
    correctly, and a near-duplicate name would break the one-configuration-per-name rule.'
  serves:
  - intent.comic_then_tender
  - intent.race_against_battery
  - intent.anime_feel
  depends_on:
  - animation.vocab.pose.ren
