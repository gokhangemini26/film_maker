  - SC02
  - SC03
  - SC04
  - SC06
  tag: DECISION
  status: PROPOSED
  source: agent:animation-director
  version: 1
  notes: 'Correction (animation-director): SC04_SH010 now keys loose posed, not loose hidden, and SC04_SH020-SH040
    carry loose posed with no keys (G7 review #10; the locked continuity.props.cable keeps the phone end
    visible). The chain_by_shot text and the rationale ASSUMPTION for SC04_SH010-SH040 still say hidden;
