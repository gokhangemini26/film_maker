id: CHANGE-002
status: PROPOSED
target: world.sets.ren_car
reason: 'G6 preview block-out: world.sets.ren_car has no headliner, header/windscreen, seat-back, rear-hatch
  or glovebox open-state geometry; builders are guessing (roof at L*0.62, glovebox at y 0.83 outside the
  SC01_SH100 frame). Adds numeric cabin package consistent with locked height 1.45, sill 0.32, seat 0.45,
  door 1.05, rake 30 and approved SC01 camera positions. Resolves G3 finding 3 (headroom).'
