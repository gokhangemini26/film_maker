  rationale: |
    The car carries three beats (plant, stall, final image), so it is the one set built as a
    hero. The narrow body (1.48 m) keeps the glovebox 0.75 m from the driver's hand, so the
    charger can clunk onto his lap in one move as SC01 needs. The open passenger door (60°)
    over a 1.8 m pavement makes a frame within the frame for the turn. The glovebox holds only
    what the story needs plus napkins for ordinariness: no torch or power bank that would ask
    "why not use that?". Rejected: a full interior (unseen cost).

    G6 cabin package (answers G3 finding 3 and the preview block-out gaps). All interior
        positions are in the street frame so shots and builders share one set of numbers.
        DECISION: the locked 30 deg windscreen rake is measured from the horizontal; that is the
        only reading in which the approved SC01 frontal (lens at y 1.0, z 1.2, "through the
        windscreen from above the bonnet") sits outside the glass (glass is at y 0.52 at that
        height) and the header lands 0.38 m ahead of his head (H-point y -0.30), a normal
        small-car geometry. Cowl at y 0.95 leaves a 0.55-0.6 m bonnet, right for a small old
        hatch. The door hinge at y 0.525 follows from the locked origin (door centre at y 0) and
        the 1.05 m door, and matches the camera bible's open door at y 0 to 0.5.
        ASSUMPTION: roof skin plus headliner 0.05 m (QA estimated 0.05-0.08; the thin end suits a
        stylised build), so headliner z 1.40 under the locked 1.45 m roof. With the seat back at
        the 20 deg recline the character canon already uses, crown plus tuft (1.36) clears it by
        0.04 m; fully upright (1.41) it would touch, so upright beats keep at least ~10 deg of
        recline or lean forward (dependency for animation). The top of the SC01 frontal frame
        lands on the header band (z about 1.385), which is the windscreen frame the shot asks for.
        Glovebox face on the dash's rear face at y 0.50, centred on the passenger seat: 0.76 m
        from the steering-wheel centre (the locked 0.75 m reach), and inside the SC01_SH100 frame
        (24 deg left of the lens axis). The lid drops 80 deg (as the ART_DIRECTION_BIBLE already
        says) to rest almost flat, a small tray that shows its contents. Front seats, rear bench
        and a near-upright closed hatch give the dim rear cabin and rear window the SC01 frontal
        sees between the headrests; the boot stays dark and unbuilt. Rejected: raising the roof to
        1.50 m (would reopen a locked height the camera bible's kerb ray check cites) and lowering
        the seat (would move every SC01 eye height of 1.20 m).
