id: CHANGE-006
status: PROPOSED
target: look.exposure.scene_keys
reason: 'SC03 blackout exposure is measured on the room, not the source. FACT: draft frames measure SC03_SH060
  ~0.40 (the lit screen fills about half the 71 mm insert; surround blue-black) and SC03_SH070 0.27 (westmost
  fridge flank lit; that part is fixed in the builder by a 100 deg pool cone, see look.lighting.sc03_blackout_render
  rule 6). FACT: the room alone sits at luma ~0.11-0.13 (#1B1C29/#1E2030), so a whole-frame 0.14 ceiling
  cannot hold any frame where a lit subject or screen covers more than a few per cent without pushing
  the room below the film floor or adding a global exposure drop (forbidden by look.lighting.sc03_blackout_render
  rule 1). Numbers unchanged; the human ruling of 2026-10-02 (target 0.12) sits inside SC03_blackout 0.08+-0.06.
  Rejected: gating SH060/SH070 on the whole frame (dims the 2 % screen, the payoff) and exempting them
  (no blackout test at all). Serves intent.comic_then_tender, intent.soft_but_cinematic, intent.race_against_battery.'
set:
  statement: 'Target mean frame luminance per scene (0-1, display-referred): SC01 0.62, SC02 0.70, SC03
    lit 0.74 then blackout 0.08, SC04 0.46, SC05 0.52, SC06 0.42. A tolerance of plus or minus 0.06 per
    shot. The SC03 blackout key is measured on the room, not on the light source that is the subject:
    whole frame in SC03_SH050, the frame minus the phone screen in SC03_SH060, the frame minus Ren lit
    tones, the phone and the door rectangle in SC03_SH070 (regions and caps in look.lighting.sc03_blackout_render
    checks). Every other scene and the SC03 lit state stay whole-frame.'
  value:
    SC01: 0.62
    SC02: 0.7
    SC03_lit: 0.74
    SC03_blackout: 0.08
    SC04: 0.46
    SC05: 0.52
    SC06: 0.42
    tolerance: 0.06
    measured_on:
      default: whole_frame
      SC03_blackout: room_region_per_shot
      SC03_blackout_regions_ref: look.lighting.sc03_blackout_render.checks.mean_luma_region
