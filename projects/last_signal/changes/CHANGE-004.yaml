id: CHANGE-004
status: APPROVED
target: world.sets.hana_room
reason: 'G6 preview: world.sets.hana_room has sizes but no origin, axes or positions; shots and builder
  assume a centred layout the canon never states, and the builder pins the sketches over the window glass.
  Adds the frame, window/desk/chair centres, desk layout and sketch zones.'
set:
  value:
    footprint_m:
    - 3.0
    - 3.6
    ceiling_m: 2.4
    window:
      width_m: 1.2
      height_m: 1.1
      sill_height_m: 0.9
      wall: west
      curtains: open
      centre_x_m: 0.0
    desk:
      size_m:
      - 1.1
      - 0.55
      height_m: 0.72
      against: window_wall
      centre_m:
      - 0.0
      - -0.275
    chair: simple_desk_chair
    desk_lamp:
      position: desk_left
      switched_on: true
    phone_position: desk_right_of_sketchbook_face_up
    wall_sketches: 4-6_pinned_above_desk
    detail_zone: window_wall_and_desk
    rest_of_room: low_detail_in_shadow
    frame:
      origin: window_wall_inner_face_centre_at_floor
      plus_x: north
      plus_y: west
      z: up
      interior_x_m:
      - -1.5
      - 1.5
      interior_y_m:
      - -3.6
      - 0.0
    chair_centre_m:
    - 0.0
    - -0.85
    desk_layout_m:
      desk_lamp_base:
      - -0.45
      - -0.2
      pencil_cup:
      - -0.3
      - -0.12
      sketchbook_centre:
      - -0.05
      - -0.25
      phone_hana_centre:
      - 0.25
      - -0.3
    wall_sketch_zones:
      x_m:
      - - -1.15
        - -0.7
      - - 0.7
        - 1.15
      z_m:
      - 1.1
      - 1.95
      'on': window_wall_either_side_of_window
  rationale: |
    SC05 is four seconds, framed at her desk; building the window wall and desk and letting
    the rest fall into shadow gives a complete, cosy frame at minimum cost. Phone face-up to
    her right, on the far side from the lamp, so its light is a separate, new light on her
    face when it wakes. Rejected: a fully dressed room (unseen detail).

    G6 layout numbers. Makes numeric the room frame the SC05 shots already use (x north, y
        west, origin on the window wall) and the centred layout the preview builds: window and
        desk centred, chair and Hana at y -0.85, lamp at her left (south), phone to her right
        (north) on the far side from the lamp. The desk spans the window, so the pinned sketches
        go on the window wall either side of the window (as the ART_DIRECTION_BIBLE says), never
        over the glass: the sky must stay clear in her frames. Rejected: sketches above the window
        (the head band is only 0.4 m and would crowd the ceiling).
