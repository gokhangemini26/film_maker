  rationale: |
    Putting the socket at the very back, low and behind a stand, makes him cross the whole shop
    and kneel for it (the public, effortful dash that makes this failure cost more than the
    car), and it puts him in the deepest part of the room when the lights go, with the door as
    a small far rectangle behind him. The fridges on the back wall are right in front of him,
    so their hum and glow dying is the event he sees. Rejected: a socket by the door (no
    effort, and daylight from the door would light him).

    G6 layout numbers. The statement's origin (door threshold centre, +x to the right on
        entering = west) is made numeric, because the SC03 shots are authored in it (the west
        aisle axis near x 1.2-1.5, the socket corner at the west end of the back wall).
        Socket 0.30 m in from the west wall; the display stand stands just east of it, leaving a
        0.25 m slot at the wall, so from the aisle the socket is hidden but his arm can reach in
        behind the stand's west end while he kneels. The three fridges are packed centre-left
        (x -0.95 to 1.15) so they do not collide with the stand (a 0.7 m-deep fridge in the right
        corner would occupy the stand's floor); they sit forward-left of him, still the glow he
        sees die. Four 0.6 x 1.2 flush panels in one row down the centre, evenly spaced, matching
        what the preview already lights; the last one (y 7.875) is almost over his head, so the
        SC03 low-angle "wary check" finds a panel in frame and the blackout happens above him.
        Rejected: fridges filling the whole back wall (collides with the stand and the socket).
