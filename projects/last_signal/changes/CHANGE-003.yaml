id: CHANGE-003
status: PROPOSED
target: world.sets.corner_shop
reason: 'G6 preview: corner shop canon gives the socket only height/depth and the ceiling panels only
  a count; no lateral positions for socket, stand or fridges (fridge 3 and the stand overlap in the build)
  and the builder uses a corner origin instead of the stated door-centre origin. Adds numeric frame, socket
  x, stand and fridge positions, and panel layout.'
