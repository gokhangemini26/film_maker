id: CHANGE-007
status: PROPOSED
target: look.exposure.scene_keys
reason: 'G5 finding 19 follow-up (qa/EXPOSURE_ANALYSIS.md). Numbers unchanged; two definition fixes. (1)
  FACT: the metric was never written down (G4 finding 6); CHANGE-006 and fm qa stills both use display
  luma = Rec.709 weights on sRGB code values (#1B1C29 = 0.11), so it is stated. (2) FACT: in the SC04-SC05
  phone inserts the lit screen (luma ~0.95, allowed to clip by look.exposure.value_structure) covers 29-38
  % of the frame. A whole-frame 0.46 with 38 % screen needs the surround at ~0.16 luma, below the 0.30-value
  floor (#34354F) that value_structure sets, so the key and the floor cannot both hold. Measuring the
  surround is the same rule CHANGE-006 applied to SC03_SH060. This does NOT excuse the current renders:
  with the screen removed, those inserts still measure 0.61-0.67 (render fix proposed in the analysis).
  Rejected: exempting inserts (no exposure test on 5 of 13 tender shots). Serves intent.comic_then_tender,
  intent.soft_but_cinematic.'
set:
  statement: 'Target mean frame luminance per scene (0-1, display-referred luma, Rec.709 weights on sRGB
    code values): SC01 0.62, SC02 0.70, SC03 lit 0.74 then blackout 0.08, SC04 0.46, SC05 0.52, SC06 0.42.
    A tolerance of plus or minus 0.06 per shot. The SC03 blackout key is measured on the room, not on
    the light source that is the subject: whole frame in SC03_SH050, the frame minus the phone screen
    in SC03_SH060, the frame minus Ren lit tones, the phone and the door rectangle in SC03_SH070 (regions
    and caps in look.lighting.sc03_blackout_render checks). In SC04-SC06, an insert whose subject is a
    lit phone screen is measured on the frame minus that screen (the screen may clip, look.exposure.value_structure).
    Every other shot, and the SC03 lit state, stays whole-frame.'
  value:
    SC01: 0.62
    SC02: 0.7
    SC03_lit: 0.74
    SC03_blackout: 0.08
    SC04: 0.46
    SC05: 0.52
    SC06: 0.42
    tolerance: 0.06
    metric: mean_display_luma_rec709_on_srgb_codes
    measured_on:
      default: whole_frame
      SC03_blackout: room_region_per_shot
      SC03_blackout_regions_ref: look.lighting.sc03_blackout_render.checks.mean_luma_region
      phone_screen_inserts: frame_minus_lit_phone_screen
      phone_screen_inserts_scenes:
      - SC04
      - SC05
      - SC06
