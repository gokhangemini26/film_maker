  note: 'PLACEHOLDER door closer pulling the empty door back from f14 (vocab v2 shop_door key swing_back,
    ease_in, no dur_f); settles under SC03_SH010, never a slam (human_supply foley.shop_door_push). ASSUMPTION:
    anchored door_push +4 until the animation-director names an event at f14'
  rationale: 'DECISION (v2 refresh): the swing-back is the shot''s last image, so it gets a soft, slow
    closer sound that keeps decaying past the cut instead of a stop. Mechanism: -38 dB with a 5 f fade
    sits well under the -20 dB chime on f15, so it adds air and motion to the empty door without competing
    with the one chime (still exactly one shop.door_chime cue). Anchored to the door''s own door_push
    event +4 (push f10, swing-in f10-13, swing-back f14): the anim has no event on the swing_back key,
    so the animation-director is asked for one. Rejected: a door-close thud or latch (the anim rules out
    a slam, tone.comedy_source), and a second bell strike for the swing (two chimes read as two doors).'
