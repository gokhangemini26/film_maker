  summary: 'The bookend: he watches the screen die without reaching (f0-24), leans back against the car
    (f20-46), lays the dark phone on his chest (f24-46), looks up west (f40-56), holds one breath under
    the fade.'
  stamped_content_hash: sha256:ddee172d1a5bc97e90175aa013becd8ac65954a79212ae9ea5f46a1dcc197bf7
shot_id: SC06_SH010
frames: 82
vocab_version: 2
rationale: 'It is out of his hands and the body says so in order: watch the screen die without reaching,
  lean back, lay the dark phone on his chest under a flat hand, and only then look up to the west. Each
  move starts before the last ends and eases in and out with no overshoot, so the three read as one long
  exhale in the frame that opened SC04 hunched (camera.geography.sc04_sc06). The look up stops short of
  a smile (tone.ending_restraint); the last 26 frames hold on one breath under the fade out.'
characters:
  ren:
    pose:
    - f: 0
      ref: kerb_crank_hold
      ease: hold
      note: 'as SC04_SH090 ended but eyes open: phone at his left knee, screen turned to the lens; crank
        in his lap, arm out, right hand resting on it; completely still f0-19'
    - f: 20
      ref: kerb_lean_back
      ease: ease_in_out
      blend_f: 26
      note: spine loosens and reclines against the car's rear quarter f20-46; knees stay up but open ~10
        deg; left hand carries the dark phone to his chest f24-40 and lies flat over it f40-46
      rationale: 'one slow blend: the lean, the hand and the settle overlap as one exhale'
    - f: 46
      ref: kerb_lean_back
      ease: hold
      note: final hold to the cut
    move:
      gait: none
      note: seated on the kerb, back to the car
    face:
    - f: 0
      ref: neutral
      note: eyes open on the fading screen; quiet
    - f: 50
      ref: final_look_up
      note: eyelids low, mouth soft, the faintest ease at the corners f50-60; short of a smile
    look:
    - f: 0
      target: phone
      note: the fading screen f0-39; he does not reach for it
    - f: 40
      target: sky
      note: eyes lift first f40-43, then the head tips up and to screen left (west, the afterglow) f42-56,
        ease-in-out
    breath:
    - f: 56
      ref: in_slow
      dur_f: 12
      note: in f56-67, shoulders rise 0.5 cm
    - f: 68
      ref: out_slow
      dur_f: 14
      note: out f68-81
