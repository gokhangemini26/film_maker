shot_id: SC01_SH130
frames: 34
vocab_version: 2
rationale: 'The relief is the first slow, unhurried move of the film (12-frame ease_in_out recline, a
  17-frame long out-breath), so it feels earned for a moment. He is passive from f12: eyes closed through
  the sigh, shudder and stall, so the audience sees the death before he does (tone.comedy_source). The
  stall is frame-exact on f32: car_body still, dash and ring off, bolt off (canon table) and the phone''s
  3-frame dip starts, straddling the cut (frames 1-2 here, frame 3 is SH140 f0).'
characters:
  ren:
    pose:
    - f: 0
      ref: car_upright
      ease: hold
      note: sitting forward, right hand just back from the adapter, phone in the left hand on his thigh
        (>= 10 deg forward lean under the 1.40 m headliner). Prose starts the recline at f0; it starts
        at f1 here because the first key cannot carry a blend
    - f: 1
      ref: car_recline
      ease: ease_in_out
      blend_f: 11
      note: 'sinks back f1-12: spine reclines into the seat, head back to the headrest'
      rationale: ease_in_out, the first slow move of the film
    - f: 12
      ref: car_recline
      ease: hold
      note: relief held; he rides the car's sigh and shudder passively (car_body drives it); tuft and
        head follow the shudder 1 frame late f26-32
    move:
      gait: none
    face:
    - f: 0
      ref: neutral
    - f: 6
      ref: relief
      note: eyes close f6-8, mouth soft, head back; unchanged through the stall
    look:
    - f: 0
      target: dash
      note: just back from the adapter
    - f: 8
      target: closed
      note: eyes closed from f8; he never sees the stall
    breath:
    - f: 4
      ref: out_long
      dur_f: 17
      note: long exhale f4-20, shoulders fall 2 cm
