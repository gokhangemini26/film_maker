shot_id: SC01_SH060
frames: 34
vocab_version: 1
rationale: 'The first full freeze-sag-reset (characters.ren.movement setback_pattern): the sag falls with
  weight (ease_in), holds 9 frames so the letdown is felt, and the reset is one upward burst with a single
  small overshoot (overshoot_small) - "tries again anyway" (tone.comedy_source). The sit-up lands into
  the mild low angle so lens and body say the same thing.'
characters:
  ren:
    pose:
    - f: 0
      ref: car_phone_up
      ease: hold
      note: 'matches SH040''s end: phone at chest, cheeks full, eyes on the phone (the freeze carried
        through the ring)'
    - f: 3
      ref: car_sag
      ease: ease_in
      blend_f: 6
      note: 'sag: phone drops toward his lap, screen away from us; shoulders fall, head drops forward
        (falls with weight); lands f9'
      rationale: ease_in so the fall accelerates into the seat like weight, not a slide
    - f: 9
      ref: car_sag
      ease: hold
      note: 'sag landed: phone on his lap, shoulders down 3 cm; held, nothing moves f9-17'
    - f: 18
      ref: car_sag
      ease: ease_in
      blend_f: 2
      note: 'anticipation: body dips 1 cm, eyes flick up, brows go level and knit (VOCAB GAP: the 1 cm
        dip is not a preset; same preset keyed so the builder has the beat)'
    - f: 20
      ref: car_phone_up
      ease: overshoot_small
      blend_f: 7
      note: 'reset: sits up straight in one burst, phone up in both hands to face distance, elbows tucked,
        neck forward; 1 cm upward overshoot about f25, settled f27'
      rationale: one overshoot is persistence; a bigger bounce would read manic
    - f: 27
      ref: car_phone_up
      ease: hold
      note: 'settled: thumbs poised over the screen, brows knit, mouth pressed; held to the cut'
    move:
      gait: none
    face:
    - f: 0
      ref: rehearsed_breath
      note: cheeks full from SH040, deflate f2-3
    - f: 9
      ref: letdown
      note: inner brows up, mouth flat, f9-17
    - f: 18
      ref: neutral
      note: 'brows level and knit, mouth pressed: resolve. neutral is the v1 stand-in; V2 PENDING (animation.vocab.v2.face.ren):
        ref determined'
    look:
    - f: 0
      target: phone
      note: follows the phone down to the lap on the sag
    - f: 18
      target: road_ahead
      note: eyes flick up (anticipation), 2 frames
    - f: 20
      target: phone
      note: snaps back to the phone at face height on the reset
    breath:
    - f: 2
      ref: out_slow
      dur_f: 2
      note: 'cheeks deflate: the held breath from SH040 goes out (2 f)'
props:
  phone_ren:
  - f: 0
    attach: hand_l
    note: CONFLICT flagged - prose says "phone at chest in both hands" at f0 but SH040 ends with the phone
      in the left hand and the right thumb hovering; kept hand_l so the cut chains; the right hand is
      close to the phone
  - f: 20
    attach: hands_both
    note: phone comes up in both hands on the reset (continuity.props.phone_ren SC01 grip two_hands_typing)
  passenger_door:
