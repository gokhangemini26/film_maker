  burst is short (16 frames, one key press per frame) and the reading hold is long (42 frames, minimum
  41). The thumbs leave the text area at once and park on the bottom edge. Opposite of the tender half''s
  one-thumb glide (SC04_SH050/060). ASSUMPTION carried from the shot: ~31 characters per second is an
  anime ellipsis.'
