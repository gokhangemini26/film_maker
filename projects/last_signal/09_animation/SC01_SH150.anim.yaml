shot_id: SC01_SH150
frames: 36
vocab_version: 1
rationale: 'The only slow fall in the comedy: 18 frames of ease_in_out onto a soft contact on the rim
  (never the horn pad, no bounce - a honk or a bump would turn sympathy into a bigger gag), then one out-breath
  and a 12-frame hold to the cut. The face is hidden on the rim (characters.ren.expressions face_hidden_beats
  forehead_on_wheel_SC01); the tuft stays upright, a small stubborn flag for the reset in SC02.'
characters:
  ren:
    pose:
    - f: 0
      ref: car_upright
      ease: hold
      note: 'upright, both hands on the top of the wheel (phone in the left hand against the rim), staring
        ahead: a held freeze f0-5; >= 10 deg recline or forward lean under the 1.40 m headliner'
    - f: 6
      ref: car_forehead_wheel
      ease: ease_in_out
      blend_f: 18
      note: neck bends, spine curls; forehead meets the top of the wheel rim (not the horn pad) at f24,
        soft contact, no bounce
      rationale: slow and small is defeat; fast would be manic
    - f: 24
      ref: car_forehead_wheel
      ease: hold
      note: resting on the rim; shoulders sag 1.5 cm on one out-breath f26-30 (breath track); held to
        the cut
    move:
      gait: none
    face:
    - f: 0
      ref: freeze
      note: eyes open, brows flat
    - f: 16
      ref: letdown
      note: eyes close on the way down; face hidden from f24
    look:
    - f: 0
      target: road_ahead
      note: ahead through the windscreen f0-15
    - f: 16
      target: closed
    breath:
    - f: 26
      ref: out_long
      dur_f: 5
      note: shoulders sag 1.5 cm on one out-breath f26-30 (out_long is 2-3 cm; use the small end)
