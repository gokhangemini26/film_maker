shot_id: SC02_SH030
frames: 16
vocab_version: 2
rationale: 'Brief hope in motion: he made it. The run banks rather than skids (the curve lives in the
  path, not in a skid pose), he is gone by f13 so the last frames are the empty swinging door, and the
  chime event sits on f15, the cut point and the scene''s full stop.'
characters:
  ren:
    pose:
    - f: 0
      ref: run_phone_out
      ease: hold
      note: 'running toward the lens, left foot contact on f0, phone out ahead. f6 right foot plants and
        he starts to bank toward screen right (his left); f8 banked about 10 deg, head ducks under the
        awning; f10 right hand pushes the door; f11 ducking through; f13 last of him (heel, jacket hem)
        through the door. No swerve, door-push or duck preset exists in vocabulary v2 either: the bank
        comes from the path curvature and the rest is held on the run preset'
      rationale: keeping the compass run through the swerve keeps it earnest (no near-miss, no wall bump)
    move:
      gait: run_phone_out
      speed_mps: 4.1
      path:
      - f: 0
        x: -0.8
        y: 10.4
      - f: 6
        x: -0.85
        y: 11.4
      - f: 10
        x: -1.45
        y: 11.85
      - f: 13
        x: -2.0
        y: 12.0
      note: 'street coords: west along x -0.8 toward the lens (camera at y 17 looking east), swerving
        south (screen right, his left) through the shop door at (-1.8, 12.0). f13 ends 0.2 m past the
        door plane so the body is through by the prose''s "gone". 2.3 m in 13 f: mean about 4.3 m/s, about
        4.5 m/s through the swerve (prose 4.1). Start moved from the prose''s "about y 10.2" to y 10.4
        to keep the swerve from getting faster than the straight'
    face:
    - f: 0
      ref: neutral
      note: small in frame; eyes on the door
    look:
    - f: 0
      target: shop_door
      note: the shop door from f0
props:
  shop_door:
  - f: 0
    state: closed
    note: closed until his hand reaches it
  - f: 10
    state: open_70
    ease: ease_out
    dur_f: 4
    note: his right hand pushes it; swings in to about 70 deg over f10-13
  - f: 14
    state: swing_back
    ease: ease_in
    note: the closer starts pulling the empty door back from f14; the decay continues after the cut (no
      dur_f), so the last frame is mid-swing, never a slam
    rationale: the empty, swinging door is the shot's last image and the chime on f15 is the full stop;
      a closed key would finish by f15 as a slam, the loud gag tone.comedy_source rules out (animation.vocab.v2.prop.shop_door)
  passenger_door:
  - f: 0
    state: open_60
    note: far in the background behind him, readable as a shape; still open at 60 deg (continuity.props.passenger_door)
  phone_ren:
  - f: 0
    attach: hand_l
    note: phone out ahead in the left hand; cable loop swings wide on the turn (posed; charging_cable
      stays hand_l_loop from SC02_SH010, no keys here)
