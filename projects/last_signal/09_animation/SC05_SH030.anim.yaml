rationale: 'The film''s only answer, built as characters.hana.expressions describes it: eyes finish reading,
  then lids lift, corners rise with lips closed, head dips and shoulders settle, each a few frames after
  the last, so the smile lands at f22 as one soft wave and is held 30 frames without growing. She never
  looks up: private pleasure, a yes to dinner, not a declaration (tone.ending_restraint).'
