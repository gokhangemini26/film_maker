frames: 32
vocab_version: 2
rationale: 'Four actions fit in 32 frames only as overlapping, economical moves in the canon''s order:
  eyes, head, hands (characters.hana.movement). Each begins before the last ends, so it reads as one calm
  gesture; the two-handed slide is smooth in its own 8 frames, curious rather than startled, and the reach
  is short because the phone lies by her pencil hand.'
characters:
  hana:
    pose:
    - f: 0
      ref: desk_sketch
      ease: hold
      note: absorbed over the sketchbook, headphones on, right hand finishing a small stroke f0-2; slow
        breath
    - f: 5
      ref: desk_notice
      ease: ease_out
      blend_f: 3
      note: head turns ~25 deg toward the phone after the eyes (ease-out, head arrives f10); pencil laid
        f6-8
    - f: 8
      ref: desk_headphones_off
      ease: ease_in_out
      blend_f: 4
      note: both hands rise to the ear cups f8-12, then slide down with the cups f12-19 (prop arc)
    - f: 19
      ref: desk_phone_low
      ease: ease_in_out
      blend_f: 11
      note: 'hands leave the cups; right hand reaches the short way to the phone (~0.2 m) f19-23, grips
        f23, lifts it low toward her chest f24-29, left hand joins f28-30; left hand lowers to the desk
        edge on the way (no reach preset: gap, carried by the blend and phone_hana attach)'
    - f: 30
      ref: desk_phone_low
      ease: hold
      note: low near her chest in both hands, eyes on the screen (matches SH030 f0)
    move:
      gait: none
      note: seated; she does not stand
    face:
    - f: 0
      ref: absorbed
    - f: 6
      ref: noticing
      note: brows lift a touch
    - f: 25
      ref: reading
      note: reading begins as the phone comes up; no gasp, no grin, no blush
    look:
    - f: 0
      target: sketchbook
      note: the page f0-2
    - f: 3
      target: phone
      note: eyes flick to the lit phone f3-5, before the head; on the screen in her hands from f25
    breath:
    - f: 0
      ref: in_slow
      dur_f: 8
      note: slow breath, absorbed
    - f: 19
      ref: out_slow
      dur_f: 4
      note: shoulders drop a little as the headphones come off f19-22
