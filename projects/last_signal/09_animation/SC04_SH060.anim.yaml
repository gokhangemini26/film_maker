      note: 'off frame (insert): clamped-high cranking base: crank lying across between the tops of his
        knees (top face ~z 0.66, tipped ~30 deg to the lens, pip above the near knee), phone in the left
        hand ~z 0.76 over the near knee beside the port end. kerb_crank_hold in v1 reads "crank in the
        lap in both hands"; V2 PENDING (animation.vocab.v2.pose.ren) redefines it as exactly this clamped
        base (left hand driven by crank_charger loc lap), no key change; right hand keeps cranking'
