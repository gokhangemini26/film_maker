rationale: 'The most tender beat is carried by one thumb because his face is not in the shot: the canon''s
  hesitation at the heart becomes a thumb that stops and looks (12 f), drifts to delete and hovers perfectly
  still (14 f) before it presses (characters.ren.expressions hesitation_at_heart). Words arrive by a slow
  glide, not taps. The crank is heard, not seen: the crank_turn phase from SC04_SH050 drives the clicks
  at f0, f24 and f48.'
