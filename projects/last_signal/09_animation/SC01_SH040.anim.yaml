shot_id: SC01_SH040
frames: 30
vocab_version: 1
rationale: 'The rehearsed breath is a held pose, not a rubbery take (characters.ren.expressions comic_style
  held_pose_reactions): breath in f2-7, a true 8-frame hold f8-15, eyes open in one frame at f16, thumb
  down and tap f18-21. The breath is never let out here: the breath track holds from f8 to the last frame
  so the ring insert plays as held breath and the audience holds it with him.'
characters:
  ren:
    pose:
    - f: 0
      ref: car_phone_up
      ease: hold
      note: phone in the left hand at chest height about 0.3 m from his face, right thumb poised, elbows
        tucked, neck forward. Upright seated beats need >= 10 deg recline or forward lean under the 1.40
        m headliner; car_phone_up's neck-forward lean covers it (blender-td to confirm)
    - f: 8
      ref: car_phone_up
      ease: hold
      note: true hold, nothing moves (8 f)
    - f: 18
      ref: car_phone_up
      ease: ease_in
      blend_f: 2
      note: right thumb comes down to the call button; contact f20-21 (VOCAB GAP - thumb tap is not a
        body preset; the preset does not change)
    - f: 22
      ref: car_phone_up
      ease: hold
      note: thumb lifts 1 cm and hovers; cheeks full, eyes wide on the phone; still to the cut
    move:
      gait: none
    face:
    - f: 0
      ref: rehearsed_breath
      note: cheeks fill from f2, eyes closed f7-15, eyes open in one frame at f16 (cel switch), cheeks
        full to the cut; the eye states are the face ref's own controls
      rationale: comic set legal (before SC04_SH030); no graphic symbols
    look:
    - f: 0
      target: phone
    - f: 7
      target: closed
      note: eyes shut; the head stays aimed at the phone (does not turn)
    - f: 16
      target: phone
      note: eyes open in one frame (cel switch)
    breath:
    - f: 2
      ref: in_slow
      dur_f: 6
      note: 'breath in f2-7: prose asks chest and shoulders up 2 cm (ease-in); in_slow is defined as about
        1 cm - builder should read the rehearsed breath as the larger end'
    - f: 8
      ref: hold
      dur_f: 22
      note: breath held f8-29 and across the cut into SH050/SH060 (released in SH060 f2)
