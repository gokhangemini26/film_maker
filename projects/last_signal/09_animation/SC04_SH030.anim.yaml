vocab_version: 1
rationale: Opens with the head about one sixth turned so the question reads three-quarter to the lens;
  the eyes lead, the look commits at f4 (the push-in starts on it) and lands on the glovebox at f10; the
  head arrives at f16 with an even ease-in-out, the tender tempo (characters.ren.movement turn tempo slow_deliberate).
  Then stillness, one breath, one blink, and the decision as a small weight shift, never a comic reset
  (tone.the_turn).
characters:
  ren:
    pose:
    - f: 0
      ref: kerb_hunch
      ease: hold
      note: 'head about 20 deg of the ~115 deg turn toward the open door at f0 (not expressible as a preset:
        gap). Only head and eyes move until f28. f28-33 the forearms lift off the knees and weight starts
        west (no preset for it: gap); matches SC04_SH040 f0'
      rationale: the body stays hunched while the look does the work; the lift at f28 is the decision
    move:
      gait: none
      note: seated on the kerb
    face:
    - f: 0
      ref: neutral
      note: 'f0-9 readable three-quarter: brows level, very slightly lifted (the question), mouth soft'
    - f: 28
      ref: focused_calm
      note: 'the decision: chin lowers a touch, brows settle level'
      rationale: hesitation becomes focused calm, read in stillness and the forearms
    look:
    - f: 0
      target: phone
      note: eyes just lifted off the phone, sliding screen left f0-2 (eyes lead); head at ~20 deg
    - f: 4
      target: glovebox
      note: the look commits at f4 (eyes fixed on the door opening, head ~35 deg); head turn ease-in-out
        f2-16, ~95 deg in 14 f, no snap; eyes land on the glovebox f10 (head ~85 deg); head arrives f16,
        no overshoot
      rationale: the push-in starts on this frame; the audience follows his look into depth
    - f: 22
      target: closed
      note: one slow blink f22-27
    - f: 28
      target: glovebox
      note: eyes reopen on the glovebox, held to the cut
    breath:
    - f: 20
      ref: in_slow
      dur_f: 9
      note: small breath in f20-28, shoulders rise 1 cm
