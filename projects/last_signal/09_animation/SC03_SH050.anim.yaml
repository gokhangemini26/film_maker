shot_id: SC03_SH050
frames: 30
vocab_version: 2
rationale: 'The gag is that nothing moves: one pose, one face, breath held and a whole-shot `all` hold,
  so any flinch is a checkable error. The world does the gag: shop_lights on -> off as a one-frame step
  at f8, on the same frame as the clunk, the fridge-hum stop and the charge-loss events audio binds to.
  The dip mirrors the canon screen row so the pool of phone light stutters once and blooms back at f11.'
