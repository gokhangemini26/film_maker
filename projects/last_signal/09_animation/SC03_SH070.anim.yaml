shot_id: SC03_SH070
frames: 48
vocab_version: 2
rationale: '"He doesn''t move" taken literally: one pose, one face, breath held for the whole shot (no
  breathing idle), two asserted holds (f0-27, the longest comic hold, and f40-47 to the cut). The only
  change is one slow blink at about 1.2 s, the hinge from funny to a little sad that hands the film to
  the tender half.'
characters:
  ren:
    pose:
    - f: 0
      ref: kneel_upright
      ease: hold
      note: kneeling, face lit from below, phone and hands at the frame bottom; the pose never changes
      rationale: a sigh or a head drop would resolve the hold and give him a reset he no longer makes
    face:
    - f: 0
      ref: stunned_stillness
      note: brows lifted, eyes down on the phone, mouth flat; the blink is the only change; no graphic
        symbols
    look:
    - f: 0
      target: phone
      note: the phone, unchanged
    lids:
    - f: 0
      ref: open
      ease: hold
      note: lids at the stunned face's own openness
    - f: 28
      ref: closed
      ease: ease_in
      dur_f: 4
      note: 'one slow blink: lids close ease-in f28-31, closed f32-33. Head and eyeline do not move; the
        gaze stays on the phone through the blink'
      rationale: the slow blink is the hinge from funny to sad; a lids key keeps the gaze, so the eyes
        reopen on the same point instead of re-aiming
    - f: 34
      ref: open
      ease: ease_out
      dur_f: 6
      note: lids open slowly f34-39 to the same stunned eyes on the phone (close 4, shut 2, open 6 = the
        12-frame blink)
    breath:
    - f: 0
      ref: hold
      dur_f: 48
      note: true hold, no breath and no drift, for the whole shot (the prose names f0-27; a breathing
        idle is rejected)
props:
  phone_ren:
  - f: 0
    attach: hand_l
    note: 2 %, screen steady (no flicker until 1 %); the glow on his face is constant. Right hand rests
