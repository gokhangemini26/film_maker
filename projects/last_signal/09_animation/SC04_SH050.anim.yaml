vocab_version: 2
rationale: 'Tenderness through effort: plug, unfold, turn, each finished before the next, then one turn
  per second with his breath locked to the handle (characters.ren.movement). The last flicker dip ends
  at f27 and the light holds from the first turn at f30, the frame the push starts, so light, lens and
  effort change together (camera.movement.push_in). The crank is clamped high between the knee tops so
  the pip, proof of effort (look.lighting.power_indicators), is never behind the near knee; the phone
  sits beside it and the left thumb glides the next words while the right hand keeps turning.'
characters:
  ren:
    pose:
    - f: 0
      ref: kerb_crank_hold
      ease: hold
      note: crank in both hands held up between the knees at knee-top height, phone in the left palm under
        it; right hand takes the cable plug. f8 lines the plug up (port toward the near knee); f10-11
        small wrist push
    - f: 12
      ref: kerb_crank_hold
      ease: ease_in_out
      blend_f: 3
      note: 'clamped-high cranking base: crank lying across between the tops of his knees (top face ~z
        0.66, tipped ~30 deg to the lens, pip above the near knee), phone in the left hand ~z 0.76 over
        the near knee beside the port end. The v2 kerb_crank_hold drives the left hand from crank_charger
        loc (hands_both f0-11 under the crank, lap from f12 holding the phone). f12-14 clamp into the
        knees, right thumb lifts the folded knob; f15-16 hinge stiffness hold; f17-21 arm swings out (ease-out),
        clean stop, no bounce; f22 right hand grips the knob, left hand lifts the phone to ~z 0.76 over
        the near knee (f22-29)'
      rationale: clamping frees the left hand for the phone and keeps the pip readable
    - f: 30
      ref: kerb_crank_hold
      ease: hold
      note: cranking from f30 (gait crank_turn); right elbow and shoulder follow the knob's 0.17 m circle,
        torso quiet; the knob may dip behind the far knee at the bottom, the pip never does. From f56
        the left thumb glides 'Dinner' f56-63, 'at' f66-70, '8?' f73-79 with the phone kept in place
      rationale: 'explicit hold of the base pose: the motion is the handle, the breath and the thumb'
    move:
      gait: crank_turn
      start_f: 30
      first_top_f: 56
      note: handle leaves 12 o'clock at f30 with an ease-in over the first half-turn; first revolution
        completes at f56 (26 f), then 24 f per revolution; the handle-top phase carries on through SC04_SH060-SH090
      rationale: single source for the ratchet click (derived handle_top events)
    face:
    - f: 0
      ref: focused_calm
      note: brows level, eyes on the crank, then on the phone from f40; no comic expression
    look:
    - f: 0
      target: crank
      note: the port and the arm f0-39
    - f: 40
      target: phone
      note: eyes move to the phone as its light holds steady
    breath:
    - f: 22
      ref: in_slow
      dur_f: 8
      note: breath in f22-29 as he takes the knob
    - f: 30
      ref: crank_locked
      dur_f: 50
      note: in on the up half-turn, out on the down half-turn, shoulders 1 cm
props:
  crank_charger:
  - f: 0
    loc: hands_both
    arm: folded
    pip: 0.0
    note: both hands, high between the knees
  - f: 12
    loc: lap
    dur_f: 3
    note: clamped high between the knee tops f12-14 (knees up); does not sink in the clamp
    rationale: 'loc lap, not knees: locked continuity.props.glovebox_and_crank has the crank in_lap at
      SC04 end and through SC06, and the revised prose calls the clamp ''still in his lap (knees up)'''
  - f: 17
    arm: unfolded
    ease: ease_out
    dur_f: 5
    note: arm swings out on its pivot f17-21, clean stop, no bounce
  - f: 30
    pip: 1.0
    ease: ease_in
    dur_f: 9
    note: 'pip follows the handle speed: 0 -> full over f30-38, steady from f38'
  phone_ren:
  - f: 0
    attach: hand_l
    note: left palm under the crank; lifted to ~z 0.76 over the near knee f22-29, still hand_l
  glovebox_lid:
  - f: 0
    state: open_down
    note: the emptied glovebox sits dark far left of frame; it must not glow
  charging_cable:
  - f: 0
    loc: hand_r
    state: posed
    note: right hand holds the cable plug; f8 lines it up with the port (port toward the near knee)
    rationale: the cut hides the pick-up of the loose end (it lay posed on the pavement by his left foot
      through SC04_SH010-SH040, the SC04_SH010 key)
  - f: 10
    loc: crank_port
    note: f10-11 small wrist push, plug into the crank port (event plug_in); short posed loop over the
      left knee, 2 mm sway per turn from the builder, no simulation. Stays crank_port through SC06
