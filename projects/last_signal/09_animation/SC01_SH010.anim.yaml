shot_id: SC01_SH010
frames: 40
vocab_version: 1
rationale: 'Quick bursts between short holds (characters.ren.movement before_turn): reach, tilt, a 4-frame
  check, press, spring, a 4-frame look, tilt back, settle. The two short holds are explicit so the builder
  cannot smooth them away; they are what makes the tuft beat his earnest nerves rather than a gag. The
  eyes drop to the phone at f34 and hold to the cut to hand the audience to the map insert.'
characters:
  ren:
    pose:
    - f: 0
      ref: car_upright
      ease: hold
      note: 'seated upright, phone low in the left hand on his thigh; the right hand is already leaving
        the wheel (prose: "already rising" at f0 - the rise is the f1 blend)'
      rationale: start from the neutral driver pose so the first burst reads from frame 1 as the FADE
        IN clears
    - f: 1
      ref: car_reach_up
      ease: ease_out
      blend_f: 5
      note: right hand up to the mirror, contact at f6 (quick burst)
    - f: 10
      ref: car_reach_up
      ease: hold
      note: 'held check (4 f): chin tucked a touch, brows lift slightly, mouth line pressed'
    - f: 14
      ref: car_reach_up
      ease: ease_in_out
      blend_f: 3
      note: right hand from the mirror up to the crown, flat palm presses the tuft (VOCAB GAP - car_reach_up
        covers mirror and tuft with one preset; the hand target is not expressible)
    - f: 19
      ref: car_reach_up
      ease: ease_out
      blend_f: 2
      note: palm lifts off the crown; the tuft springs back (tuft has no track, see notes)
    - f: 22
      ref: car_reach_up
      ease: hold
      note: 'held beat (4 f): eyes on the tuft in the mirror, mouth line flattens; he lets it be, no take'
      rationale: the non-reaction is the character (no second attempt, camera.gags.no_repeat)
    - f: 26
      ref: car_reach_up
      ease: ease_out
      blend_f: 3
      note: right hand back to the mirror, tilts it back toward the road (quick burst)
    - f: 31
      ref: car_upright
      ease: ease_out
      blend_f: 3
      note: right hand returns to the top of the wheel
    - f: 34
      ref: car_upright
      ease: hold
      note: held to the cut; only the eyes move (to the phone)
    move:
      gait: none
    face:
    - f: 0
      ref: neutral
      note: 'comic set before any setback: brows level, lifting slightly at the mirror, mouth line pressed;
        no smile of his own, no graphic symbols. VOCAB GAP: no "nervous/pressed" face ref; neutral is
        the closest'
    look:
    - f: 0
      target: mirror
      note: up, frame top-left, f0-33
    - f: 34
      target: phone
      note: eyes drop to the phone in his lap (lead into the map insert)
    breath:
    - f: 31
      ref: out_slow
      dur_f: 3
      note: shoulders settle 1 cm as the hand returns to the wheel
