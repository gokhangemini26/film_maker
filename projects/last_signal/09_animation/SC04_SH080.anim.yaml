rationale: 'A small earned triumph held quietly: the thumb rests, presses once and leaves, so nothing
  covers the tick (camera.inserts.legibility). The line fills evenly (a stall would be a gag after the
  turn, tone.the_turn), the tick appears whole after one empty beat and is held without a pop, and the
  ratchet still turning underneath says whose effort paid for it.'
