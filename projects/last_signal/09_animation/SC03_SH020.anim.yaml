rationale: 'Hope again, a notch warier: he only watches the bolt, no relief (camera.gags.no_repeat, G3
  finding 7). The phone is locked still from f10 so the small bolt reads over his shoulder at f14 and
  holds 22 frames; the bolt itself comes from the canon screen table (SC03_SH020 bolt f14), the anim file
  names the sync points and enforces the hold.'
characters:
  ren:
    pose:
    - f: 0
      ref: kneel_upright
      ease: hold
      note: 'kneeling, phone in the left hand near his chest (large in the foreground). The right-arm
        action has no preset in vocabulary v1: f0 right hand with the cable plug moves toward the back
        of the stand; f6 arm behind the stand to the elbow, shoulder dips, head tilts to look past it;
        f8-11 short fumble (two small forearm adjustments, hand hidden); f12-13 plug goes in, shoulder
        pushes forward 1 cm; f16-26 arm withdraws slowly (ease-in-out). Held on kneel_upright with the
        beats named as events in v1. V2 PENDING (animation.vocab.v2.pose.ren): f0 kneel_upright hold;
        f1 kneel_reach_stand ease_out blend_f 5; f16 kneel_upright ease_in_out blend_f 10; f26 kneel_upright
        hold (the left hand and phone are identical in both presets, so the f10-35 phone hold stands)'
      rationale: the body stays kneeling and the phone arm still; the busy part is the hidden right hand
    face:
    - f: 0
      ref: neutral
      note: 'wary: brows level, mouth pressed; no relief expression in this shot. neutral (level brows,
        closed mouth) is the v1 stand-in and keeps relief out; V2 PENDING (animation.vocab.v2.face.ren):
        ref wary'
    look:
    - f: 0
      target: socket
      note: past the stand toward the socket f0-14
    - f: 15
      target: phone
      note: eyes cut to the phone, one frame after the bolt; stay there
      rationale: the eye cut is the only reaction he allows himself
    breath:
    - f: 26
      ref: hold
      dur_f: 10
      note: 'held, wary f26-35: brows level, mouth pressed, nothing gives (the exhale is saved for SH040)'
