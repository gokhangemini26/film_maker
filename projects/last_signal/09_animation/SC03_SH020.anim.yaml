notes:
- Prose brief stays in the shot file's animation block (G5-approved, untouched). This file is the typed
  version of it.
- 'Screen (from canon, not overlaid here): compose_1_line, 3 % red, bolt off f0-13 and on from f14. No
  ui_timeline events are needed; the bolt has no ui event type and the table already carries it.'
- 'Bolt size (ruled 2026-10-02): no change request to camera.inserts.legibility; the shot measures the
  bolt at about 1.5 % of frame height (4.8 mm glyph, 225 mm frame), read as the one amber point beside
  3 % over 22 frames. The old 4.4 mm / 3 % dependency is closed by that ruling.'
- 'DEPENDENCY (human ruling needed): the face ref wary is a v2 addition to Ren''s comic set (animation.vocab.v2.face.ren).
  characters.ren.expressions is LOCKED and does not list it; the key stands only if the human rules that
  animation faces may refine a listed expression, or approves a character-designer change request. Fallback
  if refused: neutral (the v1 stand-in).'
- 'Reviewed against the SC03 blocking fix (kneel at (3.45, 8.66) facing +y, stand about 0.3 m to his right,
  socket about 0.8 m right and 0.3 m ahead of his pelvis): the reach behind the stand, the f12 plug-in
  and all tracks are position-free and stand unchanged; no coordinates in this file.'
- Reviewed 2026-10-02 against the G5 finding 3 re-placement (lens (3.62, 8.90, 1.28) over his right shoulder,
  close, look_at phone_ren aimed once at f0). Body, face, look, breath, cable and every event id and frame
  (arm_behind_stand f6, plug_fumble f8, plug_in f12, bolt_on f14, eyes_to_phone f15, arm_withdraw f16)
  are unchanged, so the audio cues on plug_fumble and plug_in stay valid; phone_still f10 is a new visual
  event only (no audio consumer).
- 'BUILDER FIX: DONE (2026-10-02, blender-td; reported by the orchestrator: phone hold, screen aimed at
  the lens, f6-9 turn-in; the builder reads motion.holds for the phone and tests/test_phone_hold.py exists).
  The original request is kept below for the record. (blender-td, required before the next SC03_SH020
  preview; the shot''s draft FACT shows the kneel rig turning the screen toward his face, flat under his
  chin from about f24). Vocabulary v2 has no phone-orientation field, so the ruling is carried by the
  phone hold, holds[0] f10-35, and the builder must honour it: (1) blender/fm_blender/animate.py frame_state():
  pass the active hold spans of scope phone or all (motion.holds) into the frame state; while one is active
  for ren, take the phone''s position and axes from the hold''s first frame (f10) instead of the current
  frame. (2) animate.py _phones() (line ~1234, toward = cam0 - pos only when is_insert): inside a phone
  or all hold of a non-insert shot whose camera.look_at is phone_ren, aim the screen normal at the lens
  (cam0 - pos at f10) with the up vector from world up, so the status bar stays at the top; slerp from
  the rig aim (head - pos) over the 4 frames before the hold (f6-f9, while the arm crosses frame and the
  hand is busy) so nothing pops at f10. Only SC03_SH020 matches this condition in the film (every other
  phone hold is an insert or not aimed at the phone), so no other shot changes. (3) _cable_ends() (line
  ~822) and _cable() (line ~1280): the cable''s phone end must use the same frozen position and axes.
  (4) the left hand: kneel_reach_stand and kneel_upright may differ by up to 0.03 m at the phone hand
  (checks.left_hand_and_phone_vs_kneel_upright_m_max), so inside the hold move hand_l by the offset between
  the rig phone point and the frozen phone so the palm stays on the phone. (5) preview.py line ~395 (static
  assembly, same head-aim rule): apply the same lens aim for preview frames inside the hold. (6) a test
  (tests/, beside test_poses.py): for SC03_SH020 f10-35 the phone position varies under 1 mm, its normal
  is within 10 deg of cam0 - pos and its up vector within 15 deg of world up projected on the screen plane.
  fm check anim and fm qa motion do not check phone orientation, so only this test and the preview frames
  can confirm it.'
- 'RISK carried for the cinematographer (not an animation change): with the phone held toward the lens,
  his head still returns over it f16-26 (the withdraw), and the shot''s FACT puts his hair at frame right
  from about f24; whether the hair now covers the status bar must be checked on the f26 and f35 preview
  frames. The ruling keeps the withdraw; if the hair covers the bolt, the fix is a camera or pose question
  for the human, not a new vocabulary name.'
- 'KNOWN LIMIT, accepted (closes the RISK above). FACT (post-fix frames, reported by the orchestrator):
  the phone is still and square to the lens from f10, but his head and hair cover it from about f20, so
  the screen reads about f10-20 (the relayed figure "bolt reads f10-20"; the bolt itself is only on from
  bolt_on f14, so it reads about f14-20, some 7 frames) instead of f14-35. DECISION (the user''s delegated
  ruling, 2026-10-02): accept. Rejected: (a) repositioning the camera for a cleaner over-the-shoulder
  (cinematographer''s; earlier lens trials already lost the bolt in his hair or crown); (b) a change request
  for an exemption from camera.inserts.legibility. No key, hold or event changes: the f10-35 phone hold,
  the f16-26 withdraw and every event id and frame stand, so the audio cues stay valid. The 3 % / bolt
  state carries forward unread into SH030-SH050 per canon; nothing downstream depends on reading it here.'
