  summary: 'Structured tracks for the plug-in: reach behind the stand, a short fumble, plug in at f12,
    bolt at f14, eyes to the phone at f15; phone locked still, upright and tipped toward the lens f10-35
    (delegated ruling 2026-10-02) so the bolt and screen read; no relief.'
