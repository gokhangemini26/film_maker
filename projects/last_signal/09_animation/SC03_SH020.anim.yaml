rationale: 'Hope again, a notch warier: he only watches the bolt, no relief (camera.gags.no_repeat, G3
  finding 7). The phone is locked still from f10 so the small bolt reads over his shoulder at f14 and
  holds 22 frames; the bolt itself comes from the canon screen table (SC03_SH020 bolt f14), the anim file
  names the sync points and enforces the hold.'
characters:
  ren:
    pose:
    - f: 0
      ref: kneel_upright
      ease: hold
      note: kneeling, phone in the left hand near his chest (large in the foreground); f0 right hand with
        the cable plug starts toward the back of the stand
    - f: 1
      ref: kneel_reach_stand
      ease: ease_out
      blend_f: 5
      note: arm behind the stand to the elbow by f6, shoulder dips, head tilts to look past the stand
        edge; f8-11 short fumble (two small forearm adjustments, hand hidden; events, no pose change);
        f12-13 plug goes in, shoulder pushes forward 1 cm
      rationale: the fumble behind the stand is the action that turns hope into a plug-in; the left hand
        and phone are identical to kneel_upright, so the f10-35 phone hold stands
    - f: 16
      ref: kneel_upright
      ease: ease_in_out
      blend_f: 10
      note: arm withdraws slowly from behind the stand, f16-26
    - f: 26
      ref: kneel_upright
      ease: hold
      note: still to the cut; he only watches the bolt
      rationale: the body stays kneeling and the phone arm still; the busy part was the hidden right hand
    face:
    - f: 0
      ref: wary
      note: 'wary: brows level and slightly lowered, mouth pressed; no relief expression in this shot.
        DEPENDENCY: wary is a v2 comic-set face (animation.vocab.v2.face.ren); characters.ren.expressions
        is LOCKED and does not list it, so this key stands only after a human ruling or a character change
        request'
      rationale: wary keeps the half of the gag where he expects the catch (G3 finding 7)
    look:
    - f: 0
      target: socket
      note: past the stand toward the socket f0-14
    - f: 15
      target: phone
      note: eyes cut to the phone, one frame after the bolt; stay there
      rationale: the eye cut is the only reaction he allows himself
    breath:
    - f: 26
      ref: hold
      dur_f: 10
      note: 'held, wary f26-35: brows level, mouth pressed, nothing gives (the exhale is saved for SH040)'
