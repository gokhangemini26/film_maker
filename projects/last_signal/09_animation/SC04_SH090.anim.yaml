  summary: 'Release: he lets go at f4, the handle coasts and clicks to a stop at f7, the pip dies by f12,
    then the long out-breath and the eyes close; crank stays clamped high.'
  stamped_content_hash: sha256:9b28b5c65e5f379fb745f3fb64078979043796bc1576e2f8b87e45099d94a36b
shot_id: SC04_SH090
frames: 28
vocab_version: 2
rationale: He lets go instead of stopping the handle, so it coasts and clicks on its own and the pip dies
  within 6 frames of the stop, the last amber light of the film (look.lighting.power_indicators). Only
  then the longest out-breath so far, shoulders and spine dropping without springing back. The knees hold
  the crank high and the phone stays beside it, so what he let go of and what it paid for are both in
  frame with his face.
characters:
  ren:
    pose:
    - f: 0
      ref: kerb_crank_hold
      ease: hold
      note: 'SH050 end pose exactly: crank clamped high between the knee tops (pip above the near knee),
        phone in the left hand ~z 0.76 over the near knee beside the port end; right hand slows the handle
        f0-3 (ease-out), fingers open at f4, hand comes to rest open on the crank f8-16. Release f8-22:
        shoulders drop 3 cm, spine loosens a little; knees do not move, so the crank stays clamped; the
        phone sinks ~2 cm with the shoulders. No clamped-release preset exists (gap): the release rides
        on breath out_long'
      rationale: the drop is in shoulders and spine only; the crank must stay readable
    move:
      gait: crank_turn
      first_top_f: -8
      stop_f: 7
      note: 'already turning: last top was SC04_SH080 f50, so f0 is 8 f (120 deg) past the top; slows
        f0-4, let go at f4, coasts ~30 deg and stops at f7. No handle top falls inside the shot'
      rationale: the stop click is hand-written as event ratchet_stop (the only hand-written ratchet event)
    face:
    - f: 0
      ref: focused_calm
      note: eyes on the phone
    - f: 8
      ref: release_after_send
      note: breath out, eyes close f10-13; no smile, no grin
      rationale: effort first, then rest
    look:
    - f: 0
      target: phone
    - f: 10
      target: closed
      note: eyes close f10-13 and stay closed to the cut
    breath:
    - f: 8
      ref: out_long
      dur_f: 15
      note: one long out-breath f8-22; no more crank-locked breathing
