- 'Secondary motion with no track: jacket hem swings, flares on the drop and settles by f51. The cable
  loop swing is posed per stride on the charging_cable track (vocabulary v2), not simulated.'
- 'Camera locked off: the same frame is reused for the blackout (SC03_SH050).'
