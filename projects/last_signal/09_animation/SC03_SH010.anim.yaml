shot_id: SC03_SH010
frames: 52
vocab_version: 2
rationale: 'Comic urgency in an orderly room: the scan is carried by eyeline snaps while the run continues
  (no stop for a scan pose), then he commits to the aisle and drops to his knees in one move (characters.ren.movement
  before_turn.kneel: one_quick_drop). The gravity ease on the kneel gives the drop weight and its small
  forward settle. The final kneel is the pose SH050 freezes, so the two master frames differ only in the
  light.'
characters:
  ren:
    pose:
    - f: 0
      ref: run_phone_out
      ease: hold
      note: head and shoulders enter at the frame bottom, running (step on f0), phone and cable loop in
        the left hand. f3-9 a slight lean into the curve round the near gondola's front end (west, screen
        right); f10-11 a 2-frame forward-lean anticipation as he spots the socket from the aisle mouth
        (no preset; carried by the gait's acceleration); f12 accelerates down the west aisle; f36-43 braking
        steps, shorter strides
    - f: 44
      ref: kneel_upright
      ease: gravity
      blend_f: 4
      note: drops to both knees in one quick move f44-48, phone arm tucks to the chest; the gravity bounce
        is the small forward settle f49-51. Knees down at (3.45, 8.66) facing the back wall, the stand
        on his right
      rationale: one quick drop, weighted, not a knee slide (a stunt and a humiliation risk)
    - f: 51
      ref: kneel_upright
      ease: hold
      note: final hold, matched by SH020-SH050
    move:
      gait: run_phone_out
      speed_mps: 5.0
      path:
      - f: 0
        x: 2.3
        y: 1.4
      - f: 5
        x: 2.95
        y: 1.6
      - f: 10
        x: 3.35
        y: 2.05
      - f: 14
        x: 3.45
        y: 2.8
      - f: 36
        x: 3.45
        y: 7.38
      - f: 44
        x: 3.45
        y: 8.38
      - f: 48
        x: 3.45
        y: 8.66
      note: 'shop-local coords (x west, y depth south). Enters through the door under the lens (x 2.65)
        at (2.3, 1.4), 0.3 m clear of the counter (x <= 2.0); curves west round the front end of the near
        gondola (end cap x 2.34-2.86, y about 1.96; path keeps >= 0.3 m from its corner) while scanning,
        is at the mouth of the west aisle at f10 when he spots the socket, straightens onto the aisle
        centre (x 3.45) by f14, runs straight down it and kneels at (3.45, 8.66) facing +y, between the
        westmost fridge (x <= 3.2) and the stand (x >= 3.75). 7.9 m (was 6.8 m to the old spot (2.2, 8.0)):
        3.3 m/s f0-5, 2.9 m/s rounding the end cap f5-10, 4.5 m/s accelerating f10-14, 5.0 m/s down the
        aisle f14-36 (peak; stride about 1.25 m at a step every 6 frames), 3.0 m/s braking f36-44 (5 down
        to about 1), 0.28 m forward in the drop f44-48. Mean about 4.1 m/s over f0-44. A hard run, at
        the top of the run range and under the run_phone_out QA ceiling (5.5 m/s); no cut-length change
        needed'
    face:
    - f: 0
      ref: neutral
      note: not readable (from above and behind)
    look:
    - f: 0
      target: road_ahead
      note: ahead into the shop as he enters
    - f: 2
      target: wall_left
      note: head snaps left to scan the wall; body keeps running
    - f: 6
      target: wall_right
      note: head snaps right
    - f: 10
      target: socket
      note: at the west aisle mouth, head locks down the aisle on the socket corner (spots it) and stays
        there through the kneel
      rationale: the snaps keep his burst-and-hold rhythm readable at 25 % of frame height without stopping
    breath:
    - f: 48
      ref: out_slow
      dur_f: 4
      note: settles with the landing (f48-51)
