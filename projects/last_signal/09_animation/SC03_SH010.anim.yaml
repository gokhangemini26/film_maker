shot_id: SC03_SH010
frames: 52
vocab_version: 2
rationale: 'Comic urgency in an orderly room: the scan is carried by eyeline snaps while the run continues
  (no stop for a scan pose), then he commits to the aisle and drops to his knees in one move (characters.ren.movement
  before_turn.kneel: one_quick_drop). The gravity ease on the kneel gives the drop weight and its small
  forward settle. The final kneel is the pose SH050 freezes, so the two master frames differ only in the
  light.'
characters:
  ren:
    pose:
    - f: 0
      ref: run_phone_out
      ease: hold
      note: head and shoulders enter at the frame bottom, running (step on f0), phone and cable loop in
        the left hand. f10-11 a 2-frame forward-lean anticipation as he spots the socket (no preset; carried
        by the gait's acceleration); f12 accelerates down the west aisle; f36-43 braking steps, shorter
        strides
    - f: 44
      ref: kneel_upright
      ease: gravity
      blend_f: 4
      note: drops to both knees in one quick move f44-48, phone arm tucks to the chest; the gravity bounce
        is the small forward settle f49-51. Knees down beside the stand, facing the back wall
      rationale: one quick drop, weighted, not a knee slide (a stunt and a humiliation risk)
    - f: 51
      ref: kneel_upright
      ease: hold
      note: final hold, matched by SH020-SH050
    move:
      gait: run_phone_out
      speed_mps: 4.2
      path:
      - f: 0
        x: 1.3
        y: 1.4
      - f: 10
        x: 1.6
        y: 2.75
      - f: 16
        x: 2.1
        y: 3.6
      - f: 36
        x: 2.2
        y: 7.1
      - f: 44
        x: 2.2
        y: 7.75
      - f: 48
        x: 2.2
        y: 8.0
      note: 'shop-local coords (x west, y depth south): enters under the camera at (1.3, 1.4), into the
        west aisle, kneels at (2.2, 8.0). 6.8 m: about 3.3 m/s while scanning (f0-10), 3.9 into the aisle,
        4.2 down it (f16-36), about 2 m/s braking (f36-44), 0.25 m in the drop (f44-48). The prose''s
        4.0 m/s entry for f0-2 is folded into the first leg. Distance/time risk from the shot carried
        over: this is a quick run (mean about 3.7 m/s), not a walk'
    face:
    - f: 0
      ref: neutral
      note: not readable (from above and behind)
    look:
    - f: 0
      target: road_ahead
      note: ahead into the shop as he enters
    - f: 2
      target: wall_left
      note: head snaps left to scan the wall; body keeps running
    - f: 6
      target: wall_right
      note: head snaps right
    - f: 10
      target: socket
      note: head locks down the aisle on the socket corner (spots it) and stays there through the kneel
      rationale: the snaps keep his burst-and-hold rhythm readable at 25 % of frame height without stopping
    breath:
    - f: 48
      ref: out_slow
      dur_f: 4
      note: settles with the landing (f48-51)
props:
  phone_ren:
  - f: 0
    attach: hand_l
    note: left hand throughout; kneel_upright tucks that hand to the chest. The cable itself is the charging_cable
      track
  charging_cable:
  - f: 0
    loc: hand_l_loop
    state: posed
    note: cable end looped in the left hand with the phone (chained from SC02_SH030); the loop swings
      on posed shapes per stride and falls slack on the kneel, no simulation
  - f: 44
    loc: hand_r
    note: he takes the plug into the right hand as he drops to the kneel (f44-48); plug end in the right
      hand at the cut into SC03_SH020 f0
    rationale: animation.vocab.v2.prop.charging_cable chain_by_shot SC03_SH010; the drop hides the hand-over
