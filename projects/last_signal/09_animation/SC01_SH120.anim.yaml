  phone_ren:
  - f: 0
    attach: hand_l
  charging_cable:
  - f: 0
    loc: hand_r
    state: hidden
    note: 'plug end in the right hand off frame at the console adapter (chained from SC01_SH110 f18).
      Hidden for f0-1: car_phone_up puts the rig''s right hand beside the phone, so a posed cable would
      run its source end into the insert frame; the story hand is off frame at the adapter'
