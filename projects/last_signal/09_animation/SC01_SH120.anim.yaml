rationale: 'The bolt switches on in one frame (look.lighting.power_indicators: lit the moment the cable
  goes live; canon table bolt f0 false / f2 true); any ease would soften the relief into a maybe. Nothing
  else moves, so the relief is exact and short. The chime is a named event on the same frame.'
characters:
  ren:
    pose:
    - f: 0
      ref: car_phone_up
      ease: hold
      note: 'insert cheat: the body is hidden in inserts, so the pose only carries the phone. car_upright
        put the phone on the wheel rim (about 1.15 m from the lens), so the status bar rendered small.
        car_phone_up holds it at face height (rig: screen centre about (1.28, 0.62, 1.00)), the same pose
        and place as SH080 / SH090 / SH140, so the status-bar inserts are one frame. He plugs in off frame
        with the right hand (the cable track carries that); SH110 ends and SH130 opens car_upright, both
        changes hidden by the cuts'
    move:
      gait: none
    look:
    - f: 0
      target: phone
      note: off frame (head hidden); he plugs in by feel and watches the screen for the bolt (the insert
        sits on his eyeline)
