shot_id: SC01_SH110
frames: 32
vocab_version: 2
rationale: 'One hand, one turn, one shove: a quick comic dismissal built to be answered by the slow two-handed
  lift at the kerb (SC04_SH040, story.crank_plant). The brick lags the wrist by a frame on the lift so
  it has weight, which makes the later careful hold of the same object read. The crank goes back to the
  glovebox folded and pip off, and the lid is closed on the shove, so SC01 ends closed_open_closed per
  continuity.'
characters:
  ren:
    pose:
    - f: 0
      ref: car_sag
      ease: hold
      note: 'insert cheat: car_sag (hands resting in the lap) replaces car_upright, whose right hand on
        the wheel rim carried the crank (loc hand_r f3) out of the lap insert (NDC y about 2.4). With
        car_sag the crank stays in frame f0-13 and exits frame left by f18, as the brief intends. The
        letdown reading of car_sag is not visible: only hands and lap show. Body off frame except the
        right hand. Right hand enters from frame right f1 (quick burst), grips f3, lifts 5 cm f4, wrist
        roll 180 deg f6-10, 2-frame hold f11-12 (VOCAB GAP - hand-only actions have no preset)'
    - f: 13
      ref: car_lean_glovebox
      ease: ease_in
      blend_f: 4
      note: one-handed shove out frame left toward the glovebox (accelerates out); brick gone by f17
      rationale: ease_in = the shove speeds up as it leaves, a dismissal
    - f: 18
      ref: car_sag
      ease: ease_out
      blend_f: 3
      note: hand comes back in from frame left holding the cable end
    - f: 21
      ref: car_sag
      ease: ease_in_out
      blend_f: 8
      note: pulls the cable across the frame toward the console adapter; hand leaves frame by f29 (VOCAB
        GAP - no console/adapter reach preset)
    - f: 29
      ref: car_sag
      ease: hold
      note: empty lap with the cable lying across it; still to the cut
    move:
      gait: none
    look:
    - f: 0
      target: crank
      note: off frame; implied on the brick
    - f: 13
      target: glovebox
      note: follows the shove
    - f: 21
      target: dash
      note: 'toward the console adapter (VOCAB GAP: no console/adapter target; dash is the closest)'
props:
  crank_charger:
  - f: 0
    loc: lap
    arm: folded
    pip: 0.0
    note: lying folded on his thighs, pip off (chains from SH100's end)
  - f: 3
    loc: hand_r
    note: grips the brick; lifts 5 cm at f4 with a 1-frame lag behind the wrist (weight); wrist roll 180
      deg f6-10, back upright f11 (VOCAB GAP - no prop rotation/roll field)
  - f: 13
    loc: glovebox
    ease: ease_in
    dur_f: 5
    note: shoved out frame left into the glovebox f13-17; arm stays folded, pip off throughout
  glovebox_lid:
  - f: 0
    state: open_down
    note: chains from SH100 (rests open)
  - f: 17
    state: closed
    ease: ease_out
    dur_f: 2
    note: 'off frame left. ASSUMPTION: the shove''s follow-through flicks the lid shut f17-18 with the
      cable end already in his fingers, pulled "back through" the lid gap. The prose never says where
      the lid closes; continuity needs SC01 to end closed (closed_open_closed; SC04_SH010 finds it closed)'
  phone_ren:
  - f: 0
    attach: hand_l
    note: in the left hand, out of frame
  charging_cable:
  - f: 0
    loc: glovebox
    state: posed
    note: source end in the glovebox (off frame left); the cable shows with the open lid
    rationale: first key of the cable in the film; before it the cable is in the glovebox, hidden (animation.vocab.v2.prop.charging_cable
      before_first_key), so the chain starts here
  - f: 18
    loc: hand_r
    note: 'the hand comes back in holding the cable end (event cable_in_hand), pulled through the lid
      gap; stays hand_r to the cut, posed curve dragged along the hand path, short visible length (M3
      risk: no cable simulation). Plugged into car_usb_adapter at SC01_SH120 f2'
