frames: 48
vocab_version: 2
rationale: 'Brisk comic busyness in bursts: key, cough, catch, lean, drop. He lets the lid fall by itself
  (hurry; the lowered lid is saved for SC04). Revised crank beat from the previous animation pass: from
  the 0.75 m reach his forearm is under the glovebox mouth, so the crank tips onto it at f25 and rides
  it ~0.7 m sideways as he snaps upright f26-30 (upright under the 1.40 m headliner needs a >= 10 deg
  recline or forward lean), then rolls onto his lap on the clunk at f31 and he freezes. A surprise, not
  a blow (tone.comedy_source). The 12-frame held look at the brick is the plant (story.crank_plant). The
  idle tremble starts at the catch so the stall in SH130 has something to stop.'
characters:
  ren:
    pose:
    - f: 0
      ref: car_upright
      ease: hold
      note: right hand already on the ignition key (quick burst in from the cut), phone in the left hand
        on his thigh. Turns the key f3-4 (wrist about 60 deg; VOCAB GAP - no ignition-hand preset). Seated
        with >= 10 deg recline for headliner clearance (blender-td)
    - f: 15
      ref: car_lean_glovebox
      ease: ease_out
      blend_f: 7
      note: leans across to the glovebox (frame left), torso tips, right arm reaches about 0.75 m (quick
        burst); fingers on the latch at f22
      rationale: ease_out = a fast start that settles on the latch, his hurry
    - f: 22
      ref: car_lean_glovebox
      ease: hold
      note: fingers on the latch; latch released f23, lid drops by itself; forearm stays under the glovebox
        mouth
    - f: 26
      ref: car_upright
      ease: ease_out
      blend_f: 4
      note: snaps upright f26-30 with the crank riding his right forearm about 0.7 m sideways; ends with
        >= 10 deg recline or forward lean under the 1.40 m headliner (check head clearance at the fastest
        frame f27-28)
      rationale: the startle is a reflex straighten, one burst; the crank rides along so it arrives in
        his lap, not on the floor
    - f: 31
      ref: car_upright
      ease: hold
      note: crank rolls off the forearm onto his thighs (clunk); he freezes; head turns down to his lap
        f33-36 on the look track only
    move:
      gait: none
    face:
    - f: 0
      ref: neutral
      note: neutral-busy
    - f: 5
      ref: freeze
      note: small freeze while the engine coughs f5-13
    - f: 14
      ref: neutral
      note: the engine catches; busy again
    - f: 31
      ref: freeze
      note: freezes on the clunk
    - f: 36
      ref: neutral
      note: 'held look at the crank: brows lifted slightly, mouth flat (VOCAB GAP - no mild-surprise face;
        neutral with a brow lift is the closest)'
    look:
    - f: 0
      target: dash
      note: dash f0-14
    - f: 15
      target: glovebox
      note: glovebox f15-32
    - f: 33
      target: crank
      note: head turns down to the crank on his lap f33-36, held to the cut
    breath:
    - f: 5
      ref: hold
      dur_f: 9
      note: shoulders up 1 cm and held through the cough f5-13
    - f: 14
      ref: out_slow
      dur_f: 3
      note: 'engine catches: shoulders drop 1 cm, right hand leaves the key'
