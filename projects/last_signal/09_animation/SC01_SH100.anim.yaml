notes:
- Prose brief stays in the shot file's animation block (G5-approved, untouched). This file is the typed
  version of it.
- 'DEVIATION from the G5 prose brief (per the orchestrator, from the previous animation pass): the prose
  has the crank fall ~0.3 m on an arc straight onto his thighs at f31 while he freezes mid-lean; this
  file has it tip onto his forearm at f25 and ride it as he snaps upright f26-30. Needs the human to accept
  at G7 or the shot prose revised by the cinematographer/animation pass.'
- 'Secondary without tracks: jacket hem swings with the lean (skinning only); tuft lags the lean by 1
  frame (no tuft track).'
- 'Cable (vocabulary v2, animation.vocab.v2.prop.charging_cable): hidden in the closed glovebox, posed
  from f23 when the lid drops; a posed curve, no simulation.'
- M3 risk kept from the shot - crank motion is keyed on the arm, not a rigid-body simulation; proxy reach
  0.75 m needs the torso lean.
