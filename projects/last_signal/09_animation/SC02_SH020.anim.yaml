rationale: 'The legs work and the phone arm does not (characters.ren.movement before_turn.run): one run_phone_out
  preset held for the whole shot, with the run_phone_out gait carrying the contacts, bob and stride, so
  nothing can swing the phone arm. At 4.2 m/s the figure visibly shrinks into the sunlit pavement inside
  the elliptical cut.'
characters:
  ren:
    pose:
    - f: 0
      ref: run_phone_out
      ease: hold
      note: right foot contact on f0; left arm straight out ahead holding the phone, right forearm tucked
        to the chest; contacts f0 / f6 / f12 and the airborne passes f3 / f9 (body up 4 cm, down 3 cm
        on contact) come from the gait; toe-off on f13, cut
      rationale: the phone arm stays rigid, no swing (tone.anti_goals rejects a flailing sprint)
    move:
      gait: run_phone_out
      speed_mps: 4.2
      path:
      - f: 0
        x: -0.9
        y: 4.8
      - f: 13
        x: -0.9
        y: 7.08
      note: away from the lens (camera at y 2.5) along the pavement, centred on the shot's position y
        6.0. The prose "about 4.8 m -> 7.2 m from the camera" is read as street y 4.8 -> 7.2 (the range
        centred on y 6.0); read literally as distance from the camera it would be y 7.3 -> 9.7, off the
        blocking position. 4.2 m/s x 13/24 s = 2.28 m
    face:
