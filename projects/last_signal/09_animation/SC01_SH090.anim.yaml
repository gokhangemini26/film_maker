shot_id: SC01_SH090
frames: 24
vocab_version: 2
rationale: 'The freeze is funny only if nothing moves (shot note ''locked off: the freeze is funny only
  if nothing moves''): one pose key, a body-and-face hold for f0-15, then the smallest possible exhale
  so the frozen body reads as held rather than paused. Structured so the builder poses one preset and
  a QA check can assert the hold instead of reading prose.'
characters:
  ren:
    pose:
    - f: 0
      ref: car_phone_up
      ease: hold
      note: 'freeze already hit on the cut: eyes wide, small pupils, right thumb up over the phone (kept
        in the action but deliberately not framed: fists and phone sit behind the ring at the bottom of
        frame), phone in the left hand, whole body held; the deadpan face carries the gag'
      rationale: one preset for the whole shot; the exhale is a breath key, not a pose change
    move:
      gait: none
    face:
    - f: 0
      ref: freeze
      note: 'eyes wide, small pupils; from f16 the mouth line opens slightly for the exhale (mouth_open_max:
        slight) - the face ref does not change'
      rationale: comic set is legal here (before SC04_SH030); a held pose, not a rubbery take
    look:
    - f: 0
      target: phone
      note: the phone, below the lens, never to camera
    breath:
    - f: 0
      ref: hold
      dur_f: 16
      note: 'true hold f0-15 (16 frames): no breath, no drift'
    - f: 16
      ref: out_slow
      dur_f: 6
      note: 'small stuck exhale: shoulders drop 1 cm (ease-in, f16-21); thumb stays up (unframed)'
      rationale: the only motion in the shot; stuck, so slow and small
props:
  phone_ren:
  - f: 0
    attach: hand_l
    note: phone in the left hand; screen state comes from ui_timeline (look.style.phone_screen.states_by_shot)
holds:
- f0: 0
  f1: 15
  scope: all
  min_f: 16
  note: 'true hold f0-15 (16 frames): no breath, no drift'
  rationale: the gag is the absence of motion (tone.comedy_source)
events:
- f: 16
  id: stuck_exhale
  kind: visual
  note: 'the breath starts: mouth line opens slightly, shoulders drop'
preview_frames:
- 0
- 16
- 23
notes:
- Prose brief stays in the shot file's animation block (G5-approved, untouched). This file is the typed
  version of it.
- 'Reviewed against the v2 lens move (y 1.00 -> 1.50 with SH010, same frame for the callback) and the
  cinematographer''s blocking rationale: the raised thumb stays in the action but is deliberately not
  framed (rounded preview hands, ring at the bottom of frame); no pose lifts the hand above the ring,
  which would cover the mouth that does the exhale. The f0-15 true hold, the stuck_exhale event at f16
  and frames 24 are unchanged.'
- 'DEPENDENCY: the shot file''s prose animation block still says "thumb up in the air over the phone (lower
  frame)" (key f0); this file supersedes it (the animation-director does not edit a shot that has an anim
  file).'
