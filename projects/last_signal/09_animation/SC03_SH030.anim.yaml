shot_id: SC03_SH030
frames: 26
vocab_version: 1
rationale: 'The wary half of the wary relief: he expects the pattern, freezes looking at the panels, and
  nothing happens. Eyes first, head second, a 14-frame dead hold (asserted as a hold), then a slow return.
  The panels carry an explicit `steady` key so QA can assert the gag is the absence. The out-breath starts
  at f23 so SH040 continues one motion (match on action).'
characters:
  ren:
    pose:
    - f: 0
      ref: kneel_upright
      ease: hold
      note: kneeling, facing the lens, head level; the head tilt is carried by the look track
    face:
    - f: 0
      ref: neutral
      note: 'f0-1 the wary face carried from SH020 (brows level, mouth pressed); neutral is the v1 stand-in;
        V2 PENDING (animation.vocab.v2.face.ren): ref wary'
    - f: 2
      ref: freeze
      note: 'brows lift and slightly knit, eyes wide, small pupils, mouth pressed; no graphic symbols.
        Held through the return: the face does not relax until SH040'
      rationale: comic set legal here (before SC04_SH030); a held pose, not a rubbery take
    look:
    - f: 0
      target: phone
      note: eyes down on the phone
    - f: 1
      target: ceiling
      note: eyes flick up to the panels in a 1-frame cel switch on f1; the head tilts up about 20 deg
        after the eyes (ease-out, f2-5). The look track has no separate eye/head timing in vocabulary
        v1; see gaps
      rationale: eyes first, head second is the delay that sells the suspense
    - f: 19
      target: phone
      note: eyes lower slowly, head levels after them (ease-in-out, f19-24); about 18 frames up in total
    breath:
    - f: 0
      ref: hold
      dur_f: 23
      note: breath held from the cut through the freeze and the return (f0-22)
    - f: 23
      ref: out_long
      dur_f: 3
      note: shoulders begin to drop (f23-25); the long exhale continues into SH040 f0-14 (match on action)
props:
  ceiling_panels:
  - f: 0
    state: steady
    note: 'no change at all: no flicker, no hum change (the gag is the absence)'
    rationale: a deliberate no-op QA can assert; a flicker tease would spoil the delay
  phone_ren:
  - f: 0
    attach: hand_l
    note: left hand, plugged in, bolt on (canon screen table)
holds:
- f0: 5
  f1: 18
  scope: all
  min_f: 14
  note: freeze held, completely still, eyes up (f5-18, 14 frames)
  rationale: the delay only works if nothing moves
events:
- f: 1
  id: eyes_up
  kind: visual
  note: eyes flick up to the panels (1-frame cel switch)
- f: 5
  id: freeze_locked
  kind: visual
  note: head tilt complete; the 14-frame dead hold begins
- f: 19
  id: eyes_down
  kind: visual
  note: eyes begin to lower
- f: 23
  id: shoulders_drop
  kind: visual
  note: the exhale begins; continues into SH040
