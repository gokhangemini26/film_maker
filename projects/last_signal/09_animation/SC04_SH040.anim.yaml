shot_id: SC04_SH040
frames: 60
vocab_version: 1
rationale: 'The same object, now held with care (story.crank_plant): the lid is lowered by hand, the crank
  lifted so its weight shows and cradled in both hands. He never stands, so the jacket stays under the
  roof line (camera.framing.jacket_off_sky). Every move overlaps the next with ease-in-out and no overshoot;
  the last 6 frames are a still hold with the crank for the low angle''s decision beat.'
characters:
  ren:
    pose:
    - f: 0
      ref: kerb_hunch
      ease: hold
      note: hands off the knees (from SH030), weight shifting west, eyes on the glovebox
    - f: 6
      ref: lunge_low
      ease: ease_in_out
      blend_f: 10
      note: pivots onto the right knee, left foot steps west to about y -0.55 (0.45 m in 10 f, ~1.1 m/s)
      rationale: a kneel and a lunge keep the effort low and the jacket below the roof
    - f: 16
      ref: lunge_reach
      ease: ease_out
      blend_f: 8
      note: 'leans in: left forearm on the seat edge with the phone, right arm to the glovebox (reach
        ~0.7 m; M3 risk)'
    - f: 36
      ref: lunge_low
      ease: ease_in_out
      blend_f: 8
      note: backs out of the doorway, crank drawn to the chest; left hand leaves the seat and joins beneath
        the crank at f42 (phone flat in the left palm under it)
    - f: 44
      ref: kerb_crank_hold
      ease: ease_in
      blend_f: 8
      note: reverses the lunge and lowers onto the kerb at the same spot; seat lands f52, 2-frame weight
        settle f52-53
    - f: 54
      ref: kerb_crank_hold
      ease: hold
      note: crank in both hands in his lap, looking down at it; still to the cut
      rationale: 'explicit final hold: the decision beat'
    move:
      gait: none
      note: the lunge step is carried by the lunge_low preset (no kneel-step gait in the vocabulary)
    face:
    - f: 0
      ref: focused_calm
      note: brows level; eyes on the glovebox, then on the crank; no comic expression
    look:
    - f: 0
      target: glovebox
    - f: 37
      target: crank
      note: eyes to the crank in his hands, f37 to the cut
    breath:
    - f: 54
      ref: in_slow
      dur_f: 6
      note: slow breath in f54-59
