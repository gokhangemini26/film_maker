rationale: 'The attempt is slow and the withdrawal quiet: two presses, two stutters, nothing typed, and
  the thumb goes back down without forcing it, the first sign that he no longer resets (characters.ren.movement).
  The dips are timed to the presses so the phone visibly cannot be used at 1 % (continuity.battery). The
  body is a held preset; the thumb beats are carried by the key_press and dip events plus notes, because
  the vocabulary has no thumb/hand presets (listed as a gap).'
