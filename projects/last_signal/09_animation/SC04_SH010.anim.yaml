rationale: 'The film goes quiet in the body first: one preset held for the whole shot, a 2 s breath cycle
  and one tired blink as the only motion, and the irregular flicker as the only moving light (shot rationale).
  No freeze-sag-reset and no big sigh: the comic register is over. The pose is the ''before'' SC06_SH010
  is measured against, so it is one clean, held body configuration.'
