notes:
- Prose brief stays in the shot file's animation block (G5-approved, untouched). This file is the typed
  version of it.
- 'Secondary motion from the prose that has no track in vocabulary v1 (builder shape keys / posed alternates,
  no simulation): jacket fronts flare back from f9; cable loop swings on two posed shapes alternating
  per stride; crown tuft bobs on each contact.'
- 'M3 risk carried over: a 1.72 m proxy crouching out through a 1.45 m door opening; check head and shoulder
  intersections on the scramble_out preset.'
