frames: 18
vocab_version: 1
rationale: 'The reset, bigger (shot rationale.animation): the cut lands mid-scramble so 18 frames hold
  the exit, the pivot and two strides as efficient bursts, never a pratfall. One blend from the ducked
  scramble to the rigid-arm run carries the unfolding; the scramble gait carries the steps. The door gets
  its own weighted overshoot and settles at the 60 degrees SC04 inherits (continuity.props.passenger_door).'
characters:
  ren:
    pose:
    - f: 0
      ref: scramble_out
      ease: hold
      note: 'starts mid-action: head and shoulders ducked in the doorway below the 1.45 m roof; right
        hand on the swinging door; phone and cable loop thrust out ahead in the left hand. f3 right foot
        on the pavement (gait contact)'
      rationale: the cut enters mid-scramble so the burst reads at once (elliptical cut 1 of 3)
    - f: 6
      ref: run_phone_out
      ease: ease_out
      blend_f: 6
      note: f6 left foot lands, body unfolds out of the crouch clear of the door's rear edge; upright
        and pivoting west by f9 (first push-off); first running contact f12 with the phone out ahead,
        right forearm tucked, arms not swinging
      rationale: ease_out so the unfolding is a quick burst that settles into the rigid compass arm (characters.ren.movement
        before_turn.run)
    - f: 12
      ref: run_phone_out
      ease: hold
      note: 'final hold of the preset: running contacts f12 and f15 come from the gait; trailing foot
        leaves frame left at f17'
    move:
      gait: scramble
      speed_mps: 2.7
      path:
      - f: 0
        x: -0.24
        y: -0.1
      - f: 6
        x: -0.9
        y: -0.2
      - f: 9
        x: -0.71
        y: 0.0
      - f: 17
        x: -0.95
        y: 0.6
      note: 'street coords from the prose path: seat (0.4, 0.0) -> pavement (-0.9, -0.2) -> round the
        open door''s rear edge (-0.71, 0.0) -> west along x -0.95, out frame left about y +0.6. f0 sits
        about 0.65 m along the first leg (mid-action start) so 1.6 m of the 2.2 m falls inside the shot.
        Segment speeds come out at about 2.7, 2.2 and 1.9 m/s against the prose "0 -> about 4.0 at exit";
        speed_mps now declares the path''s real peak (2.67 m/s, first leg); the prose "about 4.0 at exit"
        cannot happen on this path in 18 frames and would also exceed the 3.0 m/s scramble ceiling'
      rationale: reproduces the approved path; the declared speed now matches it instead of the prose
        4.0 (a typed value that contradicts its own path is a data error). The burst reads from the mid-action
        start and the 6-frame blend, not from raw speed. If the brief really wants 4 m/s the path geometry
        must change, which is the cinematographer's call
    face:
    - f: 0
      ref: neutral
      note: not readable at this size; head forward, eyes ahead. No determined/urgent face exists in the
        comic set, neutral is the closest legal ref
    look:
    - f: 0
      target: road_ahead
      note: ahead west toward the shop (fixed from f6 in the prose); he never looks back at the door
      rationale: the refusal to look back is the beat; he has already moved on
props:
  passenger_door:
  - f: 0
    state: open_60
    swing_deg: 20
    note: 'already swinging at about 20 deg under his right hand on the cut (mid-action start). The closed
      -> open_60 transition happens across the SC01 -> SC02 elliptical cut (continuity.props.passenger_door
      SC02: flung_open_by_ren_exiting_left_open)'
    rationale: 'The cut hides the door starting to open, on purpose. SC01_SH150 ends with Ren slumped,
      forehead on the wheel, held 12 frames to a hard cut (door closed, continuity.props.passenger_door
      SC01: closed); the elliptical cut drops the unlatch and the first ~20 deg of swing, so SC02 opens
      mid-fling (closed -> open_60 is a legal transition). Showing the unlatch at the end of SH150 would
      break the held defeat beat; showing it at f0 here would spend frames of an 18-frame burst.'
  - f: 1
    swing_deg: 63
    ease: ease_out
    dur_f: 4
    note: swings out to the check-strap overshoot of 63 deg by f4 (passing about 55 deg at f3)
    rationale: the small overshoot gives the door weight without bouncing back into him (slapstick rejected)
  - f: 5
    swing_deg: 60
    ease: ease_in_out
    dur_f: 2
    note: settles back to 60 deg by f6, then still for the rest of the film; left open
  car_body:
  - f: 0
    state: sway_1cm
    dur_f: 5
    note: sways about 1 cm on its springs as he pushes out of the seat (f0-4)
  - f: 8
    state: still
    note: settled by f8
  phone_ren:
  - f: 0
    attach: hand_l
    note: 'phone in the left hand, thrust out ahead; the cable end pulled from the adapter loops in the
      same hand (continuity.props.cable SC02: looped_in_left_hand) - no cable prop in vocabulary v1, posed
      by the builder'
