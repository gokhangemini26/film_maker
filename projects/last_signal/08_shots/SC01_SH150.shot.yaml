creative_intent:
  narrative_purpose: Slowly, his forehead lowers onto the steering wheel.
  emotional_purpose: 'Sympathetic laughter: defeat, played small and slow.'
  visual_purpose: 'Frontal medium from slightly above through the windscreen: the slow fall of his head
    to the wheel, framed by the dark dash and the bright glass.'
  audience_effect: The viewer feels the world has beaten him this round and wants to see what he tries
    next.
