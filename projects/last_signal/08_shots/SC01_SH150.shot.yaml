  ref: look.lighting.sc01
  key:
    source: sun through the windscreen, 6 deg up, from +Y
    temperature_k: 3200
    quality: hard
  fill: warm bounce from the sunlit dash and bonnet
  ambient: cool sky through the side windows (9000 K)
  practicals: []
  notes: Dash dark; sun unchanged.
color:
  dominant: look.color.scene.sc01
  sky: look.color.sky.golden_hour
animation:
  timing:
    fps: 24
    frames: 36
    index: 0-based; f0 is the first frame, t = f / 24
  characters:
    ren:
      locomotion:
        type: none
        note: seated
      keys:
      - f: 0
        t: 0.0
        pose: 'upright, both hands on the top of the wheel (phone in the left hand against the rim), staring
          ahead, eyes open, brows flat: a held freeze (f0-5)'
      - f: 6
        t: 0.25
        pose: 'head starts to lower: neck bends, spine curls, slow ease-in-out over 18 frames'
      - f: 16
        t: 0.67
        pose: eyes close on the way down
      - f: 24
        t: 1.0
        pose: 'forehead meets the top of the wheel rim (not the horn pad): soft contact, no bounce'
      - f: 26
        t: 1.08
        pose: shoulders sag 1.5 cm on one out-breath (f26-30)
      - f: 30
        t: 1.25
        pose: held to the cut; the tuft stays upright
      face: freeze then letdown with eyes closed; no graphic symbols
      secondary:
      - tuft stays upright as the head goes down, a 1-frame lag and no droop
      eyeline: ahead through the windscreen f0-15, then closed
  props:
    car: dead still; dash dark
    phone_ren: in the left hand against the rim; glow invisible in the sun
  camera:
    easing: none
    notes: locked off
  sound_sync: no horn; a soft out-breath on f26
