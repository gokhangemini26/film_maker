  framing: medium
  aspect_ratio: 1.778
  subject_position: centre
  notes: Mild high (lens 0.52 m above his eye, tilt down about 14 deg; camera.height.high SC01_slump_mild).
    Through the windscreen from above the bonnet; the roof edge stays above the frame line (check at G6).
    Held 36 frames; hard cut to SC02.
