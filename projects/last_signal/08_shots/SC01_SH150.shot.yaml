rationale:
  camera: '50 mm frontal, raised to the mild high angle: the first time the film looks down on him, because
    the world has beaten him (camera.height.high). Rejected: the strong high angle here (saved for the
    shop, so the second failure reads bigger).'
  composition: 'Centred and boxed by pillars and wheel: nowhere to go (camera.framing.space_and_size).
    Rejected: a close-up of his forehead on the wheel (a pratfall read, tone.comedy_source).'
  lighting: Hard sun from behind the camera lights the top of his head as it goes down; the dark dash
    below is the only change from SH090.
  movement: 'Static: the slow head fall is timed inside a still frame.'
  color: Unchanged golden palette; no amber left in frame.
  blocking: Hands stay on the wheel, phone in his left hand against the rim; the head arrives and stays
    for the last 12 frames.
  animation: 'Defeat played small and slow: the only slow fall in the comedy, 18 frames of ease-in-out
    onto a soft contact, held for the last 12 frames as the storyboard asks. Forehead on the rim, never
    the horn pad: a honk would turn sympathy into a bigger gag, and a bounce reads as a bump (no injury,
    tone.comedy_source). The tuft stays up, a small stubborn flag for the reset that follows in SC02.
    Rejected: a thud or head-bang (injury gag) and a fast drop (manic).'
style_break: null
