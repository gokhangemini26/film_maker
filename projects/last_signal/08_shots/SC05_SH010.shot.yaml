creative_intent:
  narrative_purpose: On her desk, her phone lights up with his photo, no name.
  emotional_purpose: 'Arrival: the message has reached her.'
  visual_purpose: 'Top-down on the desk: her phone waking face up beside the sketchbook edge, his circular
    photo readable.'
  audience_effect: The viewer recognises him on a different phone, in a different room, the same moment;
    the light has travelled.
