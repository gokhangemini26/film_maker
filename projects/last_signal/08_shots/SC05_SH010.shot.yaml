rationale:
  camera: '85 mm top-down: the only angle at which his photo on a phone lying face up meets the 5 % recognition
    minimum with the locked desk layout (computed: about 1 % from her eye level; camera.geography.sc05).
    Rejected: the two-shot plan without an insert (his photo unreadable).'
  composition: 'Her phone framed like his phone inserts, but on her desk among her things: the same grammar,
    a different life. No text on her screen (tone.wordless; if shown it could only be the invitation).'
  lighting: 'The screen waking is the event: the cut on light from his steady glow (camera.rhythm.transitions
    sc04_to_sc05).'
  movement: Static (no move in inserts).
  color: The same warm white as on his face (look.color.phone_glow) lands in her room's palette.
  blocking: Her phone face up to the right of the sketchbook (continuity.hana.headphones phone_start),
    not charging (world.props.phone_hana).
  animation: 'The cut on light works best if her screen wakes just after the cut: two dark frames, then
    a soft 3-frame wake, so the tick''s amber in SC04 hands over to a new light being born rather than
    to one already on. The only motion is the wake and a tiny settle of his photo; the phone does not
    buzz or move, because the story says she notices the light, not a sound. Rejected: a vibration shuffle
    on the desk (a comic beat after the turn, and motion in an insert).'
