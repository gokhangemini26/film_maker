creative_intent:
  narrative_purpose: His screen fades to black. He does not reach for it; he leans back against the car,
    the dark phone on his chest, and looks up at the dusk sky. Fade out.
  emotional_purpose: 'Calm, open hope: it is out of his hands, and that is fine.'
  visual_purpose: 'The SC04 bookend frame again: the screen visibly fading in his hand, then his body
    changing from the hunched ''?'' to a relaxed diagonal against the car, face up in the afterglow.'
  audience_effect: The viewer compares this frame with the tender section's first and feels the change
    in him; the film ends open.
