rationale:
  camera: 'The 35 mm bookend at 0.95 m, unchanged from SC04_SH010: same frame, changed body (camera.geography.sc04_sc06).
    Rejected: a new wider angle or a crane to the sky (sky-led, look.style.originality_guards; camera.movement.forbidden).'
  composition: 'Medium-wide release after the film''s closest frames (camera.framing.shot_size_arc); the
    space at screen left toward the afterglow is now where he looks, not where he strains. Sky under two
    thirds and behind him. Rejected: ending on a close-up of his face (closes the frame as the story opens).'
  lighting: The phone fades gently (24 frames, ease-out); afterwards only the warm afterglow finds his
    upturned face (look.lighting.sc06). No lamp or window changes. Profile exemption from the 45 deg rule;
    the fade is read on the screen itself.
  movement: 'Static: after the send the camera never moves; the stillness is ''it''s out of his hands
    now'' (story.ending).'
  color: Dusk sky and afterglow only; the phone's warm white leaves the palette, and the warmth that remains
    is the sky's (look.color.scene.sc06).
  blocking: The relaxed diagonal against the car (characters.ren.silhouette), crank in his lap arm out,
    pip off (continuity.props.glovebox_and_crank SC06); dark phone on his chest, screen out (continuity.props.phone_ren
    SC06).
  animation: 'It is out of his hands, and the body says so in order. He watches the screen die and does
    not reach for it, then leans back, lays the dark phone on his chest under a flat hand, and only then
    looks up to the west. Each move starts before the last ends and eases in and out with no overshoot,
    so the three actions read as one long exhale in the same frame that opened SC04 hunched (characters.ren.movement
    after_send, camera.geography.sc04_sc06). The look up stops short of a smile: the answer is hers, not
    his (tone.ending_restraint). The last 26 frames hold with a single breath under the fade out, so the
    ending is calm and open, not frozen. Rejected: a glance back at the phone (worry, tipping hope into
    bittersweet) and a stretch or a sigh (a comic release after the turn).'
