animation:
  timing:
    fps: 24
    frames: 28
    index: 0-based; f0 is the first frame, t = f / 24
  characters:
    ren:
      locomotion:
        type: none
        note: seated on the kerb
      keys:
      - f: 0
        t: 0.0
        pose: 'still cranking at 1 turn/s: handle about 120 deg past the top; eyes on the phone'
      - f: 0
        t: 0.0
        pose: right hand slows the handle (ease-out, f0-4)
      - f: 4
        t: 0.17
        pose: 'fingers open: he lets go of the knob'
      - f: 7
        t: 0.29
        pose: 'handle coasts about 30 deg and clicks to a stop just past the bottom (phase from SC04_SH050:
          top at SC04_SH080 f50, so f0 here is 120 deg past the top)'
      - f: 8
        t: 0.33
        pose: 'release: long breath out, shoulders drop 3 cm, spine loosens a little (ease-out, f8-22);
          right hand comes to rest open on the crank (f8-16)'
      - f: 10
        t: 0.42
        pose: eyes close (f10-13)
      - f: 22
        t: 0.92
        pose: held, eyes closed, to the cut
      face: release_after_send (eyes close, breath out); no smile, no grin
      breath: one long out-breath f8-22; no more crank-locked breathing
      secondary:
      - cable loop settles on his knee as the crank stops (keyed)
      eyeline: the phone f0-9, then closed
  props:
    crank_charger: handle stops at f7 and stays; pip brightness falls with the handle speed f2-7 (to about
      40 %) and fades to off f7-12 (within 6 frames of the stop, look.lighting.power_indicators); crank
      rests in his lap, arm out
    phone_ren: bolt goes off at f7 (source no longer live; not readable here); 2 %, screen steady
  camera:
    easing: none
    notes: locked off at the SH050 end position (no move after the send)
  sound_sync: last ratchet click at f7 (the stop); breath out from f8
render: {}
