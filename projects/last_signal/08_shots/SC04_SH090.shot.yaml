rationale:
  camera: '50 mm, the SH050 end frame, now locked: after the send the camera never moves again (camera.movement.push_in
    after_send). Rejected: another push on his relief (the film would keep leaning in when the story lets
    go).'
  composition: Same size as the end of the crank shot, so the only change is his hand opening and the
    pip dying.
  lighting: Steady phone key; the pip's gentle decay reads as his effort's afterglow (look.lighting.power_indicators).
  movement: Static.
  color: 'Warm-white glow on his face against the dusk: the exact colour the next shot begins with (look.color.phone_glow),
    for the cut on light.'
  blocking: The crank rests in his lap, arm out, pip off (continuity.props.glovebox_and_crank SC04_end).
  animation: 'Release: he lets go instead of stopping the handle, so it coasts and clicks on its own,
    and the pip dies within 6 frames at the crank''s frame bottom, the last amber light of the film. Only
    then does he breathe out and close his eyes: effort first, then rest, in that order. The out-breath
    is the longest of the film so far and the shoulders drop without springing back, the opposite of every
    comic reset. Rejected: a fist or a smile at the send (a victory lap, excluded by the character canon)
    and letting go and looking up here (the look up belongs to SC06).'
