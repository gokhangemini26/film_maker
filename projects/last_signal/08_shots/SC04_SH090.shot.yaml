creative_intent:
  narrative_purpose: He lets go of the handle; it clicks to a stop; he breathes out.
  emotional_purpose: 'Release: it is done and out of his hands.'
  visual_purpose: 'Medium close-up at his eye level: his right hand opens off the crank, the pip fades
    within six frames, his shoulders settle, the phone''s steady glow on his face.'
  audience_effect: The viewer exhales with him; the cut to her phone lighting up follows on the same warm
    light.
