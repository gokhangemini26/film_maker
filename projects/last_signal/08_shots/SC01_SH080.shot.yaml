creative_intent:
  narrative_purpose: 'The battery turns red: 5 % becomes 4 %.'
  emotional_purpose: 'A comic jolt: the world''s timing strikes just as he finds his words.'
  visual_purpose: 'Status bar close: the charcoal 5 % flips to a red 4 % four frames in, then holds.'
  audience_effect: The viewer learns red means danger and that the number will keep falling.
camera:
  lens_mm: 85
  height_m: 1.17
  movement: static
  start_position:
  - 1.28
  - 0.37
  - 1.17
  end_position: null
  look_at: phone_ren
  dof:
    enabled: true
    f_stop: 5.6
    focus_target: phone_ren_screen_plane
composition:
  framing: insert
  aspect_ratio: 1.778
  subject_position: upper_right
  notes: 'Text-size insert on the status bar (frame about 71 mm tall, 85 mm at 0.30 m): battery icon and
    number in the upper right third, digits at 3 % or more of frame height. Change at frame 4, then 26
    frames held (minimum 24). Framing reference (DEPENDENCY for the animation hold and the builder): screen
    centre at about (1.28, 0.62, 1.00) in the v2 car interior used by the animated frames (front seats
    0.25 m forward, anchors.CAR_V2), about 0.34 m in front of his head. Lens 0.30 m from it on his eyeline.
    In the v2 interior his eyes are only about 0.22 m from the screen, so the lens sits just inside his
    head; inserts do not render his head or face (DEPENDENCY for the builder: every head and face piece
    is hidden, fringe, brows and mouth included), camera''s up = the phone''s top edge. For the part of
    the screen named here, shift the lens parallel to the screen; never tilt it.'
