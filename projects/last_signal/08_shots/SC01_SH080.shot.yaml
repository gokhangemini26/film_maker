rationale:
  camera: '85 mm text-size framing on the one meter in the film (camera.inserts.legibility: digits 3 %,
    24-frame hold). Rejected: showing the change in the typing insert (the status bar would crowd the
    text frame). Lens position corrected after the first preview: the approved spec put the lens about
    0.38 m from the screen and inside his head, which gives a frame about 91-93 mm tall, so a 2.2 mm digit
    falls to about 2.4 % (under the 3 % minimum). At 0.30 m on his eyeline the frame is 71 mm as promised.
    Rejected: keeping the old position and asking the builder to push the lens (the frame size would still
    be undefined in the spec). Lens moved with the phone for the v2 car interior (seats 0.25 m forward):
    the phone now rests at about (1.28, 0.62, 1.00), so the old lens at (1.29, -0.34, 1.14) was 0.97 m
    from it, a frame about 230 mm tall in which the 2.2 mm digit is about 1 % of frame height. The lens
    keeps its old offset from the screen, 0.30 m back along his eyeline (0, -0.25, +0.17), and now sits
    at (1.28, 0.37, 1.17); lens, tilt, framing, screen direction and owner-side view are unchanged. Rejected:
    tilting or re-aiming the old lens (the screen would skew past the 15-degree limit of camera.dof.inserts)
    and a longer lens (85 mm is the locked insert lens). In the v2 interior his eyes are about 0.22 m
    from the screen, so no 0.30 m lens position fits between his face and the phone; the lens sits inside
    his hidden head instead. Rejected: a 0.20 m lens in front of his face (a 48 mm frame that crops the
    status bar and changes the approved composition) and swinging the lens off his eyeline to clear his
    head (the owner''s-eye view of the screen is the insert language).'
  composition: 'Number in the upper right third with empty pale UI around it, so the flip to red is the
    only event. Rejected: centring (the icon''s real place on screen would be falsified).'
  lighting: Screen-lit.
  movement: Static.
  color: 'The first red of the film (look.color.accent_battery_red; look.color.rule.only_red): charcoal
    to red is the whole joke.'
  blocking: 'No thumb in frame: the change has the frame to itself.'
  animation: 'The jolt is a one-frame change inside a still frame, four frames after the cut so the eye
    has landed on the number first. Any flash or shake would make the phone perform the joke; the comedy
    is the world''s timing (tone.comedy_source), so the UI simply changes. Rejected: a red pulse or a
    shrinking battery bar, which would add motion competing with the digits.'
