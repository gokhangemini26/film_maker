    tilt up 5 deg. Horizon (railing, apricot band) in the lower third; sky under two thirds of frame and
    behind him; vanishing point about 20 % of frame width from his head; at most three thin wire spans,
    none across him. Lens above his jacket top (about 0.85 m), so the jacket is below the horizon (camera.framing.jacket_off_sky).
    Phone glow visible in his hands (source in frame for the setup).'
