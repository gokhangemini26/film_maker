creative_intent:
  narrative_purpose: 'Ten minutes later: the sun has gone; he sits on the kerb beside his dead car, knees
    up, spent, the phone flickering in his hands.'
  emotional_purpose: 'The film goes quiet: tiredness, and a first tenderness toward him.'
  visual_purpose: 'The westward bookend: Ren hunched in profile at screen right, the car flank and open
    door receding, the dark shop and its lamp down the pavement, the apricot band low and lavender above.'
  audience_effect: The viewer feels the change of film (colour, lens, pace) and stores this frame to compare
    with the last one.
