rationale:
  camera: '35 mm, the one wide-ish lens after the turn, reserved for this bookend (camera.lens.roles).
    Lens at 0.95 m, his seated eye level. Rejected: 50 mm here (the car, door and shop would not all fit,
    and the before/after comparison needs the same wide frame in SC06).'
  composition: 'Off-centre, horizon low, negative space screen left toward the afterglow (look.style.composition
    tender). The open door stands beyond him as a frame in the frame; the dark shop down the street recalls
    the failure. Rejected: a centred frame (symmetry is for the comic section only).'
  lighting: Cool dusk ambient, warm afterglow rim on the screen-left edge of his profile, the flickering
    phone the only key (look.lighting.sc04). Street lamp by the shop lights only the shop front. Profile
    exemption from the 45 deg phone-lit rule (camera.phone_lit.framing).
  movement: 'Static: the first shot of the tender half does not move; it waits with him.'
  color: The shared dusk sky asset (look.color.sky.dusk) in its only kerb appearance; lavender above,
    apricot low.
  blocking: 'Seated at the rear quarter, back to the car, facing south (camera.geography.sc04_sc06): the
    forward ''?'' silhouette (characters.ren.silhouette). Door open 60 deg (continuity.props.passenger_door).'
  animation: 'The film goes quiet in the body first: one slow breath cycle of about 2 s and one tired
    blink are the only motion, slower than anything in the comedy, and there is no freeze-sag-reset. The
    flicker is irregular so it reads as the phone failing rather than as a rhythm, and it is the only
    light that moves. Because the bookend repeats in SC06, this hunched pose is the "before" the final
    image is measured against (camera.geography.sc04_sc06). Rejected: a sigh with a big shoulder drop
    (a comic sag) and no motion at all (reads as a comic freeze, which the turn has left behind).'
