    westmost fridge, which is wild for this shot (the builder drops a set piece whose box contains the
    lens); the lens is about 0.8 m from the phone and about 41 deg off his back axis on his left. The
    stand is at frame right, its back edge near the right frame edge; the socket sits just below the frame.
    The bolt appears at frame 14 and holds 22 frames. DEPENDENCY: the bolt glyph must be about 4.4 mm
    tall on the phone model to reach 3 % of frame height here; check at the next preview.'
