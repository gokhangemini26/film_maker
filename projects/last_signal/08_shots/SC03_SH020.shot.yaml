rationale:
  camera: '35 mm over his right shoulder at his own eyeline: the hope is seen in the room, from where
    he is looking, not in an insert, so the second gag is not the car''s again (camera.gags.no_repeat).
    Rejected: the car''s status-bar insert (beat-for-beat repeat, G2 finding 2). Re-placed for the G5
    re-review finding 3: from the previous lens inside the westmost fridge (2.95, 8.30, 1.15) the phone
    never showed its face, because the kneel rig holds the phone 0.22 m ahead of him at 0.93 m and turns
    the screen toward his face: flat under his chin at f0 and f26-f35, upright toward the stand while
    he leans to plug in, so from his left-back the screen was edge-on or turned away exactly when the
    bolt came on (f14). The lens now sits where his eyes go: up and to his right, outside his head''s
    path to the stand. Height: the rig''s eye in this pose is about 1.15 m (head centre 1.17-1.18 m, measured),
    so the lens is about 0.13 m above his eye looking down his own sightline; it is not the high angle
    of camera.height.high (that needs 0.5 m above the eye and is spent on the master). Rejected: (a) the
    lens inside the fridge (screen edge-on or away, bolt invisible, G5 finding 3); (b) a lens 0.30 m from
    the phone for a 3 % bolt (inside his hair at f0 and f26, and the frame becomes an insert, which camera.gags.no_repeat
    rules out for the shop''s hope); (c) a lens west of his head at (3.765, 8.90, 1.21) (his head passes
    through it at f20 and the frame goes to hair); (d) a higher lens at (3.60, 8.92, 1.36) (his crown
    covers the phone from f24 and the culled back wall renders black). Conflict, flagged and not hidden:
    no over-the-shoulder this rig allows reaches the 3 % bolt of camera.inserts.legibility (3 % of frame
    height needs a frame of 0.16 m or less at the phone, a 0.28 m lens distance at 35 mm, inside his head).
    Here the bolt reads as the one amber point appearing beside 3 %, at about 1.5 % of frame height, for
    22 frames. Raised for a human decision in the handoff.'
  composition: 'The phone large in the centre with his left hand on it, his right arm crossing to the
    stand at frame left (f6-f16), his hair at the frame edge when he leans back over it: hope and the
    place he trusted in one frame, seen from where he looks. Rejected: the phone smaller at the frame
    edge with more room around it (the bolt drops under 1 % of frame height and stops reading).'
  lighting: Panels from above and behind the lens; the fridges' cool light edges the phone from the east;
    the screen faces the lens side through the bolt; the amber bolt is the only saturated warm point on
    the phone.
  movement: Static.
  color: Cool shop, amber bolt.
  blocking: The cable runs from the phone over his knee and behind the stand, a short posed length (continuity.props.cable).
    The stand is about 0.3 m to his right and the socket about 0.8 m right and 0.3 m ahead of his pelvis,
    inside his reach.
  animation: 'Hope again, a notch warier: in the car he sank back the moment the bolt appeared; here he
    only watches it, no relief (camera.gags.no_repeat, G3 finding 7). The fumble behind the stand is two
    small adjustments, busy not clumsy. The phone is locked still from f10 so the small bolt reads over
    his shoulder at f14. Rejected: an immediate relief beat (repeats the car gag beat for beat).'
