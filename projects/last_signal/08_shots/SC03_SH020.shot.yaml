rationale:
  camera: '35 mm over the shoulder at his kneeling eye level (lens 1.15 m, within 0.1 m of 1.05 m): the
    hope is seen in the room, not in an insert, so the second gag is not the car''s again (camera.gags.no_repeat).
    Rejected: the car''s status-bar insert (beat-for-beat repeat, G2 finding 2). Moved with him to the
    stand (builder reach fix: at (3.45, 8.66) facing +y his right hand reaches the socket within 2 cm;
    the old spot (2.2, 8.0) was about 2.05 m from the stand, reach error about 1.22 m): the same over-the-left-shoulder
    relation (was 0.9 m and 30 deg off his back axis, now 0.8 m and about 41 deg). The westmost fridge
    now stands 0.25 m east of him, so any lens behind his left shoulder and in front of the fridge face
    loses the phone behind the fridge corner; the lens therefore sits inside the fridge footprint with
    the fridge wild. Rejected: a lens straight behind him (x 3.25, y 7.95, no wild piece), where his head
    covers the phone.'
  composition: 'Phone in the foreground over his left shoulder, his reaching arm and the stand at right,
    the back-wall corner behind the stand: hope and the place he trusted in one frame. The fridges are
    no longer behind the stand (they are beside him, behind the lens).'
  lighting: Panels from above; the fridges' cool light comes from behind the lens and edges his left shoulder
    and the phone; the amber bolt is the warmest point in frame.
  movement: Static.
  color: Cool shop, amber bolt.
  blocking: The cable runs from the phone over his knee and behind the stand, a short posed length (continuity.props.cable).
    The stand is about 0.3 m to his right and the socket about 0.8 m right and 0.3 m ahead of his pelvis,
    inside his reach.
  animation: 'Hope again, a notch warier: in the car he sank back the moment the bolt appeared; here he
    only watches it, no relief (camera.gags.no_repeat, G3 finding 7). The fumble behind the stand is two
    small adjustments, busy not clumsy. The phone is locked still from f10 so the small bolt reads over
    his shoulder at f14. Rejected: an immediate relief beat (repeats the car gag beat for beat).'
