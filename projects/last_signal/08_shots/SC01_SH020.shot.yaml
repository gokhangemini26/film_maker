rationale:
  camera: '85 mm, the insert lens (camera.inserts.language): flat, frontal, readable. The lens sits above
    his left shoulder, 0.67 m from the screen, so the whole screen fills about 0.16 m of frame height
    and his head stays out of the sight line: the approved spec put the lens on his eyeline behind his
    head, and the head became the dark shape at the frame top (PREVIEW_REVIEW #9). The screen is still
    square to the lens, so this is an insert, not an over-shoulder shot. Rejected: an over-shoulder map
    (screen at an angle, pin too small; camera.inserts.language), and a lens on his eyeline in front of
    his face (only 0.40 m of room, which makes a text-size frame and loses the map). Lens moved with the
    phone for the v2 car interior (seats 0.25 m forward): the phone now rests at about (1.28, 0.62, 1.00),
    so the old lens at (1.02, -0.59, 1.32) was 1.28 m from it, a frame about 305 mm tall in which the
    15.7 mm pin is about 5.2 % of frame height (minimum 6 %). The lens keeps its old offset from the screen,
    0.67 m back above his left shoulder (-0.27, -0.50, +0.35), and now sits at (1.01, 0.12, 1.35), measured
    0.667 m from the screen for a 159 mm frame; lens, framing, screen direction, owner-side view and the
    24-degree swing off his eyeline are unchanged, and the sight line still clears his head and hair (about
    0.02 m from the hair surface, 0.14 m from the head centre). Rejected: tilting or re-aiming the old
    lens (the screen would skew past the 15-degree limit of camera.dof.inserts and the frame would stay
    305 mm tall), a longer lens (85 mm is the locked insert lens) and leaving the lens where it was and
    asking for the phone to come back to it (the phone follows his v2 seated pose, which the animation
    owns).'
  composition: 'Pin at centre so the eye lands on it at once; nothing else on the map carries a shape.
    Held 38 frames, above the 36-frame minimum (camera.inserts.legibility; G2 finding 10). Rejected: a
    text-size insert on the pin alone, which loses the ''map'' read that makes it a place.'
  lighting: 'The screen is the key; sun only on his hand at frame edge. Rejected: sunlight glare across
    the glass (unreadable UI).'
  movement: 'Static: no move is allowed in a phone insert (camera.movement.forbidden).'
  color: 'UI palette (look.color.ui); the pin''s blue and white is the only saturated mark. Rejected:
    a red pin (red belongs only to the battery, look.color.rule.only_red).'
  blocking: Thumb parked at the screen edge so it never covers the pin during the hold.
  animation: 'An insert reads fastest when one thing matters: the pin is still from the first frame for
    all 38 frames (above the 36-frame minimum) and nothing else moves. The resting thumb says he is looking,
    not scrolling: anticipation, not hurry. Rejected: a pin drop-in or a slow map scroll, which spend
    hold frames and read as an app advert.'
