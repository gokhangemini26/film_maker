  notes: 'Screen insert: frame height about 0.16 m at the screen (85 mm at 0.67 m), owner''s side, square
    within 15 deg. Framing reference (DEPENDENCY for the animation hold and the builder): screen centre
    at about (1.28, 0.62, 1.00) in the v2 car interior used by the animated frames (front seats 0.25 m
