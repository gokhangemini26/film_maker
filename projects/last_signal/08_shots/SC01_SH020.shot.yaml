creative_intent:
  narrative_purpose: 'Tonight''s plan is dinner: a map with one fork-and-knife pin.'
  emotional_purpose: Anticipation; he has somewhere to take her.
  visual_purpose: 'The whole screen square to the lens: unlabelled map, the blue pin with its white fork
    and knife near frame centre at 6 % of frame height or more.'
  audience_effect: The viewer knows the dinner before any message exists (story.setup_cues), so the invitation
    later reads instantly.
