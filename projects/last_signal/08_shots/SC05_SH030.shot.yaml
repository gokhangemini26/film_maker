rationale:
  camera: '50 mm medium close-up at her eye level: close enough for a small smile on the proxy face, not
    so close that it becomes a declaration (tone.ending_restraint). Rejected: 85 mm close-up (the window
    and sky would leave the frame, and the smile would become an event).'
  composition: 'Her profile faces screen left toward the window: the cut on direction to Ren''s bookend,
    both facing the same western sky without cutting skies together (camera.rhythm.transitions sc05_to_sc06;
    G3 finding 9).'
  lighting: 'Phone from below plus lamp key: the light that left his hands is now on her face (look.style.motifs
    lights_hana); softest contrast in the film.'
  movement: Static.
  color: 'Warm white under-light, lamp warm, window cool: the first frame that feels complete.'
  blocking: Headphones around her neck; phone in both hands, low. The smile is small and she does not
    look up.
  animation: 'The film''s only answer, built as characters.hana.expressions describes it: the eyes finish
    reading first, then the lids lift, then the corners rise with lips closed, then the head dips and
    the shoulders settle, each starting a few frames after the last, so the smile arrives as one soft
    wave at f22 and is held 30 frames. It stays small and never grows, and she does not look up: private
    pleasure, a yes to dinner and not a declaration (tone.ending_restraint). One blink and one breath
    keep the hold alive on a proxy face without adding meaning. Rejected: a smile that widens over the
    hold, a look to the window (it would play as thinking of him), and any blush.'
