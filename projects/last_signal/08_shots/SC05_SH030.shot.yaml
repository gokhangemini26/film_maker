creative_intent:
  narrative_purpose: She reads the invitation; a small smile.
  emotional_purpose: Quiet happiness, private; the answer the film gives, without words.
  visual_purpose: Medium close-up of her profile, the phone held low lighting her face from below, the
    window's dusk ahead of her, the smile held to the cut.
  audience_effect: The viewer feels hope and fills in the dinner and the confession themselves.
