  narrative_purpose: The bolt is gone; the phone reads 2 %.
  emotional_purpose: 'The cost counted: two left.'
  visual_purpose: 'Status bar close in the dark: the red 2 %, no bolt, the screen the only light.'
  audience_effect: The viewer tracks the countdown precisely.
