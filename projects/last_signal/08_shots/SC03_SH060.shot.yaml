composition:
  framing: insert
  aspect_ratio: 1.778
  subject_position: upper_right
  notes: 'Text-size status-bar insert (as SC01_SH080: frame about 71 mm tall, 85 mm at 0.30 m). The change
    to 2 % happened on the blackout frame; this insert holds the result 26 frames (minimum 24). No dip
    and no change inside the shot: in the shop the damage is already done (camera.gags.no_repeat: insert
    after the loss). Framing reference (DEPENDENCY for the animation hold and the builder): kneeling at
    (3.45, 8.66) facing +y, eyes at 1.05 m; the lens keeps exactly its old relation to him (0.12 m ahead
    of his pelvis, 0.97 m high), on his eyeline with his head behind the lens; camera''s up = the phone''s
    top edge; shift parallel to the screen for the status bar, never tilt. The screen-centre reference
    used so far (0.29 m ahead of him, 0.72 m high) now falls on the back-wall face (y 8.95); the kneel
    rig holds the phone 0.22 m ahead at 0.93 m (y 8.88, 7 cm off the wall), about 0.11 m from this lens:
    check the 71 mm frame at the next preview.'
