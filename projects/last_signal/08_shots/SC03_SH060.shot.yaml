rationale:
  camera: '85 mm, the same status-bar framing as the car so the number is read the same way. Rejected:
    skipping the insert (2 % would not read in the master). Lens position corrected after the first preview:
    the approved spec put the lens behind him, 0.66 m from the screen, looking past his chin, for a 157
    mm frame in which the digits fall to about 1.4 %, under the 3 % minimum, and not ''as SC01_SH080''.
    At 0.30 m on his eyeline the frame is 71 mm, the same as the car.'
  composition: 'The status bar floats on blue-black: the room has gone and only the meter is left.'
  lighting: Screen only; no defocused emissive in the background (camera.dof.inserts). Exposure target
    0.12 mean brightness is the human-ruled value, within the locked look.exposure.scene_keys.SC03_blackout
    tolerance 0.08±0.06, matching look.lighting.sc03_blackout_render checks.mean_luma_target.
  movement: Static.
  color: 'Red number, no amber: amber has now failed twice (look.style.motifs).'
  blocking: 'None in frame. He kneels at the stand (builder reach fix: at (3.45, 8.66) facing +y his right
    hand reaches the socket within 2 cm; the old spot (2.2, 8.0) was about 2.05 m from the stand, reach
    error about 1.22 m); the lens moved with him unchanged.'
  animation: 'A completely still insert: in the shop the damage is already done, so the phone only states
    the cost. A frame with nothing moving after the car''s busy insert is the second telling of the joke,
    told differently (camera.gags.no_repeat). Rejected: replaying the dip or the number change here (a
    repeat of SC01_SH140).'
