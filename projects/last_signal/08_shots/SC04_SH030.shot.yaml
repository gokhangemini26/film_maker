creative_intent:
  narrative_purpose: 'He looks up at the car: the passenger door stands open; beyond it, the glovebox.'
  emotional_purpose: 'The turn begins: a hesitation that becomes a decision.'
  visual_purpose: 'Medium close-up from the pavement south-east of him: his face three-quarter to the
    lens as he lifts his eyes, then his head turning screen left, away from us and into the depth of the
    frame; the open door at frame left and, through the opening beside its hinge, the glovebox left of
    centre; the camera eases toward him as his eyes settle on it.'
  audience_effect: The viewer remembers the crank before he moves, and leans in with the camera.
