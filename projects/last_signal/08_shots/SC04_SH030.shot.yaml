composition:
  framing: medium_close
  aspect_ratio: 1.778
  subject_position: right_third_facing_left
  notes: 'Face shot from the pavement side (camera.geography.sc04_sc06): lens on the pavement 1.55 m from
    him, 40 deg east of his facing (south), at his seated eye level. His head on the right third. Screen
    left of him and deeper in frame: the open door''s panel entering from the frame-left edge to about
    13 deg left of centre, and through the opening beside its hinge the closed glovebox about 10 deg left
    of centre (about 11 % of frame height and width), clear of his head and shoulder by about 0.4 m at
    his distance. At f0 his face reads three-quarter toward the lens; his head turn to the glovebox turns
    him away from us and hands the eye along his look into depth. Push-in 1 of 2: 0.18 m straight toward
    him from frame 4 to the end (32 frames, 0.135 m/s, under the 0.15 m/s cap), starting as his eyes land.
    Car flank behind his jacket (the ray through the jacket top hits the car at y about -0.75). Phone-lit
    rule: lens 40 deg from his facing, inside the 45 deg limit (camera.phone_lit.framing).'
