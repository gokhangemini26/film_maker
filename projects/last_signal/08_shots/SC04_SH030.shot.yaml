rationale:
  camera: '50 mm at his seated eye level (0.95 m): the tender section''s lens at his distance (camera.lens.roles).
    Not low: this is the hesitation, not the decision (camera.height.low rationale). Position corrected
    after the first preview (PREVIEW_REVIEW #6): from the approved lens position due south of him the
    glovebox sat about 33 deg off the lens axis, outside the 39.6 deg horizontal field of a 50 mm, so
    no builder could show it. Moving the lens 40 deg east around him on the pavement lines the glovebox
    up about 16 deg left of his head, inside the frame, with the same distance, height and push. Rejected:
    35 mm to hold both (reserved for the bookend, camera.lens.roles); a separate glovebox eyeline insert
    (an extra cut inside a 1.5 s beat); and keeping the old angle with the glovebox off frame (the viewer
    would not see what he remembers, the shot''s audience effect).'
  composition: 'His eyeline carries us screen left and into depth to the door and the glovebox (the line
    for SC04, camera.geography.sc04_sc06); the door is a frame within the frame. The cost of seeing the
    glovebox: once his head has turned we read him in lost profile, so the hesitation has to read in the
    first frames and in his stillness, breath and the forearms lifting, not in a late look at his eyes.
    Rejected: a point-of-view shot of the glovebox (the viewer would stop watching him).'
  lighting: Afterglow rim on the screen-left edge of his face grows as he turns toward the west; the phone
    flicker still on his chin.
  movement: 'Push-in 1 of 2 (camera.movement.push_in): 0.18 m in 1.33 s (0.135 m/s), starting after his
    eyes land. Motivated by the choice. Rejected: static (the decision would not be felt as a shift).'
  color: Dusk palette; the glovebox interior dark, no highlight on it (it must not glow).
  blocking: He does not stand yet; only his head and eyes move.
  animation: 'From the lens 40 deg east of his facing, the turn toward the glovebox (about 115 deg, through
    west) turns his face away from us: two thirds turned is already lost profile. So the shot now opens
    with the head only about one sixth round, face three-quarter to the lens, and the eyes lead: the audience
    reads the question in his face before the head follows. The turn itself is slow and even (ease-in-out
    over 14 frames, about 165 deg/s average), the tender tempo, not a snap (characters.ren.movement: turn
    tempo slow_deliberate). The push still starts at f4, on the frame the look commits, because the 0.18
    m push needs about 32 frames under the 0.15 m/s cap; the eyes land on the glovebox at f10, inside
    the push. Then he holds, breathes once and blinks: the hesitation, read in stillness and the forearms
    lifting, since his face is in lost profile by then. The decision is a small weight shift, never a
    comic reset (tone.the_turn). Rejected: opening two thirds turned (face already lost from the new lens;
    QA and camera feedback), and a full turn started at f0 with eyes landing at f4 (about 115 deg in 4
    frames, a snap that belongs to the comic half).'
