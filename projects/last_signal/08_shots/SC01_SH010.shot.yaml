rationale:
  camera: '50 mm frontal: the one comic-section use of 50 mm (camera.lens.roles exception), because only
    this side gives the sun as a frontal key and a normal lens keeps the face we must like at first sight
    undistorted. Eye level (1.20 m): we are with him. Rejected: 24 mm from the passenger seat, which stretches
    the face on its first read.'
  composition: 'Centred and boxed by the windscreen frame, the comic section''s geometric order; the mirror
    in the foreground gives a first depth layer and the vanity beat its prop. Rejected: an over-shoulder
    mirror reflection shot, which hides his face and invites reflection rendering problems.'
  lighting: 'Hard gold sun from the front (look.lighting.sc01) with warm dash bounce: bright, comic, never
    moody. A-pillar shadow bars stay off his face. Rejected: an interior fill light (unmotivated; the
    lighting bible forbids it).'
  movement: 'Locked off: a small vanity plays best in a held frame (camera.movement.default_static). Rejected:
    a slow push-in, which would make the mirror check a big moment.'
  color: 'look.color.scene.sc01 warm golden-hour palette with the cool sky only in the side windows; no
    accent yet, so the first amber and red in the film belong to the phone. Rejected: an accent in wardrobe
    or props here, which would pre-empt the meter''s colours.'
  blocking: 'He faces the lens; right hand to the mirror and the tuft, left hand keeps the phone low in
    frame so the phone is present from the first shot. Rejected: phone out of frame (the object of the
    film would arrive late).'
  animation: 'The screenplay''s stubborn tuft becomes one small held beat: he presses it down, it springs
    back, he looks and lets it be. In 40 frames that is the whole character: earnest, a little nervous,
    never a clown, so we are on his side before the phone matters (intent.race_against_battery). Quick
    bursts between short holds is his comic tempo (characters.ren.movement); the eyes dropping to the
    phone at the end hand the audience to the map insert. Rejected: a double-take at the tuft or a second
    attempt, which turns a nervous habit into a gag at his expense (tone.comedy_source).'
