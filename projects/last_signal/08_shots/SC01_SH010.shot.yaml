      - f: 26
        t: 1.08
        pose: right hand back to the mirror, tilts it back toward the road (quick burst)
      - f: 31
        t: 1.29
        pose: right hand returns to the top of the wheel; shoulders settle 1 cm
      - f: 34
        t: 1.42
        pose: eyes drop to the phone in his left hand (lead into the map insert); held to the cut
