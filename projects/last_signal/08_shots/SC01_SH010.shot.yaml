creative_intent:
  narrative_purpose: 'Meet Ren alone in his parked car, getting ready to see someone: he tilts the mirror,
    presses down one stubborn tuft, tilts it back.'
  emotional_purpose: Affection and a small smile at his nerves; we like him before anything goes wrong.
  visual_purpose: His face lit frontally by the low gold sun through the windscreen, the mirror in the
    foreground, the tuft readable against the dim rear of the cabin.
  audience_effect: The viewer senses a date is at stake and is on his side before the phone appears.
