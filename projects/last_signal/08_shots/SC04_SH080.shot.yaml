creative_intent:
  narrative_purpose: 'His thumb rests over the send arrow and presses it: a thin amber progress line fills,
    and a tick appears. No word.'
  emotional_purpose: A small, earned triumph, held quietly.
  visual_purpose: The sent bubble with the whole invitation, the amber line filling for one second, the
    amber tick at 5 % of frame height or more exactly where the thumb has just lifted, held.
  audience_effect: The viewer knows the invitation got through because he turned the crank.
