  - -0.23
  - -1.0
  - 0.79
  end_position: null
  look_at: phone_ren
  dof:
    enabled: true
    f_stop: 5.6
    focus_target: phone_ren_screen_plane
composition:
  framing: insert
  aspect_ratio: 1.778
  subject_position: lower_right_then_centre
  notes: 'Text insert (frame about 71 mm tall, 85 mm at 0.30 m). Thumb over the send arrow at frame 0,
    press at frame 6; bubble rises; progress line fills frames 8-32 (1 s); tick at frame 34 at the bubble''s
    lower right, in the eye path where the thumb lifted; thumb clear of frame by then; 24 frames held
    after the tick. DEPENDENCY: tick glyph at least 3.6 mm tall on the phone model; tick contrast is look
    canon (G4 finding 4). Framing reference (DEPENDENCY for the animation hold and the builder): seated
    on the kerb, eyes at about (-0.20, -1.0, 0.94); screen centre at about (-0.30, -1.0, 0.50), low between
    his knees, 0.45 m from his eyes. Lens 0.30 m from it on his eyeline, looking down past his chin (his
    head and chest are behind the lens), camera''s up = the phone''s top edge (south, away from him),
    so the keys and his thumb come in at the frame bottom. For the part of the screen named here, shift
    the lens parallel to the screen; never tilt it.'
