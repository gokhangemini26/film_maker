rationale:
  camera: '85 mm, one locked text insert for the whole send (camera.inserts.legibility; bible section
    8). Rejected: a push on the send (softens the text and the tick; camera.movement.push_in rationale).
    Lens position corrected after the first preview: the approved spec put the lens 0.13 m from the screen
    on the far (south) side of the phone, 35 deg off his eyeline, which gives a 31 mm frame (less than
    half the promised 71 mm) and a screen seen from the non-owner side, upside down for him (camera.inserts.language:
    owner''s side, never upside down). At 0.30 m on his eyeline the frame is 71 mm and upright. Rejected:
    50 mm from the old spot (the lens would still be on the wrong side of the screen).'
  composition: 'The tick lands where the eye already is, at the thumb''s last position, and the thumb
    is gone before it appears: size, placement and hold are the camera''s share of G4 finding 4. The invitation
    stays fully in frame in its bubble.'
  lighting: Steady screen; no highlight on the tick beyond its UI colour.
  movement: Static.
  color: 'Amber line and amber tick: the same amber as the ring, the bolt and the pip, now meaning ''delivered''
    (look.style.motifs).'
  blocking: The thumb comes down once and leaves downward, out of the eye path.
  animation: 'A small earned triumph, held quietly: the thumb rests, presses once and leaves, so nothing
    covers the tick (camera.inserts.legibility). The line fills at an even pace with only a slight ease
    at the end, because a stall or a stutter here would be a gag and the film has no gags after the turn
    (tone.the_turn). The tick appears whole after one empty beat and is held without a pop: its stillness
    is the triumph, and the ratchet still turning underneath says whose effort paid for it. Rejected:
    a line that slows almost to a stop near the end (manufactured suspense) and a bouncing tick (a victory
    lap, characters.ren.expressions).'
