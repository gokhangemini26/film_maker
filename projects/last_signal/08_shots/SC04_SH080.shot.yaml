  ui:
    send_arrow: darkens f6-7
    bubble: the text lifts into the pale blue sent bubble, sliding up one line (ease-out, f7-10)
    progress_line: 'amber, fills f8-32: linear, easing out over the last 3 frames (f30-32) so it arrives
      rather than stops'
    tick: one frame of empty beat at f33; amber tick appears whole on f34 at the bubble's lower right
      (no scale-in, no bounce); held f34-57 (24 frames, minimum 24)
  camera:
    easing: none
    notes: locked off (no move in inserts)
  sound_sync: soft send sound on f6; ratchet clicks carry on at f2, f26 and f50 (phase from SC04_SH050)
