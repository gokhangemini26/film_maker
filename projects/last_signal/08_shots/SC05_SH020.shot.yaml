creative_intent:
  narrative_purpose: Hana, sketching with big headphones on, notices the light, slides the headphones
    down around her neck and picks up the phone.
  emotional_purpose: Warmth and a little surprise; the missed call explained without a word.
  visual_purpose: 'Her left profile at the desk under the west window: lamp-lit, the dusk sky in the window
    at screen left, the new phone light on her right.'
  audience_effect: The viewer understands why she did not answer and sees her reach for his message at
    once.
