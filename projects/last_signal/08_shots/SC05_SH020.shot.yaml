rationale:
  camera: '50 mm at her eye level (1.14 m), her profile toward screen left, matching Ren''s bookend by
    direction (camera.geography.sc05, desk layout kept by the human). Rejected: a three-quarter front
    over the desk (needs the alternative layout, not taken).'
  composition: She faces the window and the sky he sits under, with space ahead of her face at screen
    left (tender lead room). The headphones are big in silhouette against the lamp-lit wall.
  lighting: Lamp on her visible side; cool window fill ahead of her; the phone's warm light arrives from
    the far side as a new light (look.lighting.sc05). Profile exemption from the 45 deg phone-lit rule
    (camera.phone_lit.framing).
  movement: 'Static: after the send nothing moves (camera.movement.push_in after_send).'
  color: Her room palette (look.color.hana_room), the shared dusk sky in the window (look.color.sky.dusk).
  blocking: Headphones on at the start, around her neck by the end (continuity.hana.headphones); right
    hand picks up the phone.
  animation: 'Four actions fit in 32 frames only as overlapping, economical moves in the canon''s order:
    eyes, head, hands (characters.hana.movement). Each begins before the last ends, so the shot reads
    as one calm gesture rather than a checklist. The two-handed slide is smooth and unhurried in its own
    8 frames, curious rather than startled (characters.hana.wardrobe.headphones), and the reach is short
    because the phone lies by her pencil hand. Her stillness before the notice is the settled room the
    film needs after his street. Rejected: a one-handed pull (reads as annoyance), picking up the phone
    before the headphones come off (breaks the staging order) and a hurried grab (reads as expecting him).'
