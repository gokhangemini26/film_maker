creative_intent:
  narrative_purpose: He reaches the corner shop and ducks inside; the door chime rings.
  emotional_purpose: 'Brief hope: he made it.'
  visual_purpose: 'From the west on the pavement axis: he runs at us and swerves in under the striped
    awning at frame right; far behind him, small, the car with its door open.'
  audience_effect: The viewer knows where the shop is relative to the car, which pays off at the kerb.
camera:
  lens_mm: 35
  height_m: 1.7
  movement: static
  start_position:
  - -1.0
  - 17.0
  - 1.7
  end_position: null
  look_at: shop_door
  dof:
    enabled: false
composition:
  framing: medium_wide
  aspect_ratio: 1.778
  subject_position: centre_to_right
  notes: 'On-axis looking east (neutral bridge). FG: lamp pole edge at frame right; MG: awning and shop
    door (screen right, the south building line); BG: the pavement receding to the car, its open passenger
    door readable as a shape. 16 frames (elliptical cut 3 of 3). Sun behind the camera.'
characters:
- id: ren
  position:
  - -1.2
  - 12.0
  - 0.12
  facing: west, toward camera, then turning to his left (south, screen right) into the door
  action: runs in, swerves to his left (screen right) under the awning and through the door; chime
environment:
  location: street, south pavement from the car to the shop door
  weather: clear
  time_of_day: golden hour
lighting:
  ref: look.lighting.sc02
  key:
    source: sun from +Y (west), 6 deg up
    temperature_k: 3200
    quality: hard
  fill: pale sky and north-wall bounce
  practicals:
  - shop fascia sign (weak in daylight)
  notes: Long shadows toward -Y (east). Street lamps off.
color:
  dominant: look.color.scene.sc02
  sky: look.color.sky.golden_hour
animation:
  timing:
    fps: 24
    frames: 16
    index: 0-based; f0 is the first frame, t = f / 24
  characters:
    ren:
      locomotion:
        type: run_then_swerve
        speed_mps: 4.1
        path: 'street coords: west along x -0.8 from about y 10.2 toward the lens, swerving south (screen
          right, his left) into the shop door at (-1.8, 12.0); about 2.2 m in 13 f'
      keys:
      - f: 0
        t: 0.0
        pose: running toward the lens, left foot contact, phone out ahead
      - f: 6
        t: 0.25
        pose: right foot plants; starts to bank toward screen right
      - f: 8
        t: 0.33
        pose: swerving, body banked about 10 deg; head ducks under the awning
      - f: 10
        t: 0.42
        pose: right hand pushes the shop door open
      - f: 11
        t: 0.46
        pose: ducking through the doorway
      - f: 13
        t: 0.54
        pose: last of him (heel, jacket hem) through the door; gone
      face: small in frame; eyes on the door
      secondary:
      - jacket hem swings out on the swerve
      - cable loop swings wide on the turn
      eyeline: the shop door from f0
  props:
    shop_door: swings in f10-13 to about 70 deg, starts to swing back from f14 (continues after the cut)
  camera:
    easing: none
    notes: locked off
  sound_sync: door chime on f15, the last frame (the cut point)
  notes: 'The path follows world.sets.street (shop door centre y 12.0); the shot''s character position
    (y 13.0) sits 1 m west of the door, and the blocking rationale says he swerves ''on his own right
    (screen right)'', but running toward a lens that looks east, screen right is his left. Animated to
    the world geometry: his left, screen right.'
render: {}
assets:
- world.sets.street
- world.sets.corner_shop
- world.sets.ren_car
- world.props.phone_ren
rationale:
  camera: '35 mm at eye level, the street lens; from the west so the sun lights him frontally as he arrives.
    Rejected: a lateral at the door (repeats SH010''s direction without showing the distance back to the
    car).'
  composition: 'The car far behind him establishes that the shop is 12 m west of it (camera.geography.sc02)
    and shows the open door again. Rejected: framing the door alone (the geography would be lost).'
  lighting: Frontal warm sun on him; the fascia sign lit but weak (look.lighting.sc02).
  movement: Static.
  color: Golden street, striped awning; no accent.
  blocking: He swerves into the door to his own left (screen right; he runs west toward a lens looking
    east) at the door (y 12.0), and is gone before the cut; the chime is the cut point.
  animation: 'The duck under the awning is brief hope in motion: he made it. He is gone by f13 so the
    last frames are the empty, swinging door and the chime lands on the cut, the scene''s full stop. The
    swerve banks rather than skids, keeping the run earnest (no near-miss or wall bump). Rejected: holding
    on him in the doorway (the dash would stall one beat before the shop).'
