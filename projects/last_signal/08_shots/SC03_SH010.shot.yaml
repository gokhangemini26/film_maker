rationale:
  camera: '35 mm high wide (lens 2.3 m, tilt 11 deg): the strongest high angle in the film is set up here
    and paid off unchanged at the blackout (camera.height.high SC03_aisle_wide_strong). Rejected: an eye-level
    entry (the room would not dominate him).'
  composition: 'Symmetric aisle frame with the ordered shelves pressing in (look.style.composition comic).
    He travels from the frame bottom to the far right corner, so the room''s depth is the distance he
    spent. Rejected: a lateral entry (loses the aisle''s depth).'
  lighting: 'Soft, near-shadowless panels, fridges glowing on the back wall: comic order (look.lighting.sc03
    lit state).'
  movement: 'Static: he crosses the room; the camera stays put so the same frame can be reused. Rejected:
    a follow-pan (the blackout frame would no longer match).'
  color: 'Cool, bright shop palette (look.color.shop) after the gold street: we are inside.'
  blocking: He ends kneeling at the west end of the back cross-aisle, facing the back wall, beside the
    stand; the socket is behind the stand (world.sets.corner_shop).
  animation: 'Comic urgency in an orderly room: he scans with head snaps while still moving, which keeps
    his burst-and-hold rhythm readable at 25 % of frame height without stopping, then commits to the aisle
    and drops to his knees in one move (characters.ren.movement). The run keeps the SC02 pace so the shop
    feels like the same dash arriving. The final kneel matches the pose SH050 will freeze, so the two
    master frames differ only in the light. Rejected: stopping for a full scan pose (costs about 10 frames
    the shot does not have) and a knee slide (a stunt, and a humiliation risk).'
