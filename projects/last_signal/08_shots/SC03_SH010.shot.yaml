creative_intent:
  narrative_purpose: He bursts into the bright shop, scans the walls, spots a low socket behind a display
    stand at the very back, hurries down the aisle and drops to his knees.
  emotional_purpose: Comic urgency in a cheerful, orderly room.
  visual_purpose: 'The high wide from above the door down the west aisle: shelves, fridges, four ceiling
    panels, and a small figure crossing the whole room.'
  audience_effect: The viewer learns the room, its lights and his distance from the door, which the blackout
    will use.
