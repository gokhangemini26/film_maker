      - f: 2
        t: 0.08
        pose: head snaps left to scan the wall; body keeps running (eases to about 3.2 m/s)
      - f: 6
        t: 0.25
        pose: head snaps right
      - f: 10
        t: 0.42
        pose: head locks down the aisle on the socket corner (spots it); 2-frame forward-lean anticipation
          f10-11
      - f: 12
        t: 0.5
        pose: accelerates down the west aisle, a step every 6 frames
      - f: 36
        t: 1.5
        pose: braking steps, shorter strides (f36-43)
      - f: 44
        t: 1.83
        pose: drops to both knees in one quick move (f44-48), phone arm tucks to the chest
      - f: 48
        t: 2.0
        pose: knees down beside the stand, facing the back wall; small forward settle f49-51, eyes to
          the stand
      face: not readable (from above and behind)
      secondary:
      - jacket hem swings, flares on the drop and settles by f51
      - cable loop swings with the stride and falls slack on the kneel
      eyeline: left wall, right wall, then the socket corner from f10
  camera:
    easing: none
    notes: 'locked off: the same frame is reused for the blackout (SH050)'
  risks_m3:
  - '6.7 m in 1.83 s is a quick run (about 3.7 m/s), not a walk: the entry keeps the pace of the SC02
    dash. A walking hurry (about 2.5 m/s) would need about 2.7 s; flagged, not changed'
