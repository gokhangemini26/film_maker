    index: 0-based; f0 is the first frame, t = f / 24
  characters:
    ren:
      locomotion:
        type: quick_run_then_kneel
        speed_mps: about 4.0 entering, 3.2 while scanning, 4.0 down the aisle, braking from f36; average
          about 3.7
        path: 'shop-local coords: enters under the camera head-first at about (1.3, 1.4) (the frame bottom
          at head height), runs down the west aisle to kneel at (2.2, 8.0); about 6.7 m in 44 f'
      keys:
      - f: 0
        t: 0.0
        pose: head and shoulders enter at the frame bottom, running (step on f0), phone and cable loop
