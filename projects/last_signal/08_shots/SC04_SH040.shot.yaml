creative_intent:
  narrative_purpose: He turns onto one knee, leans in through the open door, opens the glovebox and takes
    out the crank charger; he sits back on the kerb holding it in both hands, carefully.
  emotional_purpose: 'Resolve, without a joke: the same object, now held with care.'
  visual_purpose: 'The strongest low angle of the film, from the pavement looking north: his figure against
    the car''s flank, the crank ending in both hands at the centre of frame.'
  audience_effect: The viewer feels that he has decided and that this is the film's turn.
