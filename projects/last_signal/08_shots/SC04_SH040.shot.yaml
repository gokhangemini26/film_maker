        path: 'street coords: from the kerb seat (x -0.1, y -1.0) onto the right knee, left foot steps
          west to about y -0.55 into a low lunge; torso leans in through the doorway (shoulders to about
          x 0.2, y -0.2); back to the same seat (x -0.1, y -1.0)'
      keys:
