rationale:
  camera: '50 mm from 0.5 m above the pavement, tilt up 12 deg: the film''s strongest low angle, ''he
    makes up his mind'', spent once (camera.height.low the_turn). Rejected: 35 mm (reserved for the bookend)
    and a high angle (never after the turn).'
  composition: 'The car''s flank fills everything behind him, so the jacket never meets the dusk sky (G4
    Q4 option a). The crank ends at frame centre in both hands. Rejected: a road-side low angle (sky behind
    the jacket at 1.01:1).'
  lighting: The open door's dark interior behind him as he leans in; the afterglow rim on his back and
    hands; the phone, now in his lap, underlights the crank when he sits back.
  movement: 'Static: the strongest angle needs no move; the pushes are for the choice and the effort.'
  color: Dusk palette; the crank's neutral body gets the only warm rim.
  blocking: 'Onto one knee rather than standing (keeps the jacket below the roof line and keeps the action
    close to the ground). Both hands on the crank: the contrast with SC01''s one-handed shove (story.crank_plant).'
  animation: 'The same object, now held with care: in SC01 the lid fell and the brick was shoved away
    with one hand; here he lowers the lid by hand, lifts the crank so its weight shows, and cradles it
    in both hands (story.crank_plant). He never stands: a kneel and a lunge keep the jacket below the
    roof line (camera.framing.jacket_off_sky) and keep the effort close to the ground. Every move overlaps
    the next with ease-in-out and no overshoot, so it reads deliberate even though it is efficient, and
    the last 6 frames are a still hold with the crank in both hands for the low angle''s decision beat.
    Rejected: standing up and walking to the door (breaks the jacket rule and costs time) and a knee-walk
    shuffle (reads as scrambling, the comic register).'
