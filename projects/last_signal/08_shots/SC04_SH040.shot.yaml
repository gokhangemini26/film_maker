  - 0.5
  end_position: null
  look_at: ren
  dof:
    enabled: false
composition:
  framing: medium
  aspect_ratio: 1.778
  subject_position: centre_right
  notes: 'Lens 0.5 m, tilt up 12 deg (camera.height.low the_turn). He never stands: kneeling and leaning
    in keeps his jacket below the car roof line, so the ray from the lens through the jacket top hits
    the car (about 1.16-1.28 m < 1.45 m roof; camera.framing.jacket_off_sky). The crank at 10 % of frame
    width or more when held.'
