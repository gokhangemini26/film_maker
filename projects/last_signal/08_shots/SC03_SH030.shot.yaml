rationale:
  camera: '24 mm mild low, lens 0.15 m under his canon eye: the only way to put his face and the ceiling
    in one frame, and the lens that lets the panels loom (camera.lens.roles: shop low angle to the ceiling).
    Re-aimed for the G5 re-review finding 1: aimed at ceiling_panels the lens tilted up about 20 deg (about
    24 deg in the approved version), 2.5 times the locked 8 deg maximum for the SC03 wary check in camera.height.low.
    Aimed at his head from about 1.5 m and 0.90 m high, the tilt is 6.9 deg; the 24 mm''s 46 deg vertical
    field still carries the panels at about 4-26 deg above the horizon, so they hang in the upper frame
    without the camera looking up at them. The lens stays west of his axis (x 3.85) so the panels clear
    the westmost fridge. Rejected: keeping look_at ceiling_panels (it needs a lens about 13 m away to
    fall under 8 deg); a change request for an SC03 tilt exception (the beat reads at 7 deg, so the locked
    rule does not need to bend); a lens inside the wall slab nearer him (a closer lens must tilt up further
    to hold his head and the panels); a cutaway of the panels alone (he must be the one waiting).'
  composition: 'His face just above centre with the lit panels stacked above it: the threat hangs right
    over his head, where he looks. The stand he plugged into is a block at frame left, the fridge flank
    closes the right. Rejected: his face low right with the panels across the top (that framing needs
    about 20 deg of tilt, see camera). The earlier objection to centring him (it would pre-echo the failure
    frame) does not apply here: the failure frame is the high wide master SH050, and this low medium shares
    neither its height, size nor lens.'
  lighting: 'Panels steady and bright: ''nothing happens'' is a lighting non-event.'
  movement: 'Static: the delay only works in a still frame.'
  color: Cool panels above, warm skin below.
  blocking: Eyes up for about 16 frames, then down; his shoulders begin to drop at the cut.
  animation: 'The wary half of the "wary relief" (G3 finding 7): he expects the pattern, freezes looking
    at the panels, and nothing happens. Eyes first, head second, a 14-frame dead hold, then a slow return:
    the slowness of the return is him daring to believe it. The shoulders start to drop on the cut so
    the exhale in SH040 continues one motion. Rejected: a light flicker tease (the room would do a gag
    and spoil the delay) and a quick glance up and down (no suspense).'
