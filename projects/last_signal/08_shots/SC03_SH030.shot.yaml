creative_intent:
  narrative_purpose: Wary, he looks up at the ceiling lights, waiting for the catch. Nothing happens.
  emotional_purpose: 'Comic suspense: we expect the pattern, and it does not come.'
  visual_purpose: 'Slightly low, from beyond the back wall: his upturned, suspicious face just above centre,
    the ceiling panels glowing steadily above it between the stand and the fridge''s flank.'
  audience_effect: The viewer relaxes half a beat too early, as he does.
