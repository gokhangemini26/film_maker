  framing: medium
  aspect_ratio: 1.778
  subject_position: centre
  notes: 'From beyond the back wall, looking north toward the door with the ceiling panels above him.
    The back wall is wild for this shot (camera.geography.sc03 reverse wild_piece): the lens is about
    1.1 m outside the wall plane (wall y 8.95-9.05); the builder hides the wall by its thin-wall rule
    (sightline.walls_to_hide), no shot-specific handling needed. look_at ren: the builder aims once at
    f0, at his head 0.1 m below its centre; computed tilt up 6.9 deg (draft probe 2026-10-02), inside
    the 8 deg of camera.height.low. Lens 0.90 m: 0.15 m under the canon kneeling eye (1.05 m), about 0.27
    m under the rig''s eye. FACT (draft frames f0/f8/f14/f22): his head just above centre (frame x 0.50,
    y 0.58 from the bottom, about 1.5 m away), the display stand a block at frame left, the westmost fridge''s
    flank closing the right third, two to three panels above-left of his head receding toward the door.
    The freeze (f5-f18) reads as his face tipped up toward the panels.'
