rationale:
  camera: '24 mm, the only lens that fits a medium close-up inside the 1.48 m cabin (camera.lens_set);
    lens 1.12 m is within 0.1 m of his 1.20 m eye (eye level: with him, not judging). Rejected: 35 mm,
    which needs a camera outside the car for the same size.'
  composition: 'He sits in the right third facing into the frame''s open left, toward the sunlit windscreen
    and the west he is trying to reach (camera.geography.screen_direction). The closed glovebox edge in
    the foreground plants its place without comment. Rejected: centring him (reads as a failure frame
    before anything has failed).'
  lighting: 'Sun from frame left as a hard rim/three-quarter light on his face; warm dash bounce fills.
    Rejected: flattening him with frontal fill.'
  movement: 'Static: the breath is the movement.'
  color: Warm cabin, cool side-window sky behind; no UI colour visible at this size.
  blocking: 'Phone in his left hand at chest height, right thumb taps: both hands on the phone, as continuity.props.phone_ren
    has for SC01.'
  animation: 'The rehearsed breath is a held pose, not a rubbery take (characters.ren.expressions): in,
    hold with eyes shut, eyes snap open, tap. He does not let the breath out on the tap; the cheeks stay
    full across the cut so the ring insert plays as held breath and the audience holds it with him (the
    shot''s emotional purpose). Rejected: exhaling with the tap, which releases the tension one shot too
    early.'
