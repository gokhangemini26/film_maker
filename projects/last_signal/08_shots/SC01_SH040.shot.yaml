creative_intent:
  narrative_purpose: He takes the practised breath and taps call.
  emotional_purpose: Nervous courage; we hold our breath with him.
  visual_purpose: 'Side-on medium close-up from the passenger seat: his chest rises, the thumb goes down
    on the screen; the sun-filled windscreen at frame left.'
  audience_effect: The viewer feels the effort a simple call costs him and wants it answered.
camera:
  lens_mm: 24
  height_m: 1.12
  movement: static
  start_position:
  - 0.55
  - -0.2
  - 1.12
  end_position: null
  look_at: ren
  dof:
    enabled: false
composition:
  framing: medium_close
  aspect_ratio: 1.778
  subject_position: right_third_facing_left
  notes: 'Lateral from the passenger seat (camera.geography.sc01): he faces screen left, west. FG: glovebox
    lid edge bottom-left (closed); MG: Ren, wheel; BG: windscreen full of sun at frame left. Tilt down
    about 3 deg keeps the top frame line below the headliner (G3 finding 3; checked at G6).'
characters:
- id: ren
  position:
  - 1.29
  - -0.3
  - 0.45
  facing: west (screen left), eyes on the phone
  action: the practised breath in; taps call with the right thumb
environment:
  location: ren's car (interior), parked on the street
  weather: clear
  time_of_day: golden hour
lighting:
  ref: look.lighting.sc01
  key:
    source: sun through the windscreen, 6 deg up, from +Y
    temperature_k: 3200
    quality: hard
  fill: warm bounce from the sunlit dash and bonnet
  ambient: cool sky through the side windows (9000 K)
  practicals:
  - dash lights
  - USB adapter amber ring
  notes: Phone glow not visible on his face in the sun.
color:
  dominant: look.color.scene.sc01
  sky: look.color.sky.golden_hour
animation:
  timing:
    fps: 24
    frames: 30
    index: 0-based; f0 is the first frame, t = f / 24
  characters:
    ren:
      locomotion:
        type: none
        note: seated
      keys:
      - f: 0
        t: 0.0
        pose: phone in the left hand at chest height about 0.3 m from his face, right thumb poised, elbows
          tucked, neck forward; eyes on the phone
      - f: 2
        t: 0.08
        pose: 'breath in begins: chest and shoulders rise 2 cm (ease-in), cheeks start to fill'
      - f: 7
        t: 0.29
        pose: 'eyes shut, cheeks full: the rehearsed breath'
      - f: 8
        t: 0.33
        pose: true hold, nothing moves (8 f)
      - f: 16
        t: 0.67
        pose: eyes open in one frame (cel switch), cheeks still full
      - f: 18
        t: 0.75
        pose: right thumb comes down
      - f: 20
        t: 0.83
        pose: tap on the call button (2 frames of contact)
      - f: 22
        t: 0.92
        pose: thumb lifts 1 cm and hovers; he holds his breath, cheeks full, eyes wide on the phone; still
          to the cut
      face: rehearsed_breath (cheeks_fill, eyes_closed, eyes_open); no graphic symbols
      secondary:
      - jacket shoulders rise with the breath (skinning only)
      eyeline: the phone throughout, including through the closed-eye hold (head does not turn)
  props:
    phone_ren: screen away from the sun; glow not visible
  camera:
    easing: none
    notes: 'locked off: the breath is the movement'
render: {}
assets:
