rationale:
  camera: '35 mm at his kneeling eye level, in front of his lit face (the lit side, camera.phone_lit.framing).
    Rejected: a close-up on 85 (the tender section''s lens, too early) and a side angle (the phone light
    would rim only). Moved with him to the stand (builder reach fix: at (3.45, 8.66) facing +y his right
    hand reaches the socket within 2 cm; the old spot (2.2, 8.0) was about 2.05 m from the stand, reach
    error about 1.22 m): his face is now 0.23 m from the back wall, so the 0.9 m reverse needs the wild
    back wall the geography canon already allows. The lens moved 0.3 m west of his axis because from straight
    in front the door sits behind his head and the near gondola hides its east half; from here its west
    strip shows beside his head. Rejected: a lens inside the wall slab (0.3 m from his face, a 35 mm close-up
    that breaks the shot-size arc) and a lens on the fridge side (off the lit side).'
  composition: 'Centred and still with the door as a tiny warm strip above his right shoulder: the room
    he crossed is now just a far light (the lighting bible''s post-blackout hierarchy). The phone is the
    brightest thing near his face (L9).'
  lighting: Phone key from below-front, soft 0.5 m falloff, no fill; faint door rectangle; contrast 16:1
    (look.lighting.sc03 blackout). Exposure target 0.12 mean brightness is the human-ruled value, within
    the locked look.exposure.scene_keys.SC03_blackout tolerance 0.08±0.06, matching look.lighting.sc03_blackout_render
    checks.mean_luma_target.
  movement: 'Static: the held stillness is the beat and the first time the film stops.'
  color: 'Warm-white glow on skin against blue-black: the colour that will carry the rest of the film.'
  blocking: He stays exactly still (screenplay 'He doesn't move'); the only motion is one slow blink.
  animation: 'The screenplay''s "he doesn''t move" taken literally: a true held pose for 28 frames, the
    longest comic hold, and then one 12-frame slow blink at about 1.2 s, the first unhurried motion of
    his face. The blink is the hinge: before it the freeze is funny, after it the stillness is a little
    sad, which hands the film to the tender half. Rejected: a sigh or a head drop (would resolve the hold
    and give him a reset he no longer makes) and a breathing idle (softens the stop).'
