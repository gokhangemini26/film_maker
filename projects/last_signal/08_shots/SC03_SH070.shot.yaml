  notes: 'Reverse from behind the back wall, looking north up the west aisle (camera.geography.sc03).
    The back wall is wild for this shot: the lens is about 0.5 m outside the wall plane (wall y 8.95-9.05).
    DEPENDENCY for the builder: the preview only drops set pieces whose box contains the lens, so shop_wall_back
    must be hidden for this shot. Lens 0.3 m west of his axis (about 20 deg off his facing, on his right,
    within the 45 deg lit side). FG: phone and hands at the frame bottom (source in frame, camera.phone_lit.framing);
    MG: his lit face, centred; BG: the dark west aisle and the west strip of the warm door rectangle above
    his right shoulder, about a quarter of frame width left of his face (computed), the dark stand flanking
    frame left and the westmost fridge''s flank at frame right. 48 frames: the longest comic hold (2.0
    s minimum). Hard cut to the dusk kerb.'
