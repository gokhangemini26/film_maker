creative_intent:
  narrative_purpose: In the dark he does not move; the phone's glow on his face is the only light.
  emotional_purpose: 'The longest comic hold turning quiet: funny, then a little sad, the hinge toward
    the tender half.'
  visual_purpose: 'From the back wall: his phone-lit face, the long dark aisle behind him and the faint
    warm door rectangle far away.'
  audience_effect: The viewer stops laughing just enough to feel for him; the glow on his face becomes
    the film's thread.
