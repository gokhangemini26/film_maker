creative_intent:
  narrative_purpose: 'Clunk: the fridges stop humming and every light in the shop goes out at once.'
  emotional_purpose: 'The biggest laugh of the comedy, with a sting: the world has beaten him again, room-sized.'
  visual_purpose: 'The same high wide master as his entry: a bright shop, then in one frame darkness,
    with only a small pool of phone light around his kneeling figure at the far end.'
  audience_effect: The viewer sees the whole room fail at once and feels how small his light is.
