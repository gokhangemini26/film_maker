  notes: Identical to SC03_SH010 (camera.geography.sc03 master reused_for blackout). Lit for 8 frames,
    blackout on the clunk at frame 9 (one frame), 22 frames held in near-black. Widest frame of the film
    (camera.framing.shot_size_arc). He faces away from the lens, so the glow reads as a pool around him
    on the stand and the floor, not on his face; his lit face is SH070.
