rationale:
  camera: 'The unchanged master: the gag is the room, not a cut (camera.geography.sc03). The strongest
    high angle is spent on the bigger failure (camera.height.high). Rejected: a close-up on the blackout
    (repeats the car, G2 finding 2). The lens moved with SH010 to x 2.65 (still above the doorway) so
    the two master frames stay identical and he is not hidden by the near gondola at the new kneel spot
    (builder reach fix: at (3.45, 8.66) facing +y his right hand reaches the socket within 2 cm; the old
    spot (2.2, 8.0) was about 2.05 m from the stand, reach error about 1.22 m).'
  composition: Nothing changes in the frame except the light, which is the joke; he stays small at the
    far end.
  lighting: All shop sources off in one frame on the clunk; no fill; the phone's glow is the only source
    left (look.lighting.sc03 blackout). The phone motif is born here (look.style.motifs).
  movement: Static; no shake on the clunk (camera.movement.forbidden).
  color: 'From cool bright to near-black with one warm-white point: the phone glow colour''s first appearance
    (look.color.phone_glow).'
  blocking: He does not move at all through the blackout.
  animation: 'The gag is that nothing moves: eight frames of a relaxed man, then the room switched off
    around him. Any flinch would give the joke to his body; stillness gives it to the world, the biggest
    and most room-sized failure (tone.comedy_source). The charge-loss dip on the blackout frame makes
    the little pool of phone light stutter once and come back, the only thing left alive in the frame.
    His reaction is saved for SH070. Rejected: a startled jump (slapstick) or a head turn to the ceiling
    (repeats SH030).'
