composition:
  framing: medium_wide
  aspect_ratio: 1.778
  subject_position: centre_upper
  notes: On-axis (neutral bridge, camera.geography.screen_direction). Tilt down about 11 deg so the frame
    top sits below the sun (sun disc never in frame, camera.framing.sky_and_wires); a ground-heavy one-point
    frame (look.style.composition comic). His body stays between the lens and the sun's direction. 14
    frames (elliptical cut 2 of 3).
