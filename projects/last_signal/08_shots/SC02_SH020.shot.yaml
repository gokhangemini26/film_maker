rationale:
  camera: '35 mm for the street (camera.lens.roles), at his eye height but tilted down: the frame is all
    pavement and long shadow, the sun kept just above the frame line. Rejected: level framing into the
    sun (sun disc in frame, forbidden) and a telephoto chase (not in the lens set).'
  composition: 'Symmetric one-point street frame, allowed in the comic section when the world is bigger
    than him (look.style.composition); he is centred, small, running into it. Rejected: a lateral run
    (a second lateral after SH010 reads as one continuous run and loses the ellipsis).'
  lighting: 'Backlight: rim and silhouette, long shadow toward the lens (look.lighting.sc02). The awning
    ahead catches the sun.'
  movement: 'Static: he runs away from us; the ellipsis does the work.'
  color: Gold rim on a cool-shadowed figure; the pavement warm.
  blocking: Phone out ahead 'like a compass' (SCREENPLAY), cable looped in the same hand (continuity.props.cable).
  animation: 'The legs work and the phone arm does not: the compass run of characters.ren.movement, which
    is what makes the hurry funny and earnest rather than frantic. A 4.2 m/s run covers 2.4 m in the 14
    frames, so the figure visibly shrinks into the sun-lit pavement and sells distance inside an elliptical
    cut. Rejected: swinging arms and a flailing sprint (manic slapstick, tone.anti_goals).'
