    frames: 14
    index: 0-based; f0 is the first frame, t = f / 24
  characters:
    ren:
      locomotion:
        type: run
        speed_mps: 4.2
        cadence: one step every 6 frames (4 steps/s, stride about 1.05 m)
        path: along the pavement away from the lens, about 4.8 m -> 7.2 m from the camera (2.4 m in 14
          f); centred on the shot's position y 6.0
      keys:
      - f: 0
        t: 0.0
        pose: right foot contact; left arm straight out ahead holding the phone, right forearm tucked
