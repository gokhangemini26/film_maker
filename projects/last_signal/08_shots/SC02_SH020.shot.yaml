creative_intent:
  narrative_purpose: Mid-run up the empty pavement, phone held out in front of him.
  emotional_purpose: Breathless, earnest hurry; funny because the phone leads him like a compass.
  visual_purpose: 'From behind on the street axis: his backlit silhouette running into the gold, the shop
    awning ahead, long shadow toward us.'
  audience_effect: The viewer feels the distance being eaten up without watching all of it.
