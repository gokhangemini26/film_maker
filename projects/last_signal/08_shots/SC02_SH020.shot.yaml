        t: 0.38
        pose: airborne
      - f: 12
        t: 0.5
        pose: right foot contact
      - f: 13
        t: 0.54
        pose: toe-off; cut
      face: not visible (from behind)
      secondary:
      - head bob 3-4 cm on contacts
      - jacket hem flares and swings with the hips (skinning / shape keys)
      - cable loop swings opposite each stride (two posed shapes)
      - 'the phone arm stays rigid: no swing'
      eyeline: ahead, over the phone
  camera:
    easing: none
    notes: locked off; he runs away from the lens
