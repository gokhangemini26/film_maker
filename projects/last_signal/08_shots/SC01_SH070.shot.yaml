shot_id: SC01_SH070
scene_id: SC01
sequence_id: SQ01
status: APPROVED
duration_s: 2.4167
serves:
- intent.race_against_battery
- intent.open_hopeful_ending
creative_intent:
  narrative_purpose: 'He types the first half of the invitation: ''Are you free tonight?'''
  emotional_purpose: Hope, a little shy; the words are simple but they matter.
  visual_purpose: The compose field above blank keys, his two thumbs typing; the four words at a cap height
    of 3.5 % of frame height or more, held after the last word.
  audience_effect: The viewer reads the message and wants it sent; the only text in the film is introduced.
camera:
  lens_mm: 85
  height_m: 1.25
  movement: static
  start_position:
  - 1.29
  - -0.38
  - 1.12
  end_position: null
  look_at: phone_ren
  dof:
    enabled: true
    f_stop: 5.6
    focus_target: phone_ren_screen_plane
composition:
  framing: insert
  aspect_ratio: 1.778
  subject_position: upper_half_of_frame
  notes: Text insert (frame about 71 mm tall at the screen). Compose field in the upper half, top row
    of blank keys at the lower edge; status bar out of frame. Typing 16 frames, then 42 frames of hold
    after the last word (0.5 s + 4 x 0.3 s = 1.7 s = 41 frames minimum).
characters:
- id: ren
  position:
  - 1.29
  - -0.3
  - 0.45
  facing: the phone
  action: types with both thumbs; thumbs stay below the compose field
environment:
  location: ren's car (interior), parked on the street
  weather: clear
  time_of_day: golden hour
lighting:
  ref: look.lighting.sc01
  key: phone screen emission (UI)
color:
  dominant: look.color.ui
  accent: null
animation:
  timing:
    fps: 24
    frames: 58
    index: 0-based; f0 is the first frame, t = f / 24
  characters:
    ren:
      locomotion:
        type: none
      keys:
      - f: 0
        t: 0.0
        pose: both thumbs on the blank keys, below the compose field
      - f: 0
        t: 0.0
        pose: 'two-thumb burst: taps alternate thumbs on 1s f0-15'
      - f: 15
        t: 0.62
        pose: last tap ('?')
      - f: 16
        t: 0.67
        pose: both thumbs lift away and down (ease-in)
      - f: 20
        t: 0.83
        pose: thumbs at rest on the frame's bottom edge, still to the cut
      secondary: []
      eyeline: off frame; implied on the text
  ui:
    text: '''Are you free tonight?'' (21 characters) appears f0-15 at about 1.3 characters per frame,
      on the tap frames'
    keys: each pressed key darkens for 1 frame
    cursor: steady (no blink) so nothing competes with the text during the hold
    hold: last character at f15; text held f16-57 (42 frames, minimum 41)
  camera:
    easing: none
    notes: locked off (no move in inserts)
  notes: 'ASSUMPTION: the typing speed is an anime ellipsis, not real typing (about 31 characters per
    second); it is what lets the 42-frame reading hold fit the 58-frame shot'
render: {}
assets:
- world.props.phone_ren
- ui.compose_field
- ui.keyboard_blank
rationale:
  camera: '85 mm text insert sized for a 2.5 mm cap height at 3.5 % of frame height (camera.inserts.legibility,
    L8). Rejected: the full screen (text at about 1.6 %).'
  composition: 'The words in the upper half where the eye enters; the thumbs work below them so no letter
    is covered. Blank keys only; no letters anywhere (look.style.phone_ui). Rejected: framing the keyboard
    fully (visual noise under the only text).'
  lighting: Screen-lit; UI exposure set for 7:1 text contrast (look.style.phone_ui).
  movement: Static (no move in inserts).
  color: 'Dark ink on the pale compose field; no red yet: the status bar is out of frame, so the red change
    is saved for the next insert.'
  blocking: Two-thumb typing, then both thumbs lift away and rest at the frame bottom for the hold.
  animation: 'Comic-section typing is a two-thumb burst: these are rehearsed words and they come out in
    one go, which is both his hope and his hurry. The burst is short so the reading hold is long (42 frames):
    the words matter more than the typing. The thumbs leave the text area at once and park at the bottom
    edge. It is the deliberate opposite of the tender half, where one thumb glides slowly while the other
    hand cranks (SC04_SH050, SC04_SH060). Rejected: letter-by-letter real-time typing (about 4 s, it cannot
    fit and it would make the line a chore to watch).'
style_break: null
