creative_intent:
  narrative_purpose: He plugs the phone into the crank, unfolds the handle and turns it, slow and steady;
    the glow on his face stops flickering and holds.
  emotional_purpose: 'Tenderness through effort: quiet, sincere, only the ratchet and his breath.'
  visual_purpose: 'Medium easing to medium close-up: the crank in his right hand turning, its amber pip
    lit, the cable loop over his knee, and the light on his face going steady.'
  audience_effect: The viewer sees his effort turn into light and begins to believe the message will go.
