rationale:
  camera: '50 mm at eye level, the tender lens at his distance. Rejected: an 85 mm close-up of the crank
    alone (the effort must be seen on him, not only on the object). Position corrected after the first
    preview (PREVIEW_REVIEW #3): the approved lens sat due south of him while he faces south, so he rendered
    full frontal and centred, against right_third_facing_left. Keeping his facing (locked in camera.geography.sc04_sc06
    and matched by the SC04 inserts) and moving the lens 30 deg east along the pavement gives the three-quarter
    with the same distances and push. Rejected: turning him west-south-west instead (breaks the locked
    geography and his position in the inserts) and composing him centred and frontal (the tender section
    is off-centre, look.style.composition).'
  composition: 'Crank and phone in one frame with his face: the cause (hand), the effect (pip, glow) and
    the person. Lead room screen left. Rejected: a crank insert here (would cut the continuity of effort
    into pieces).'
  lighting: The flicker stops on the first turn and the phone key holds steady (look.lighting.sc04 key_states);
    the amber pip lights only his crank hand. The light change is the story beat.
  movement: 'Push-in 2 of 2 (camera.movement.push_in), starting with the first turn: his effort moves
    the audience closer. Rejected: a push through the whole shot (the move would not be caused by the
    crank).'
  color: 'The amber pip joins the phone''s warm white: amber works for the first time (look.style.motifs
    pattern fails_twice_works_third_time).'
  blocking: Crank in the right hand, phone in the left; the cable loops over his knee (continuity.props.cable).
  animation: 'Tenderness through effort: plug, unfold, turn, each step unhurried and finished before the
    next, and then a steady one-turn-per-second rhythm with his breath locked to the handle (characters.ren.movement),
    so the audience hears and sees the same effort. The unused hinge gives a 2-frame resistance, a quiet
    echo of the plant. The flicker''s last dip is at f26 and the light holds from the first turn at f30,
    the same frame the camera starts to move, so light, lens and effort change together (camera.movement.push_in).
    The brick is clamped high, between the tops of his knees and tipped toward the lens, because from
    the pavement lens his near knee would otherwise hide it: the pip is the visible proof of his effort
    (look.lighting.power_indicators) and must stay above the knee in every key, and a crank held high
    also keeps crank and face inside one medium frame. The phone sits beside it, over the near knee, never
    in front of it. Clamping frees the left hand for the phone, and the left thumb glides the next words
    slowly while the right hand keeps turning: one-handed typing while cranking, as the canon allows.
    Rejected: the brick low in the lap (hidden by the near knee; the first preview lost it), the crank-pause-type
    fallback (it breaks the rhythm that makes the effort legible) and a fast, strained crank (desperation,
    not tenderness).'
