- scene_id: SC01
  heading: INT. REN'S CAR - GOLDEN HOUR
  summary: Beats 1-3 (0-22 s). Mirror check, fork-and-knife map pin, call to her photo rings out (5%).
    He starts typing; battery turns red (4%). Engine on, crank charger clunks out of the glovebox and
    is shoved back (plant); plugs in, engine dies, dash goes dark (3%). Forehead to the wheel.
  est_duration_s: 22
  characters:
  - ren
  location: ren's car (interior), parked on the street
  time_of_day: golden hour
  weather: clear
  sequence_id: SQ01
