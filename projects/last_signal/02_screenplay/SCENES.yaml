  heading: EXT. STREET - GOLDEN HOUR
  summary: Beat 4, first part (22-24 s). He runs from the car up the empty pavement into the corner shop.
  est_duration_s: 2
  characters:
  - ren
  location: street
  time_of_day: golden hour
  weather: clear
  sequence_id: SQ01
- scene_id: SC03
  heading: INT. CORNER SHOP - GOLDEN HOUR
  summary: Beat 4, second part (24-34 s). Socket behind a display, on his knees, bolt appears; the whole
    shop goes dark (2%). His lit face is the only light.
  est_duration_s: 10
  characters:
  - ren
  location: corner shop (interior)
  time_of_day: golden hour
  weather: clear
  sequence_id: SQ01
- scene_id: SC04
  heading: EXT. STREET, KERB BY REN'S CAR - DUSK
  summary: 'Beats 5-7 (34-53 s). The turn: on the kerb at 1% blinking, he takes the crank from the glovebox
    with care. Slow cranking, finishes the invitation, types and deletes a heart, 1% to 2%. Send, progress,
    tick; he lets go of the handle.'
  est_duration_s: 19
  characters:
  - ren
  location: street, kerb beside ren's car
  time_of_day: dusk
  weather: clear
  sequence_id: SQ02
- scene_id: SC05
  heading: INT. HANA'S ROOM - EVENING
  summary: Beat 8 (53-57 s). Sketching with headphones on; her phone lights with his photo; she slides
    the headphones down, reads, small smile.
  est_duration_s: 4
  characters:
  - hana
  location: hana's room, desk by the window
  time_of_day: evening
  weather: clear
  sequence_id: SQ02
- scene_id: SC06
  heading: EXT. STREET, KERB BY REN'S CAR - DUSK - MOMENTS LATER
  summary: Beat 9 (57-60 s). His screen fades to black; he leans back against the car, dark phone on his
    chest, looking up at the dusk sky. Final image.
  est_duration_s: 3
  characters:
