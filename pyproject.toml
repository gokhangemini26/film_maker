[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-maker"
version = "0.1.0"
description = "FILM_MAKER - deterministic core (fm CLI) for an AI-assisted film and animation production system"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fm = "fm.cli:main"

[tool.setuptools]
package-dir = { "" = "core" }

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
fm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
