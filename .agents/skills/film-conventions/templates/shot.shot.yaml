# 08_shots/SC01_SH010.shot.yaml — one file per shot; ids step by 10 so shots can be inserted.
shot_id: SC01_SH010
scene_id: SC01
sequence_id: SQ01
status: PROPOSED
duration_s: 5.0
serves: [intent.isolation]
creative_intent:
  narrative_purpose: What the audience must learn from this shot.
  emotional_purpose: What they should feel.
  visual_purpose: What the image must show to make that happen.
  audience_effect: What they will notice or anticipate afterwards.
camera:
  lens_mm: 35
  height_m: 1.6
  movement: static            # static | pan | tilt | dolly_in | dolly_out | track | crane | handheld
  start_position: [0.0, -12.0, 1.6]   # metres, Z up (Blender convention); optional until M3
  end_position: null
  look_at: mara               # character id or a named mark
  dof: {enabled: false}
composition:
  framing: wide               # extreme_wide | wide | full | medium | medium_close | close | extreme_close | insert
  aspect_ratio: 2.39
  subject_position: lower_right_third
  notes: Foreground / midground / background staging, leading lines, negative space.
characters:
  - id: mara
    position: [3.0, 0.0, 0.0]
    facing: screen_right
    action: walking slowly, head down
environment:
  location: harbour street    # must match continuity canon and SCENES.yaml
  weather: rain
  time_of_day: night
lighting:
  key: {source: sodium streetlamp frame left, temperature_k: 2200}
  fill: none
  practicals: [shop sign out of focus, far background]
  notes: Motivated only; no light near her.
color:
  dominant: look.color.primary       # refer to canon ids, not raw hex
  accent: null
animation: {}                        # filled by the animation-director
render: {}                           # filled in M3
assets: []
rationale:
  camera: Choice + mechanism + rejected alternative.
  composition: ...
  lighting: ...
  movement: ...
  color: ...
  blocking: ...
  animation: ...                     # animation-director
style_break: null                    # {reason: "..."} only when deliberately breaking the style lock
continuity_refs: [continuity.sc01.weather]
derived_from:
  - ref: artifact:shot_list
  - ref: artifact:cinematography_bible
